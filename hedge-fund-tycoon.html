/* =============================================================================
   4. MARKET — prix, régimes, corrélations
   ============================================================================= */
const Market = {
  _loadCache: {},

  /* Sensibilités aux facteurs dans un régime : en période de stress, la
     sensibilité au marché se rapproche de 0,9 (tout baisse ensemble) et les
     valeurs refuges deviennent négativement corrélées au marché. */
  loadings(regime) {
    if (this._loadCache[regime]) return this._loadCache[regime];
    const st = CONFIG.REGIMES[regime].corrStress;
    const out = {};
    for (const k of RISKY) {
      const A = CONFIG.ASSETS[k], L = Object.assign({ M: 0, R: 0, O: 0, S: 0 }, A.L);
      const tgt = A.safe ? -0.4 : (L.M > 0.3 ? 0.9 : L.M);
      const x = { M: L.M + (tgt - L.M) * st, R: L.R * (1 - st * 0.5), O: L.O * (1 - st * 0.5), S: L.S * (1 - st * 0.5) };
      const n = Math.hypot(x.M, x.R, x.O, x.S);
      if (n > 0.97) for (const f in x) x[f] *= 0.97 / n;
      out[k] = x;
    }
    return (this._loadCache[regime] = out);
  },
  /* Corrélation théorique entre deux actifs = produit scalaire des sensibilités */
  corrMatrix(regime) {
    const Ld = this.loadings(regime);
    return RISKY.map(a => RISKY.map(b => a === b ? 1 : ['M', 'R', 'O', 'S'].reduce((t, f) => t + Ld[a][f] * Ld[b][f], 0)));
  },
  /* Impact (variation de prix) d'un choc sur les facteurs, ex. { M: -0.05, R: 0.04 } */
  impact(k, x) {
    const A = CONFIG.ASSETS[k], L = A.L || {};
    let r = 0;
    for (const f in x) r += (L[f] || 0) * (A.vol / CONFIG.FACTORS[f].ref) * x[f];
    return clamp(r, -0.6, 1);
  },
  factorShock(x, recover = true) { const map = {}; for (const k of RISKY) { const v = this.impact(k, x); if (Math.abs(v) > 1e-4) map[k] = v; } this.shock(map, recover); return map; },
  factorMod(x, weeks) { for (const k of RISKY) { const v = this.impact(k, x); if (Math.abs(v) > 0.002) this.addModifier(k, v, weeks); } },

  /* Rendement annuel espéré d'un actif dans le régime courant (+ modificateurs) */
  expectedMu(k, regime) {
    const m = S.market;
    const mode = CONFIG.MODES[S.difficulty];
    const rg = regime || m.regime;
    let mu = CONFIG.REGIMES[rg].mu[k] ?? CONFIG.ASSETS[k].rmu[rg];
    if (mu < 0) mu *= mode.negDriftMult;
    for (const md of m.mods) if (md.k === k || md.k === 'all') mu += md.mu;
    return mu;
  },
  effVol(k, regime) {
    const mode = CONFIG.MODES[S.difficulty];
    return CONFIG.ASSETS[k].vol * CONFIG.REGIMES[regime || S.market.regime].volMult * mode.volMult;
  },

  /* Transition markovienne du régime */
  stepRegime(silent) {
    const m = S.market;
    const prev = m.regime;
    if (m.forced && m.forced.weeks > 0) {
      m.forced.weeks--;
      m.regime = m.forced.regime;
      if (m.forced.weeks <= 0) {
        const after = m.forced.after;
        m.forced = null;
        if (after && rng() < after.p) m.regime = after.regime;
      }
    } else {
      m.regime = pickWeighted(CONFIG.REGIME_TRANSITIONS[m.regime]) || m.regime;
    }
    if (m.regime !== prev) {
      m.regimeWeeks = 0;
      if (!silent) {
        const r = CONFIG.REGIMES[m.regime];
        const type = m.regime === 'crisis' ? 'bad' : (m.regime === 'bull' ? 'good' : 'warn');
        Game.log(`Changement de régime de marché : ${r.icon} ${r.name}.`, type);
      }
      return prev;
    }
    m.regimeWeeks++;
    return null;
  },

  /* Une semaine de marché. Retourne les rendements dans m.lastReturns. */
  step(silent) {
    const m = S.market;
    const prev = this.stepRegime(silent);
    // Chocs de transition : éclatement de bulle / entrée en crise
    const jump = {};
    if (prev && m.regime === 'crisis') {
      const sev = CONFIG.MODES[S.difficulty].eventSeverity;
      const jx = prev === 'bubble' ? { M: -0.08, S: -0.25 } : { M: -0.05, S: -0.08 };
      for (const k of RISKY) jump[k] = this.impact(k, jx);
      if (prev === 'bubble') {
        if (!silent) { Game.log('💥 La bulle éclate ! Krach sur les actifs risqués.', 'bad'); UI.toast('💥 La bulle éclate !', 'bad'); }
      } else {
        if (!silent) UI.toast('🔥 Le marché entre en crise.', 'bad');
      }
      for (const k in jump) jump[k] *= sev;
      if (!silent) S.stats.crises++;
    }
    const mode = CONFIG.MODES[S.difficulty];
    // Modèle à facteurs : choc = Σ sensibilité × facteur commun + part propre
    const Ld = this.loadings(m.regime);
    const F = { M: gauss(), R: gauss(), O: gauss(), S: gauss() };
    m.lastFactors = F;
    RISKY.forEach(k => {
      const l = Ld[k];
      let e = l.M * F.M + l.R * F.R + l.O * F.O + l.S * F.S + Math.sqrt(Math.max(0.01, 1 - l.M * l.M - l.R * l.R - l.O * l.O - l.S * l.S)) * gauss();
      if (rng() < CONFIG.JUMP_PROB) e *= CONFIG.JUMP_MULT;
      const mu = this.expectedMu(k);
      const vol = this.effVol(k);
      let r = mu / 52 + vol * e / Math.sqrt(52);
      if (jump[k]) r = (1 + r) * (1 + jump[k]) - 1;
      r = clamp(r, -0.6, 1.5);
      m.lastMeans[k] = mu / 52;
      m.lastReturns[k] = r;
      m.prices[k] *= 1 + r;
      m.hist[k].push(m.prices[k]);
      if (m.hist[k].length > 60) m.hist[k].shift();
      // Statistiques par régime (onglet Analyse)
      if (!silent) {
        const rs = (m.regStats[k] = m.regStats[k] || {});
        const c = (rs[m.regime] = rs[m.regime] || { s: 0, n: 0 });
        c.s += Math.log(1 + r); c.n++;
      }
    });
    if (!silent) {
      if (prev) Game.regimeReport(prev);
      const r = m.lastReturns;
      if (S.bench.def) S.bench.value *= 1 + Bench.weekReturn(r);   // indice de référence de la stratégie
      S.bench.bal *= 1 + 0.5 * r.equities + 0.35 * r.bonds;    // préréglage Équilibré (15 % cash)
    }
    // Décrément des modificateurs temporaires (événements)
    m.mods.forEach(md => md.weeks--);
    m.mods = m.mods.filter(md => md.weeks > 0);
    if (!silent) this.updatePerception();
  },

  /* L'information visible dépend de la qualité d'information (analystes, quants) */
  updatePerception() {
    const m = S.market;
    const q = Team.infoQuality();
    // Le régime affiché n'est jamais inventé : il est détecté AVEC RETARD.
    // Chaque semaine, un changement de régime est repéré avec une probabilité
    // de 40 % (sans équipe) à 100 % (qualité d'information parfaite).
    const detect = 0.4 + 0.6 * q;
    if (m.perceived !== m.regime && rng() < detect) { m.perceived = m.regime; m.perceivedSince = S.week; }
    m.perceivedConf = detect;
    // Bruit des prévisions persistant (pas de zigzag d'une semaine à l'autre)
    if (!m.fcNoise) m.fcNoise = {};
    RISKY.forEach(k => {
      // Bruit AR(1) dont l'écart-type stationnaire = Portfolio.forecastError(k)
      const fresh = gauss() * Portfolio.forecastError(k);
      m.fcNoise[k] = 0.85 * (m.fcNoise[k] || 0) + 0.527 * fresh;
      m.forecasts[k] = this.expectedMu(k) + m.fcNoise[k];
    });
  },

  /* Volatilité annualisée attendue sur les 13 prochaines semaines : moyenne des
     variances de chaque régime, pondérée par la probabilité d'y être (chaîne de
     Markov partant du régime perçu). */
  expectedVol(k, horizon = 13) {
    const T = CONFIG.REGIME_TRANSITIONS, regs = Object.keys(T);
    let p = Object.fromEntries(regs.map(r => [r, r === S.market.perceived ? 1 : 0]));
    let v = 0;
    for (let t = 0; t < horizon; t++) {
      const np = Object.fromEntries(regs.map(r => [r, 0]));
      for (const a of regs) for (const b of regs) np[b] += p[a] * (T[a][b] || 0);
      p = np;
      for (const r of regs) v += p[r] * this.effVol(k, r) ** 2;
    }
    return Math.sqrt(v / horizon);
  },
  addModifier(k, mu, weeks) { S.market.mods.push({ k, mu, weeks }); },
  forceRegime(regime, weeks, after) { S.market.forced = { regime, weeks, after }; S.market.regime = regime; S.market.regimeWeeks = 0; },

  /* Choc instantané (événements) : prix + positions du fonds */
  /* recover : les baisses liées aux événements se résorbent à 80 % en 13 semaines
     (sinon, les événements à répétition détruiraient de la valeur à long terme) */
  shock(map, recover = true) {
    // Le compte prop et la NAV « modèle » (fonds non lancé) suivent l'allocation cible
    let modelImpact = 0;
    for (const k in map) modelImpact += (S.fund.target[k] || 0) / 100 * map[k];
    if (Prop.active()) S.prop.equity *= 1 + modelImpact;
    if (Portfolio.totalShares() <= 1e-12) S.fund.navps *= 1 + modelImpact;
    for (const k in map) {
      const pct = map[k];
      if (recover && pct < 0) this.addModifier(k, -pct * 0.8 * 52 / 13, 13);
      S.market.prices[k] *= 1 + pct;
      const h = S.market.hist[k]; if (h.length) h[h.length - 1] = S.market.prices[k];
      S.fund.positions[k] *= 1 + pct;
    }
    Portfolio.syncNavps();
  },

  isUnlocked(k) {
    if (k === 'cash') return true;
    if (k === 'crypto' && Strat.b('cryptoEarly') && S.prop.launched) return true;
    return S.tier >= CONFIG.ASSETS[k].tier;
  },

  /* Génère un historique de départ (pour les sparklines) */
  warmup(weeks) { for (let i = 0; i < weeks; i++) this.step(true); S.market.perceived = S.market.regime; S.market.perceivedSince = 0; this.updatePerception(); }
};

/* =============================================================================
   5. PORTFOLIO — positions, allocation cible, frais, stop-loss, levier
   ============================================================================= */
const Portfolio = {
  /* Valeur liquide (cash + positions) ; l'AUM ajoute les opportunités en cours */
  liquid() { let v = S.fund.cash; for (const k of RISKY) v += S.fund.positions[k]; return v; },
  specialsValue() { return (S.fund.specials || []).reduce((a, x) => a + x.amount, 0); },
  aum() { return this.liquid() + this.specialsValue() + Hedges.value(); },
  totalShares() { let s = 0; for (const inv of S.investors.list) s += inv.shares; return s; },
  gross() { const A = this.liquid(); if (A <= 0) return 0; let g = 0; for (const k of RISKY) g += Math.abs(S.fund.positions[k]); return g / A; },
  weights() {
    const A = this.liquid(); const w = {};
    for (const k of RISKY) w[k] = A > 0 ? S.fund.positions[k] / A : S.fund.target[k] / 100;
    w.cash = A > 0 ? S.fund.cash / A : this.targetCash() / 100;
    return w;
  },
  targetCash() { let s = 0; for (const k of RISKY) s += S.fund.target[k]; return 100 - s; },
  targetGross() { let s = 0; for (const k of RISKY) s += Math.abs(S.fund.target[k]); return s; },
  isCasual() { return S.difficulty === 'casual'; },
  maxLeverage() { if (this.isCasual()) return 1; if (S.tier >= 7) return 5; if (S.tier >= 5) return 2; return 1; },
  shortAllowed() { return !this.isCasual() && S.tier >= 5; },
  autoAvailable() { return this.isCasual() || Team.hasRole('trader') || Progression.upg('autostrat') > 0; },
  minWeight(k) { return this.shortAllowed() && CONFIG.ASSETS[k].shortable ? -50 : 0; },

  /* Recalcule la NAV/part à partir de l'AUM et du nombre de parts */
  syncNavps() {
    const sh = this.totalShares();
    if (sh > 1e-12) S.fund.navps = this.aum() / sh;
  },

  /* Normalise l'allocation cible : actifs verrouillés à 0, bornes, levier max */
  normalizeTarget() {
    const f = S.fund;
    f.leverage = clamp(f.leverage, 1, this.maxLeverage());
    if (![1, 2, 5].includes(f.leverage)) f.leverage = 1;
    for (const k of RISKY) {
      if (!Market.isUnlocked(k) || S.exclusions[k]) { f.target[k] = 0; continue; }
      f.target[k] = clamp(Math.round(f.target[k]), this.minWeight(k), f.leverage * 100);
    }
    const g = this.targetGross(), cap = f.leverage * 100;
    if (g > cap) for (const k of RISKY) f.target[k] = Math.trunc(f.target[k] * cap / g);
  },

  feeReduction() {
    const e = Team.effects();
    return clamp(e.fee + Progression.upg('software') * 0.15 + Progression.tierBonus('trading') + Strat.b('fee'), 0, 0.8);
  },
  feeRate(k) { return CONFIG.ASSETS[k].fee * (1 - this.feeReduction()); },

  /* Coût estimé d'un rééquilibrage vers la cible */
  estimateRebalance() {
    const A = this.liquid(); if (A <= 0) return 0;
    let fee = 0;
    for (const k of RISKY) fee += Math.abs(S.fund.target[k] / 100 * A - S.fund.positions[k]) * this.feeRate(k);
    return fee;
  },
  drift() {
    const A = this.liquid(); if (A <= 0) return 0;
    let d = 0;
    for (const k of RISKY) d = Math.max(d, Math.abs(S.fund.positions[k] / A * 100 - S.fund.target[k]));
    return d;
  },

  /* Exécute le rééquilibrage vers l'allocation cible (frais selon liquidité) */
  rebalance(manual = false) {
    this.normalizeTarget();
    const f = S.fund, A = this.liquid();
    if (A <= 0) return 0;
    let fee = 0, invested = 0;
    for (const k of RISKY) {
      const desired = f.target[k] / 100 * A;
      const trade = desired - f.positions[k];
      fee += Math.abs(trade) * this.feeRate(k);
      // Prix de référence du stop-loss : ouverture, retournement ou rééquilibrage manuel
      const opening = Math.abs(f.positions[k]) < 0.005 * A || Math.sign(desired) !== Math.sign(f.positions[k]);
      if ((manual && Math.abs(trade) > 0.005 * A) || opening) f.refPrice[k] = S.market.prices[k];
      f.positions[k] = desired;
      invested += desired;
    }
    f.cash = A - invested - fee;
    S.last.txFees += fee;
    this.syncNavps();
    return fee;
  },

  /* Multiplie toutes les lignes (flux proportionnels, frais) */
  scale(factor) {
    const f = S.fund;
    for (const k of RISKY) f.positions[k] *= factor;
    f.cash *= factor;
  },
  deposit(amount) {
    if (amount <= 0) return;
    const A = this.liquid();
    if (A < 1e-6) {
      for (const k of RISKY) S.fund.positions[k] = 0;
      S.fund.cash = amount;
      this.rebalance();
    } else this.scale((A + amount) / A);
  },
  withdraw(amount) {
    const A = this.liquid();
    if (A <= 0 || amount <= 0) return 0;
    amount = Math.min(amount, A);
    this.scale((A - amount) / A);
    return amount;
  },

  /* Étape 2 du tick : applique les rendements du marché au portefeuille */
  applyReturns() {
    const f = S.fund, m = S.market;
    const A0 = this.liquid();
    S.last.pnl = {};
    const highRisk = S.risk > CONFIG.RISK_ALERT;
    let modelRet = 0, shortVal = 0;
    for (const k of RISKY) {
      let r = m.lastReturns[k];
      // Risque > 70 : volatilité effective accrue (écarts amplifiés de 20 %)
      if (highRisk) r = m.lastMeans[k] + (r - m.lastMeans[k]) * 1.2;
      const a = this.alpha(k) / 52;
      const pos = f.positions[k];
      f.positions[k] = pos + pos * r + Math.abs(pos) * a;
      S.last.pnl[k] = pos * r + Math.abs(pos) * a;
      if (pos < 0) shortVal += -pos;
      modelRet += f.target[k] / 100 * (r + a);
    }
    // Cash du fonds : rémunéré (0 %) ou emprunté (levier)
    if (f.cash >= 0) f.cash *= 1 + CONFIG.CASH_RATE / 52;
    else f.cash *= 1 + CONFIG.BORROW_RATE / 52;
    f.cash -= shortVal * CONFIG.SHORT_COST / 52;
    const tc = this.targetCash();
    if (tc < 0) modelRet -= -tc / 100 * CONFIG.BORROW_RATE / 52;

    const A1 = this.liquid();
    if (A0 > 0 && A1 <= 0) { S.last.propReturn = modelRet; this.liquidate(); return; }
    if (this.totalShares() > 1e-12) this.syncNavps();
    else f.navps *= 1 + modelRet;
    S.last.fundReturn = A0 > 0 ? A1 / A0 - 1 : modelRet;
    S.last.propReturn = modelRet;
  },

  /* Alpha annuel : qualité d'information, quants, spécialités, stratégies auto */
  alpha(k) {
    const e = Team.effects();
    let a = 0;
    if (CONFIG.ASSETS[k].alphaInfo) a += Team.infoQuality() * 0.025;
    a += e.quantAlpha + (e.spec[k] || 0);
    if (Progression.upg('autostrat') > 0) a += 0.01;
    if (CONFIG.ASSETS[k].group === 'actions') a += Strat.b('alphaEq');
    if (k === 'crypto') a += Strat.b('alphaCrypto');
    a += Strat.b('alphaAll');
    return a;
  },

  /* Fonds liquidé (levier excessif) : tous les investisseurs perdent tout */
  liquidate() {
    const f = S.fund;
    for (const k of RISKY) f.positions[k] = 0;
    f.cash = 0;
    f.specials = [];
    S.investors.list = [];
    f.navps = CONFIG.START_NAVPS; f.hwm = f.navps; f.peakNavps = f.navps;
    S.reputation = Math.max(0, S.reputation - 30);
    Game.log('☠️ Le fonds a été entièrement liquidé (valeur nette négative).', 'bad');
    UI.toast('☠️ Fonds liquidé !', 'bad');
  },

  /* Étape 3 du tick : stop-loss, alertes de drawdown, rééquilibrage auto */
  weeklyTrading() {
    const f = S.fund, A = this.aum();
    if (A > 0 && !this.isCasual()) {
      for (const k of RISKY) {
        const sl = f.stopLoss[k], pos = f.positions[k];
        if (!sl || Math.abs(pos) < 1e-9 || !f.refPrice[k]) continue;
        const ch = S.market.prices[k] / f.refPrice[k] - 1;
        if ((pos > 0 && ch <= -sl) || (pos < 0 && ch >= sl)) {
          const fee = Math.abs(pos) * this.feeRate(k);
          f.cash += pos - fee;
          f.positions[k] = 0;
          f.target[k] = 0;
          S.last.txFees += fee;
          Game.log(`Stop-loss déclenché sur ${CONFIG.ASSETS[k].name} (${fmtPct(ch, 1, true)}). Position clôturée.`, 'warn');
          UI.toast(`🛑 Stop-loss : ${CONFIG.ASSETS[k].name}`, 'warn');
        }
      }
      this.syncNavps();
    }
    // Alerte de drawdown
    f.peakNavps = Math.max(f.peakNavps, f.navps);
    const dd = 1 - f.navps / f.peakNavps;
    if (dd >= f.ddAlert && !f.ddAlerted) {
      f.ddAlerted = true;
      Game.log(`⚠️ Alerte drawdown : la NAV est ${fmtPct(dd)} sous son plus haut.`, 'warn');
      UI.toast(`⚠️ Drawdown de ${fmtPct(dd)}`, 'warn');
    } else if (dd < f.ddAlert * 0.5) f.ddAlerted = false;
    // Rééquilibrage automatique (casual, ou trader embauché)
    if (A > 0 && f.autoRebalance && this.autoAvailable() && this.drift() > 2) this.rebalance();
  },

  drawdown() { return 1 - S.fund.navps / S.fund.peakNavps; },

  /* Déplace pct de la NAV vers un actif (utilisé par les événements) */
  shiftInto(k, pct) {
    if (!Market.isUnlocked(k)) k = 'equities';
    const f = S.fund;
    const room = f.leverage * 100 - this.targetGross();
    let add = Math.min(pct * 100, Math.max(0, room));
    // si plus de place, on prend sur les obligations
    if (add < pct * 100 && f.target.bonds > 0) {
      const take = Math.min(f.target.bonds, pct * 100 - add);
      f.target.bonds -= take; add += take;
    }
    f.target[k] += add;
    this.rebalance();
    return add;
  },
  /* Réduit toutes les lignes risquées d'une fraction (vente vers le cash) */
  derisk(frac, feeMult = 1) {
    const f = S.fund;
    for (const k of RISKY) f.target[k] = Math.trunc(f.target[k] * (1 - frac));
    let fee = 0;
    for (const k of RISKY) {
      const sell = f.positions[k] * frac;
      fee += Math.abs(sell) * this.feeRate(k) * feeMult;
      f.positions[k] -= sell;
      f.cash += sell;
    }
    f.cash -= fee;
    S.last.txFees += fee;
    this.syncNavps();
    return fee;
  },

  /* Recommandation tirée de la prévision des analystes */
  rating(k) {
    const fc = S.market.forecasts[k] || 0;
    if (fc >= 0.08) return { t: '🟢 Surpondérer', c: 'g' };
    if (fc < 0) return { t: '🔴 Éviter', c: 'r' };
    return { t: '⚪ Neutre', c: '' };
  },
  /* Marge d'erreur de la prévision (dépend de la qualité d'information) */
  forecastError(k) { return (0.005 + 0.35 * (1 - Team.infoQuality()) * (CONFIG.ASSETS[k].vol + 0.03)) * (Team.effects().spec[k] ? 0.6 : 1); },
  /* Allocation « selon les prévisions » : poids ∝ rendement prévu / variance */
  forecastTarget() {
    const sc = {};
    let tot = 0;
    for (const k of RISKY) {
      if (!Market.isUnlocked(k)) continue;
      const fc = S.market.forecasts[k] || 0, v = Market.effVol(k);
      if (fc > 0.01) { sc[k] = fc / Math.max(0.0025, v * v); tot += sc[k]; }
    }
    const t = {};
    if (tot > 0) for (const k in sc) t[k] = Math.min(k === 'crypto' ? 15 : 60, Math.round(sc[k] / tot * 90));
    return t;
  },

  /* Préréglages d'allocation (adaptés aux actifs débloqués) */
  presets() {
    // Construit une allocation ; un actif verrouillé est remplacé par son repli
    const mk = list => { const t = {}; for (const [k, w, fb] of list) { const key = Market.isUnlocked(k) ? k : fb; if (key) t[key] = (t[key] || 0) + w; } return t; };
    const out = {
      prudent:   { label: '🛡️ Prudent', t: mk([['equities', 10], ['health', 5, 'equities'], ['staples', 5, 'equities'], ['utilities', 5, 'equities'], ['bonds', 35], ['bonds_short', 20, 'bonds'], ['inflation', 5, 'bonds']]) },
      equilibre: { label: '⚖️ Équilibré', t: mk([['equities', 30], ['tech', 8, 'equities'], ['health', 6, 'equities'], ['finance', 6, 'equities'], ['bonds', 25], ['bonds_long', 5, 'bonds'], ['highyield', 5, 'bonds'], ['commodities', 5, 'bonds']]) },
      dynamique: { label: '🚀 Dynamique', t: mk([['equities', 30], ['tech', 15, 'equities'], ['finance', 8, 'equities'], ['industrials', 8, 'equities'], ['energy', 5, 'equities'], ['commodities', 7, 'equities'], ['crypto', 5, 'equities'], ['bonds', 5], ['highyield', 5, 'bonds']]) },
      rotation:  { label: '🔄 Rotation sectorielle', t: mk(this.rotationList()) },
      prevision: { label: '🔮 Selon les prévisions', t: this.forecastTarget() }
    };
    if (Analysis.optimizerAvailable()) out.optimise = { label: '⚙️ Optimisé (quant)', t: Analysis.optimal().t };
    return out;
  },
  /* Rotation sectorielle selon le régime perçu : cycliques en hausse, défensives en baisse */
  rotationList() {
    switch (S.market.perceived) {
      case 'bull':   return [['equities', 20], ['tech', 20, 'equities'], ['industrials', 15, 'equities'], ['finance', 15, 'equities'], ['energy', 5, 'equities'], ['highyield', 10, 'bonds'], ['bonds', 5]];
      case 'bubble': return [['tech', 25, 'equities'], ['equities', 20], ['crypto', 10, 'equities'], ['industrials', 10, 'equities'], ['finance', 10, 'equities'], ['bonds', 15]];
      case 'bear':   return [['health', 15, 'equities'], ['staples', 15, 'equities'], ['utilities', 15, 'bonds'], ['bonds_long', 20, 'bonds'], ['bonds', 15], ['inflation', 5, 'bonds']];
      case 'crisis': return [['bonds_long', 30, 'bonds'], ['bonds', 20], ['bonds_short', 20, 'bonds'], ['staples', 5, 'bonds'], ['health', 5, 'bonds']];
      default:       return [['equities', 25], ['health', 10, 'equities'], ['staples', 10, 'equities'], ['finance', 10, 'equities'], ['tech', 10, 'equities'], ['bonds', 25]];
    }
  },

  applyPreset(id) {
    const p = this.presets()[id]; if (!p) return;
    for (const k of RISKY) S.fund.target[k] = 0;
    Object.assign(S.fund.target, p.t);
    S.fund.preset = id;
    this.normalizeTarget();
  }
};

/* =============================================================================
   6. TEAM — employés, recrutement, formation, promotions, effets
   ============================================================================= */
const FIRST_NAMES = ['Camille', 'Léa', 'Hugo', 'Lucas', 'Chloé', 'Manon', 'Nathan', 'Inès', 'Jules', 'Sarah', 'Yanis', 'Emma', 'Louis', 'Jade', 'Adam', 'Zoé', 'Maxime', 'Alice', 'Karim', 'Sofia', 'Thomas', 'Mei', 'Ibrahima', 'Elena', 'Noah', 'Lina', 'Rayan', 'Clara'];
const LAST_NAMES = ['Martin', 'Bernard', 'Dubois', 'Lefèvre', 'Moreau', 'Laurent', 'Garcia', 'Nguyen', 'Rousseau', 'Fontaine', 'Benali', 'Mercier', 'Chevalier', 'Kowalski', 'Diallo', 'Rossi', 'Schmidt', 'Okafor', 'Tanaka', 'Leroy', 'Haddad', 'Silva'];

const Team = {
  _cache: null, _cacheKey: '',

  wageIndex() { return CONFIG.WAGE_INDEX[S.tier - 1]; },
  capacity() { return TIERS[S.tier - 1].cap; },
  roleUnlocked(r) { return S.tier >= ROLES[r].tier; },
  hasRole(r) { return S.team.employees.some(e => e.role === r); },
  /* Puissance effective : un moral < 50 réduit l'efficacité */
  power(e) { const m = e.morale ?? 70; return e.level * CONFIG.RANK_POWER[e.rank] * (m < 50 ? 0.5 + m / 100 : 1); },
  title(e) { return ROLES[e.role].titles[e.rank]; },
  salary(e) {
    let s = ROLES[e.role].salary * (1 + 0.12 * (e.level - 1)) * CONFIG.RANK_SALARY[e.rank] * this.wageIndex() * (e.salaryMult || 1);
    if (e.traits.includes('genie')) s *= 1.3;
    return s;
  },
  payroll() { return S.team.employees.reduce((a, e) => a + this.salary(e), 0); },
  invalidate() { this._cacheKey = ''; },

  /* Agrégation des effets de l'équipe (recalculée à la demande) */
  effects() {
    const key = S.week + '|' + S.tier + '|' + S.team.employees.map(e => e.id + ':' + e.level + ':' + e.rank).join(',');
    if (this._cache && key === this._cacheKey) return this._cache;
    const e = { info: 0, fee: 0, volRed: 0, riskPts: 0, compliance: 0, inflow: 0, rp: 0, recruit: 0, trainDisc: 0, quantAlpha: 0, conf: 0, spec: {} };
    for (const emp of S.team.employees) {
      const p = this.power(emp);
      const has = t => emp.traits.includes(t);
      const m = has('methodique') ? 1.1 : 1;
      switch (emp.role) {
        case 'analyst':
          e.info += p * m; e.rp += p * 0.35;
          if (emp.spec) e.spec[emp.spec] = (e.spec[emp.spec] || 0) + emp.level * 0.002;
          break;
        case 'trader':
          e.fee += p * 0.045 * (has('impulsif') ? 1.3 : 1) * (has('prudent') ? 0.85 : 1) * m;
          if (has('impulsif')) e.riskPts -= 2;
          break;
        case 'risk':
          e.volRed += p * 0.022 * (has('prudent') ? 1.3 : 1) * m;
          e.riskPts += p * 0.7 * m; e.compliance += p * 0.4;
          break;
        case 'sales':
          e.inflow += p * 0.035 * (has('charismatique') ? 1.5 : 1) * m;
          break;
        case 'hr':
          e.trainDisc += p * 0.03; e.recruit += p * 0.12;
          break;
        case 'compliance':
          e.compliance += p * 2.5 * (has('methodique') ? 1.3 : 1);
          break;
        case 'quant':
          e.info += p * 1.6 * m; e.rp += p * 0.7; e.quantAlpha += p * 0.0015;
          break;
      }
      if (has('genie')) e.rp += p * 0.3;
      if (has('charismatique')) e.conf += 0.15;
    }
    e.fee = Math.min(0.6, e.fee);
    e.volRed = Math.min(0.35, e.volRed + Progression.upg('riskengine') * 0.05);
    e.inflow = Math.min(1.5, e.inflow);
    e.trainDisc = Math.min(0.5, e.trainDisc);
    e.quantAlpha = Math.min(0.03, e.quantAlpha);
    this._cache = e; this._cacheKey = key;
    return e;
  },
  infoQuality() {
    const e = this.effects();
    return Math.min(0.98, 1 - Math.exp(-(e.info + Progression.upg('data') * 3) / 12) + Strat.b('info'));
  },
  rpPerWeek() {
    const e = this.effects();
    return (1 + e.rp) * (1 + Progression.upg('training') * 0.1) * (1 + Progression.tierBonus('rp')) * (1 + Strat.b('rp'));
  },

  /* Candidats */
  makeCandidate() {
    const roles = Object.keys(ROLES).filter(r => this.roleUnlocked(r));
    if (!roles.length) return null;
    const role = pick(roles);
    const e = this.effects();
    const lvl = clamp(Math.round(1 + rng() * (S.tier / 2.2) + e.recruit + Progression.tierBonus('recruit') * 5 + (rng() < 0.15 ? 1 : 0)), 1, 7);
    const traitKeys = Object.keys(TRAITS);
    const traits = [pick(traitKeys)];
    if (rng() < 0.35) { const t2 = pick(traitKeys); if (!traits.includes(t2)) traits.push(t2); }
    const specs = RISKY.filter(k => Market.isUnlocked(k) && CONFIG.ASSETS[k].alphaInfo);
    return {
      id: S.team.nextId++, name: pick(FIRST_NAMES) + ' ' + pick(LAST_NAMES), role, rank: 0, level: lvl, traits,
      spec: role === 'analyst' && specs.length ? pick(specs) : null, hiredWeek: null, salaryMult: 1
    };
  },
  refreshCandidates(force) {
    if (!force && S.week < S.team.nextRefresh) return;
    S.team.candidates = [];
    for (let i = 0; i < 3; i++) { const c = this.makeCandidate(); if (c) S.team.candidates.push(c); }
    S.team.nextRefresh = S.week + CONFIG.CANDIDATE_REFRESH;
  },
  headhunterCost() { return 3 * U(); },
  headhunt() {
    const c = this.headhunterCost();
    if (S.cash < c) return UI.toast('Cash insuffisant.', 'bad');
    S.cash -= c;
    this.refreshCandidates(true);
    UI.renderAll();
  },
  signingCost(c) { return this.salary(Object.assign({}, c, { salaryMult: 1 })) * CONFIG.SIGNING_WEEKS; },
  /* equity : payé moitié en parts (salaire −50 %, +2 % des commissions de performance) */
  hire(id, equity = false) {
    const c = S.team.candidates.find(x => x.id === id);
    if (!c) return;
    if (equity) { c.salaryMult = 0.5; c.equity = 0.02; }
    if (S.team.employees.length >= this.capacity()) return UI.toast('Capacité du local atteinte : déménagez pour recruter plus.', 'warn');
    const cost = this.signingCost(c);
    if (S.cash < cost) return UI.toast('Cash insuffisant pour la prime de signature.', 'bad');
    S.cash -= cost;
    c.hiredWeek = S.week; c.morale = equity ? 80 : 70; c.lastBoost = S.week;
    if (c.equity) S.fund.carry = Math.min(0.4, S.fund.carry + c.equity);
    S.events.flags.everHired = true;
    S.team.employees.push(c);
    S.team.candidates = S.team.candidates.filter(x => x.id !== id);
    this.invalidate();
    Game.log(`Recrutement : ${c.name}, ${this.title(c)} (niv. ${c.level}).`, 'good');
    UI.renderAll();
  },
  fire(id, free) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e) return;
    const sev = free ? 0 : this.salary(e) * CONFIG.SEVERANCE_WEEKS;
    S.cash -= sev;
    if (e.equity) S.fund.carry = Math.max(0, S.fund.carry - e.equity);
    S.team.employees = S.team.employees.filter(x => x.id !== id);
    this.invalidate();
    Game.log(`Départ de ${e.name} (${this.title(e)})${sev ? ', indemnité ' + fmtMoney(sev) : ''}.`, 'warn');
    if (UI.enabled) UI.renderAll();
  },
  trainCost(e) {
    const disc = (1 - this.effects().trainDisc) * (1 - Progression.upg('training') * 0.2);
    return { rp: Math.round(4 * Math.pow(e.level, 1.4) * disc), cash: this.salary(e) * 3 * disc };
  },
  train(id) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e || e.level >= 10) return;
    const c = this.trainCost(e);
    if (S.rp < c.rp || S.cash < c.cash) return UI.toast('Ressources insuffisantes (recherche ou cash).', 'bad');
    S.rp -= c.rp; S.cash -= c.cash;
    e.level++;
    e.morale = Math.min(100, (e.morale ?? 70) + 8); e.lastBoost = S.week;
    this.invalidate();
    Game.log(`Formation : ${e.name} passe niveau ${e.level}.`, 'good');
    UI.renderAll();
  },
  promoReq(e) {
    const n = ROLES[e.role].titles.length;
    return n === 3 ? [4, 7][e.rank] : 6;
  },
  /* null = promotion possible ; sinon raison du blocage */
  promoBlock(e) {
    const titles = ROLES[e.role].titles;
    if (e.rank >= titles.length - 1) return 'Rang maximal';
    if (e.level < this.promoReq(e)) return `Niveau ${this.promoReq(e)} requis`;
    if (e.rank + 1 === titles.length - 1 && S.team.employees.some(o => o.role === e.role && o.rank === titles.length - 1)) return 'Poste de direction déjà occupé';
    return null;
  },
  promoCost(e) { return this.salary(Object.assign({}, e, { rank: e.rank + 1 })) * 4; },
  promote(id) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e || this.promoBlock(e)) return;
    const c = this.promoCost(e);
    if (S.cash < c) return UI.toast('Cash insuffisant pour la promotion.', 'bad');
    S.cash -= c;
    e.rank++;
    e.morale = Math.min(100, (e.morale ?? 70) + 20); e.lastBoost = S.week;
    this.invalidate();
    Game.log(`Promotion : ${e.name} devient ${this.title(e)}.`, 'good');
    UI.toast(`🎉 ${e.name} devient ${this.title(e)}`, 'good');
    UI.renderAll();
  },

  /* Prime exceptionnelle : remonte le moral */
  bonusCost(e) { return this.salary(e) * 2; },
  bonus(id) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e) return;
    const c = this.bonusCost(e);
    if (S.cash < c) return UI.toast('Cash insuffisant pour la prime.', 'bad');
    S.cash -= c;
    e.morale = Math.min(100, (e.morale ?? 70) + 15); e.lastBoost = S.week;
    this.invalidate();
    Game.log(`Prime versée à ${e.name} (${fmtMoney(c)}) : moral ${Math.round(e.morale)}.`, 'good');
    UI.renderAll();
  },

  /* Moral hebdomadaire : salaire, promotions récentes, performance, trésorerie */
  updateMorale() {
    const perf = clamp(Investors.perfAnnual(26) * 30, -10, 10);
    for (const e of S.team.employees.slice()) {
      const loyal = e.traits.includes('loyal');
      const stale = clamp((S.week - (e.lastBoost ?? e.hiredWeek ?? 0)) / 52 * 15, 0, 25);
      const target = 65 + ((e.salaryMult || 1) - 1) * 40 + e.rank * 5 - stale + perf - (S.cash < 0 ? 20 : 0) + (loyal ? 10 : 0);
      e.morale = clamp((e.morale ?? 70) + (target - (e.morale ?? 70)) * 0.08, 0, 100);
      if (e.morale < 30 && rng() < (loyal ? 0.01 : 0.04)) {
        Game.log(`😞 ${e.name} (${this.title(e)}) démissionne : moral au plus bas.`, 'bad');
        UI.toast(`😞 ${e.name} démissionne`, 'bad');
        this.fire(e.id, true);
      }
    }
    this.invalidate();
  },

  /* L'équipe prend la parole : alertes et recommandations actionnables */
  advise() {
    S.advice = S.advice.filter(a => S.week - a.week < 1);   // un conseil non appliqué disparaît la semaine suivante
    const add = (key, text, act) => {
      if (S.advice.some(a => a.key === key)) return;
      S.advice.unshift({ id: S.week * 100 + S.advice.length, key, week: S.week, text, act });
      if (S.advice.length > 4) S.advice.length = 4;
      Game.log('🗣️ ' + text, 'info');
      UI.toast('🗣️ ' + text, 'info');
    };
    const emps = S.team.employees, m = S.market;
    // Risk analyst confirmé : détecte immédiatement un marché baissier ou une crise
    const risk = emps.filter(e => e.role === 'risk' && e.level >= 3).sort((a, b) => b.level - a.level)[0];
    if (risk && (m.regime === 'bear' || m.regime === 'crisis') && m.perceived !== m.regime) {
      m.perceived = m.regime; m.perceivedSince = S.week;
      add('risk-' + m.regime, `${risk.name} (risque) : nos indicateurs signalent un marché ${CONFIG.REGIMES[m.regime].name.toLowerCase()}. Je recommande de passer en Prudent.`, 'preset:prudent');
    }
    if (rng() > 0.3) return;
    const trader = emps.find(e => e.role === 'trader' && e.traits.includes('impulsif'));
    const analyst = emps.filter(e => e.role === 'analyst' || e.role === 'quant').sort((a, b) => Team.power(b) - Team.power(a))[0];
    const comp = emps.find(e => e.role === 'compliance');
    const sales = emps.find(e => e.role === 'sales');
    const sad = emps.filter(e => (e.morale ?? 70) < 40).sort((a, b) => a.morale - b.morale)[0];
    const opts = [];
    if (trader && S.fund.preset !== 'dynamique') opts.push(() => add('trader-dyn', `${trader.name} (trader) : « On est trop timides ! » Il propose de passer en Dynamique.`, 'preset:dynamique'));
    if (analyst) {
      const best = RISKY.filter(k => Market.isUnlocked(k)).sort((a, b) => (m.forecasts[b] || 0) - (m.forecasts[a] || 0))[0];
      if (best && (m.forecasts[best] || 0) > 0.12) opts.push(() => add('an-' + best, `${analyst.name} recommande de renforcer ${CONFIG.ASSETS[best].name} (prévision ${fmtPct(m.forecasts[best], 0, true)}/an).`, 'shift:' + best));
    }
    if (comp && S.compliance < 55) opts.push(() => add('comp', `${comp.name} (conformité) : nos contrôles se dégradent (${Math.round(S.compliance)}/100). Un Bureau d'audit aiderait.`, null));
    if (sales && Investors.globalConfidence() < 45) opts.push(() => add('sales', `${sales.name} (ventes) : les clients s'inquiètent. Une bonne performance ce trimestre est vitale.`, null));
    if (sad) opts.push(() => add('sad-' + sad.id, `${sad.name} semble démotivé(e) (moral ${Math.round(sad.morale)}/100). Une prime ou une promotion aiderait.`, 'bonus:' + sad.id));
    if (opts.length) pick(opts)();
  },
  applyAdvice(id) {
    const a = S.advice.find(x => x.id === id);
    if (!a || !a.act) return;
    const [type, arg] = a.act.split(':');
    if (type === 'preset') { Portfolio.applyPreset(arg); Portfolio.rebalance(true); }
    else if (type === 'shift') Portfolio.shiftInto(arg, 0.05);
    else if (type === 'bonus') Team.bonus(Number(arg));
    S.advice = S.advice.filter(x => x !== a);
    UI.renderAll();
  },

  /* Étape 4 du tick : salaires */
  paySalaries() {
    const p = this.payroll();
    S.cash -= p;
    S.last.salaries = p;
    if (S.cash < 0) {
      S.cash *= 1 + CONFIG.OVERDRAFT_RATE / 52;
      S.counters.cashNegWeeks++;
      // Salaires impayés trop longtemps : démissions
      if (S.counters.cashNegWeeks > 12 && S.counters.cashNegWeeks % 4 === 0 && S.team.employees.length) {
        const e = pick(S.team.employees);
        Game.log(`${e.name} démissionne : salaires payés sur découvert depuis trop longtemps.`, 'bad');
        this.fire(e.id, true);
      }
    } else S.counters.cashNegWeeks = 0;
  }
};

/* =============================================================================
   7. INVESTORS — clients, confiance, flux, frais
   ============================================================================= */
const INV_NAMES = {
  retail: () => (rng() < 0.5 ? 'M. ' : 'Mme ') + pick(LAST_NAMES),
  hnwi: () => 'Famille ' + pick(LAST_NAMES),
  uhnwi: () => 'Family office ' + pick(LAST_NAMES),
  institutional: () => pick(['Assurances ', 'Banque ', 'Mutuelle ', 'Fondation ']) + pick(LAST_NAMES),
  pension: () => 'Caisse de retraite ' + pick(['des enseignants', 'des ingénieurs', 'nationale', 'des cheminots', 'du Nord', 'des médecins']),
  sovereign: () => 'Fonds souverain de ' + pick(['Valoria', 'Norvalie', 'Qastar', 'Singara', 'Emirania'])
};

const Investors = {
  typeUnlocked(t) { return S.tier >= INVESTOR_TYPES[t].tier || (t === 'institutional' && S.events.flags.earlyInst && S.tier >= 4); },
  capital(inv) { return inv.shares * S.fund.navps; },
  clients() { return S.investors.list.filter(i => i.type !== 'founder'); },
  founder() { return S.investors.list.find(i => i.type === 'founder'); },
  /* Les 5 plus gros clients individuels (hors cohortes, HNWI et au-delà) */
  bigClients() { return this.clients().filter(i => i.count === 1 && i.type !== 'retail' && i.shares > 0).sort((a, b) => b.shares - a.shares).slice(0, 5); },
  clientConf(id, d) { const i = S.investors.list.find(x => x.id === id); if (i) i.conf = clamp(i.conf + d, 0, 100); },
  /* Retenir un client sous préavis : geste commercial de 1 % de son capital */
  retain(id) {
    const i = S.investors.list.find(x => x.id === id); if (!i || !i.notice) return;
    const cost = this.capital(i) * 0.01;
    if (S.cash < cost) return UI.toast('Cash insuffisant pour ce geste commercial.', 'bad');
    S.cash -= cost; i.notice = null; i.conf = clamp(i.conf + 25, 0, 100);
    Game.log(`🤝 ${i.name} accepte de rester (geste commercial ${fmtMoney(cost)}).`, 'good');
    UI.renderAll();
  },

  /* Confiance globale = moyenne pondérée par le capital */
  globalConfidence() {
    let w = 0, s = 0;
    for (const i of this.clients()) { w += i.shares; s += i.shares * i.conf; }
    return w > 0 ? s / w : 55;
  },

  /* Performance annualisée glissante sur n semaines (approx. linéaire) */
  perfAnnual(n = 26) {
    const h = S.fund.navHist;
    if (h.length < 5) return 0.06;
    const weeks = Math.min(n, h.length - 1);
    const past = h[h.length - 1 - weeks];
    return clamp((h[h.length - 1] / past - 1) * 52 / weeks, -0.8, 1.5);
  },

  founderBonus() {
    const f = this.founder(), A = Portfolio.aum();
    if (!f || A <= 0) return 0;
    return Math.min(8, this.capital(f) / A * 40);
  },

  /* Multiplicateur d'attractivité : réputation, confiance, perf, ventes */
  attractiveness() {
    // Chaque levier est borné : réputation 0,5–2 ; confiance 0,6–1,4 ;
    // performance 0,5–1,6 ; ventes/CRM/paliers 1–~4,5.
    const repF = 0.5 + 1.5 * Math.pow(S.reputation / 100, 1.2);
    const confF = 0.6 + 0.8 * this.globalConfidence() / 100;
    const perfF = this.perfFactor();
    const salesF = 1 + Team.effects().inflow + Progression.upg('crm') * 0.12 + Progression.tierBonus('reach');
    const complF = S.compliance < 50 ? 0.6 : 1;
    return repF * confF * perfF * salesF * complF * CONFIG.MODES[S.difficulty].investorDemand * (1 + 0.1 * Math.min(3, S.prestige || 0));
  },
  perfFactor() { return clamp(1 + (this.perfAnnual(26) - 0.06) * 3, 0.5, 1.6); },
  /* Saturation : plus le fonds est gros, plus il est difficile de croître en % */
  saturation(A) { return Math.pow(1e8 / Math.max(A, 1e8), 0.15); },
  typeBonus(t) {
    if (t === 'retail') return 1 + Progression.tierBonus('retail') + Strat.b('retail');
    if (t === 'hnwi' || t === 'uhnwi') return 1 + Strat.b('hnwi');
    if (t === 'institutional' || t === 'pension' || t === 'sovereign') return (1 + Progression.tierBonus('institutional') + Strat.b('inst')) * (1 + Analysis.diversification().score / 200);
    return 1;
  },

  newInvestor(type, amount) {
    const T = INVESTOR_TYPES[type];
    const inv = {
      id: S.investors.nextId++, type, name: INV_NAMES[type](), shares: amount / S.fund.navps,
      conf: clamp(50 + rand(-8, 10) + Progression.tierBonus('clientConf') * 30 + (S.week < S.prop.confUntil ? S.prop.confBonus : 0), 0, 100),
      objective: T.objective + rand(-0.01, 0.02), tolerance: T.tolerance + randInt(-10, 10),
      lockupUntil: S.week + T.lockup, joined: S.week, count: 1, invested: amount
    };
    S.investors.list.push(inv);
    return inv;
  },

  /* Apport du fondateur (cash de la société -> fonds) */
  founderInvest(amount) {
    if (!S.prop.launched) return UI.toast('Lancez d’abord votre fonds (réussissez la prop firm).', 'warn');
    amount = Math.min(amount, S.cash);
    if (amount <= 0) return;
    S.cash -= amount;
    let f = this.founder();
    if (!f) {
      f = { id: S.investors.nextId++, type: 'founder', name: 'Vous (fondateur)', shares: 0, conf: 100, objective: 0, tolerance: 100, lockupUntil: 0, joined: S.week, count: 1, invested: 0 };
      S.investors.list.push(f);
    }
    f.shares += amount / S.fund.navps;
    f.invested += amount;
    Portfolio.deposit(amount);
    Portfolio.syncNavps();
    Game.log(`Apport du fondateur : ${fmtMoney(amount)} investis dans le fonds.`, 'good');
    UI.renderAll();
  },
  founderWithdraw(amount) {
    const f = this.founder(); if (!f) return;
    amount = Math.min(amount, this.capital(f));
    if (amount <= 0) return;
    f.shares -= amount / S.fund.navps;
    Portfolio.withdraw(amount);
    S.cash += amount;
    if (f.shares <= 1e-9) S.investors.list = S.investors.list.filter(i => i !== f);
    Portfolio.syncNavps();
    confAll(-2);
    Game.log(`Retrait du fondateur : ${fmtMoney(amount)} rapatriés dans la société (les clients le remarquent).`, 'warn');
    UI.renderAll();
  },

  /* Étape 5 du tick : frais de gestion (hebdo) et de performance (trimestriels) */
  collectFees() {
    const f = S.fund;
    const A = Portfolio.aum();
    S.last.mgmt = 0; S.last.perf = 0;
    if (A > 0) {
      const mg = A * CONFIG.MGMT_FEE / 52;
      Portfolio.withdraw(mg);
      S.cash += mg * S.feeShare;
      S.last.mgmt = mg * S.feeShare;
      S.stats.totalFees += mg * S.feeShare;
      Portfolio.syncNavps();
    }
    if (S.week - f.lastPerfFeeWeek >= CONFIG.PERF_FEE_PERIOD) {
      f.lastPerfFeeWeek = S.week;
      const sh = this.totalClientShares();
      if (f.navps > f.hwm && sh > 0) {
        const rate = CONFIG.PERF_FEE * (1 + Progression.tierBonus('perfFee'));
        const fee = (f.navps - f.hwm) * sh * rate;
        Portfolio.withdraw(fee);
        Portfolio.syncNavps();
        const carry = fee * f.carry + fee * (1 - f.carry) * (1 - S.feeShare);
        S.cash += fee - carry;
        S.last.perf = fee - carry;
        S.stats.totalFees += fee - carry;
        Game.log(`Commission de performance cristallisée : ${fmtMoney(fee - carry)}${carry ? ' (carried interest versé : ' + fmtMoney(carry) + ')' : ''}.`, 'good');
      }
      f.hwm = Math.max(f.hwm, f.navps);
    }
  },
  totalClientShares() { return this.clients().reduce((a, i) => a + i.shares, 0); },

  /* Étape 6 du tick : confiance, apports, retraits, nouveaux clients */
  step() {
    if (!S.prop.launched) { S.last.subs = 0; S.last.reds = 0; return; }
    const f = S.fund;
    const navps = f.navps;
    const A = Portfolio.aum();
    const att = this.attractiveness() * Rivals.attractMult();
    const perf = this.perfAnnual(26);
    const perfF = this.perfFactor();
    const sat = this.saturation(A);
    const e = Team.effects();
    const retention = Progression.tierBonus('retention');
    const confTarget = 55 + Progression.tierBonus('clientConf') * 50 + this.founderBonus() + e.conf * 10;
    let subs = 0, reds = 0;

    // 1) Clients existants : confiance, apports et retraits
    for (const inv of this.clients()) {
      const T = INVESTOR_TYPES[inv.type];
      let d = clamp((perf - inv.objective) * 8, -1.5, 1.5);
      d += (S.reputation - 30) / 50 * 0.4;
      if (S.risk > inv.tolerance) d -= (S.risk - inv.tolerance) / 12;
      if (S.compliance < 50) d -= (50 - S.compliance) / 12;
      if (S.last.fundReturn < -0.05) d -= Math.abs(S.last.fundReturn) * 40;
      d += (confTarget - inv.conf) * 0.05;
      d *= T.fickle;
      inv.conf = clamp(inv.conf + d + gauss() * 0.8, 0, 100);

      const cap = inv.shares * navps;
      // Préavis de retrait (gros clients) : départ total dans 4 semaines sauf si on le retient
      if (inv.notice && S.week >= inv.notice) {
        reds += cap; inv.shares = 0; inv.notice = null;
        Game.log(`🚪 ${inv.name} retire l'intégralité de ses fonds (${fmtMoney(cap)}).`, 'bad');
        continue;
      }
      if (S.week >= inv.lockupUntil && !inv.notice && inv.conf < 15 && cap > A * 0.01) {
        inv.notice = S.week + 4;
        Game.log(`⚠️ ${inv.name} envoie un préavis de retrait total (${fmtMoney(cap)}) dans 4 semaines. Onglet Investisseurs pour tenter de le retenir.`, 'warn');
        UI.toast(`⚠️ Préavis de retrait : ${inv.name}`, 'warn');
        continue;
      }
      if (inv.notice) continue;
      if (S.week >= inv.lockupUntil) {
        let fr = 0;
        if (inv.conf < 15) fr = 1;
        else if (inv.conf < 40) fr = (40 - inv.conf) / 40 * 0.15 * T.fickle;
        if (inv.type === 'retail') fr += 0.002;
        fr *= 1 - retention / 2;
        if (fr > 0) {
          const amt = cap * Math.min(1, fr);
          inv.shares -= amt / navps;
          reds += amt;
        }
      }
      if (inv.conf > 65 && inv.shares > 0) {
        const top = cap * (inv.conf - 65) / 35 * 0.008 * perfF * sat;
        inv.shares += top / navps;
        inv.invested += top;
        subs += top;
      }
    }
    S.investors.list = S.investors.list.filter(i => i.shares > 1e-9);

    // 2) Nouveaux clients (processus de Poisson par type)
    for (const t of Object.keys(INVESTOR_TYPES)) {
      const T = INVESTOR_TYPES[t];
      if (!this.typeUnlocked(t) || S.compliance < T.minCompliance) continue;
      const n = poisson(Math.min(20, T.rate * att * this.typeBonus(t)));
      for (let i = 0; i < n; i++) {
        let ticket = rand(T.ticket[0], T.ticket[1]) + A * T.frac * sat * rand(0.5, 1.5);
        if (A > 5e6) ticket = Math.min(ticket, A * 0.3);
        this.newInvestor(t, ticket);
        subs += ticket;
      }
    }

    // 3) Application des flux au portefeuille
    if (reds > 0) Portfolio.withdraw(reds);
    if (subs > 0) Portfolio.deposit(subs);
    Portfolio.syncNavps();
    S.last.subs = subs; S.last.reds = reds;
    this.mergeSmall();
  },

  /* Regroupe les petits comptes en cohortes pour garder une liste légère */
  mergeSmall() {
    const list = S.investors.list;
    if (list.length <= 120) return;
    for (const t of Object.keys(INVESTOR_TYPES)) {
      const group = list.filter(i => i.type === t).sort((a, b) => a.shares - b.shares);
      while (group.length > 18) {
        const a = group.shift(), b = group.shift();
        const tot = a.shares + b.shares;
        const c = {
          id: S.investors.nextId++, type: t, shares: tot,
          conf: (a.conf * a.shares + b.conf * b.shares) / tot,
          objective: (a.objective + b.objective) / 2, tolerance: Math.round((a.tolerance + b.tolerance) / 2),
          lockupUntil: Math.max(a.lockupUntil, b.lockupUntil), joined: Math.min(a.joined, b.joined),
          count: a.count + b.count, invested: a.invested + b.invested, name: ''
        };
        c.name = `Cohorte ${INVESTOR_TYPES[t].short} (${c.count} clients)`;
        S.investors.list = S.investors.list.filter(i => i !== a && i !== b);
        S.investors.list.push(c);
        // réinsertion triée
        let idx = group.findIndex(g => g.shares > c.shares);
        if (idx < 0) idx = group.length;
        group.splice(idx, 0, c);
      }
    }
  }
};

/* =============================================================================
   7b. PROP FIRM — challenge, compte financé, lancement du fonds (palier 1)
   -----------------------------------------------------------------------------
   Le compte prop suit la même allocation cible que le fonds : son rendement
   hebdomadaire est celui du portefeuille modèle (S.last.fundReturn).
   ============================================================================= */
const Prop = {
  /* Règles du mode, ajustées par les événements (ddAdj : variation de la perte max autorisée) */
  rules() { const r = CONFIG.PROP[S.difficulty]; return Object.assign({}, r, { maxDD: Math.max(0.04, r.maxDD + (S.prop.ddAdj || 0)) }); },
  /* Perte (ou gain si négatif) instantanée sur le compte prop */
  hit(pct) { const p = S.prop; const amt = p.equity * pct; p.equity -= amt; if (p.equity > p.peak) p.peak = p.equity; return amt; },
  active() { return S.prop.phase === 'challenge' || S.prop.phase === 'funded'; },
  dd() { const p = S.prop; return p.peak > 0 ? 1 - p.equity / p.peak : 0; },
  gain() { const p = S.prop; return p.size > 0 ? p.equity / p.size - 1 : 0; },
  canRetryFree() { return S.cash < this.rules().fee && S.week >= S.prop.cooldownUntil; },
  /* Track record annualisé sur les semaines financées */
  trackAnnual() {
    const t = S.prop.track; if (t.length < 4) return 0;
    const g = t.reduce((a, r) => a * (1 + r), 1);
    return Math.pow(g, 52 / t.length) - 1;
  },
  buyChallenge() {
    const p = S.prop, r = this.rules();
    if (this.active()) return;
    if (S.cash >= r.fee) S.cash -= r.fee;
    else if (!this.canRetryFree()) return UI.toast(`Cash insuffisant : challenge gratuit disponible dans ${p.cooldownUntil - S.week} sem.`, 'warn');
    p.ddAdj = 0; p.lastW = null; p.fees = 0;
    p.phase = 'challenge'; p.size = r.size; p.equity = r.size; p.peak = r.size; p.startWeek = S.week; p.attempts++;
    Game.log(`🎯 Challenge prop firm n°${p.attempts} : objectif ${fmtPct(r.target, 0, true)} sans drawdown de ${fmtPct(r.maxDD, 0)}${r.deadline ? ' en ' + r.deadline + ' semaines' : ''}.`, 'info');
    UI.renderAll();
  },
  quit() {
    if (S.prop.phase !== 'funded') return;
    S.prop.phase = 'off';
    Game.log('Vous quittez la prop firm pour vous consacrer à votre fonds.', 'info');
    UI.renderAll();
  },
  fail(why) {
    const p = S.prop;
    const wasFunded = p.phase === 'funded';
    p.phase = p.launched ? 'off' : 'idle';
    p.cooldownUntil = S.week + CONFIG.PROP.cooldown;
    if (!p.launched && wasFunded) p.track = [];
    Game.log(`❌ ${wasFunded ? 'Compte financé perdu' : 'Challenge échoué'} : ${why}.`, 'bad');
    UI.toast(`❌ ${wasFunded ? 'Compte financé perdu' : 'Challenge échoué'}`, 'bad');
  },
  /* Étape 2b du tick */
  step() {
    const p = S.prop, r = this.rules();
    if (!this.active()) return;
    const ret = S.last.propReturn;
    p.equity *= 1 + ret;
    // Frais de transaction : changer d'allocation coûte comme dans le fonds
    const tw = Object.fromEntries(RISKY.map(k => [k, (S.fund.target[k] || 0) / 100]));
    let fee = 0;
    if (p.lastW) for (const k of RISKY) fee += Math.abs(tw[k] - (p.lastW[k] || 0)) * Portfolio.feeRate(k);
    p.lastW = tw;
    p.lastFee = fee * p.equity; p.fees = (p.fees || 0) + p.lastFee;
    p.equity -= p.lastFee;
    p.peak = Math.max(p.peak, p.equity);
    if (p.phase === 'challenge') {
      if (this.gain() >= r.target) {
        p.passes++;
        p.phase = 'funded'; p.size = r.funded; p.equity = r.funded; p.peak = r.funded; p.startWeek = S.week; p.sinceScale = 0;
        Game.log(`✅ Challenge réussi ! La prop firm vous confie un compte de ${fmtMoney(r.funded)} (vous gardez ${fmtPct(CONFIG.PROP.split, 0)} des gains).`, 'tier');
        UI.toast('✅ Challenge réussi : compte financé !', 'good');
      } else if (this.dd() >= r.maxDD) this.fail(`drawdown de ${fmtPct(this.dd(), 1)}`);
      else if (r.deadline && S.week - p.startWeek >= r.deadline) this.fail(`objectif non atteint en ${r.deadline} semaines`);
      return;
    }
    // Compte financé
    p.fundedWeeks++;
    p.track.push(ret);
    if (p.track.length > 104) p.track.shift();
    if (this.dd() >= r.maxDD) return this.fail(`drawdown de ${fmtPct(this.dd(), 1)}`);
    if (S.week - p.startWeek > 0 && (S.week - p.startWeek) % CONFIG.PROP.payoutEvery === 0 && p.equity > p.size) {
      const pay = (p.equity - p.size) * CONFIG.PROP.split;
      S.cash += pay; p.payouts += pay; p.profitWeeks += CONFIG.PROP.payoutEvery; p.sinceScale += CONFIG.PROP.payoutEvery;
      p.equity = p.size; p.peak = p.size;
      Game.log(`💸 Versement prop firm : ${fmtMoney(pay)}.`, 'good');
      if (p.sinceScale >= CONFIG.PROP.scaleEvery) {
        p.sinceScale = 0; p.size = Math.min(CONFIG.PROP.maxSize, p.size * CONFIG.PROP.scaleMult); p.equity = p.size; p.peak = p.size;
        Game.log(`📈 Scaling : votre compte financé passe à ${fmtMoney(p.size)}.`, 'good');
      }
    }
    if (!p.launched && p.fundedWeeks >= r.gradWeeks && this.trackAnnual() > 0 && !S.events.pending) Events.trigger('fund_launch');
  },
  /* Lancement du fonds : le compte prop firm est clôturé */
  launch() {
    const p = S.prop;
    const ann = this.trackAnnual();
    p.launched = true;
    p.phase = 'off';
    S.reputation = Math.max(S.reputation, clamp(15 + ann * 60, 15, 40) + 5);
    p.confBonus = clamp(ann * 40, 0, 15); p.confUntil = S.week + 52;
    // Nouveau fonds : la part repart à 100 et l'historique (NAV, graphique) démarre au lancement
    const f = S.fund;
    f.navps = CONFIG.START_NAVPS; f.hwm = f.navps; f.peakNavps = f.navps; f.navHist = [f.navps]; f.lastPerfFeeWeek = S.week; f.ddAlerted = false;
    S.history = { week: [S.week], navps: [f.navps], aum: [0], bench: [null] };
    f.launchWeek = S.week;
    S.regimeStat = null;
    const seed = clamp(1e6 + ann * 1e7, 1e6, 5e6);   // « amis, famille et business angels »
    for (let i = 0; i < 3; i++) Investors.newInvestor('retail', seed / 3).name += ' (client fondateur)';
    Portfolio.deposit(seed);
    Portfolio.syncNavps();
    S.fund.hwm = S.fund.navps; S.fund.peakNavps = S.fund.navps;
    S.events.queue = (S.events.queue || []).concat(['fund_strategy']);
    Game.log(`🚀 Lancement de « ${S.fundName} » : track record ${fmtPct(ann, 1, true)}/an, ${fmtMoney(seed)} de premiers clients.`, 'tier');
    UI.toast(`🚀 ${S.fundName} est lancé !`, 'tier');
  }
};

/* Helpers d'effets (utilisés par les événements) */
function sellAsset(k, frac) { const f = S.fund; if (!f.target[k]) return; f.target[k] = Math.round(f.target[k] * (1 - frac)); Portfolio.rebalance(); }
function confAll(d) { for (const i of Investors.clients()) i.conf = clamp(i.conf + d, 0, 100); }
function addRep(d) { S.reputation = clamp(S.reputation + d, 0, 100); }
function addCompliance(d) { S.compliance = clamp(S.compliance + d, 0, 100); }
function riskShock(d) { S.riskShock += d; S.risk = clamp(S.risk + d, 0, 100); }
function payCash(x) { S.cash -= x; }
function U() { return CONFIG.COST_INDEX[S.tier - 1]; } // unité de coût proportionnelle au palier
function sev() { return CONFIG.MODES[S.difficulty].eventSeverity; }
function lossAUM(pct) { const A = Portfolio.aum(); Portfolio.withdraw(A * pct); Portfolio.syncNavps(); return A * pct; }

/* =============================================================================
   8. RISK — risque, conformité, réputation, margin call, amendes
   ============================================================================= */
const Risk = {
  /* Volatilité annuelle du portefeuille (matrice de covariance du régime) */
  portfolioVol(useTarget) {
    const w = useTarget ? Object.fromEntries(RISKY.map(k => [k, S.fund.target[k] / 100])) : Portfolio.weights();
    const C = Market.corrMatrix(S.market.regime);
    const red = Math.min(0.45, Team.effects().volRed + Strat.b('volRed'));
    const sig = RISKY.map(k => Market.effVol(k) * (1 - red));
    let v = 0;
    for (let i = 0; i < RISKY.length; i++)
      for (let j = 0; j < RISKY.length; j++)
        v += w[RISKY[i]] * w[RISKY[j]] * sig[i] * sig[j] * C[i][j];
    return Math.sqrt(Math.max(0, v));
  },
  targetScore() {
    const useTarget = Portfolio.aum() <= 0;
    const vol = this.portfolioVol(useTarget);
    let r = 100 * (1 - Math.exp(-vol / CONFIG.RISK_VOL_SCALE));
    r += Portfolio.drawdown() * CONFIG.RISK_DD_WEIGHT;
    r += Math.max(0, (useTarget ? Portfolio.targetGross() / 100 : Portfolio.gross()) - 1) * CONFIG.RISK_LEVERAGE_PTS;
    if (S.cash < 0) r += 12;
    r -= Team.effects().riskPts;
    r += S.riskShock;
    r -= Hedges.riskRelief();
    return clamp(r, 0, 100);
  },
  complianceTarget() {
    const mode = CONFIG.MODES[S.difficulty];
    let c = CONFIG.COMPLIANCE_BASE - (S.tier - 1) * mode.complexityPerTier;
    c -= Math.max(0, Portfolio.gross() - 1) * 6;
    if (RISKY.some(k => S.fund.positions[k] < 0)) c -= 3;
    c += Team.effects().compliance + Progression.upg('audit') * 6 + Progression.tierBonus('compliance') * 25 + Strat.b('compliance');
    if (S.events.flags.cyberPlan) c += 2;
    return clamp(c, 0, 100);
  },
  reputationTarget() {
    const A = Math.max(Game.totalAUM(), 1e5);
    const perf = Investors.perfAnnual(52);
    let t = 15 + 7 * Math.log10(A / 1e5);
    t += clamp((perf - 0.05) * 80, -15, 20);
    t += clamp((S.compliance - 60) / 4, -15, 10);
    t += S.repBonus + Progression.upg('pr') * 4;
    t *= 1 + Progression.tierBonus('rep');
    return clamp(t, 0, 100);
  },

  /* Étape 7 du tick */
  step() {
    // Risque
    S.riskShock *= 0.85;
    const tgt = this.targetScore();
    S.risk = clamp(S.risk + (tgt - S.risk) * 0.5, 0, 100);
    if (S.risk > CONFIG.RISK_MARGIN && Portfolio.aum() > 0) this.marginCall();
    else if (S.risk > CONFIG.RISK_ALERT && S.week % 4 === 0) {
      Game.log(`⚠️ Risque élevé (${Math.round(S.risk)}/100) : volatilité effective accrue.`, 'warn');
      UI.toast(`⚠️ Risque élevé : ${Math.round(S.risk)}/100`, 'warn');
    }

    // Conformité
    const ct = this.complianceTarget();
    S.compliance = clamp(S.compliance + (ct - S.compliance) * CONFIG.COMPLIANCE_SPEED, 0, 100);
    S.last.fines = 0;
    const mode = CONFIG.MODES[S.difficulty];
    if (S.compliance < 50 && S.tier >= 2 && rng() < mode.fineProb) {
      const fine = Math.max(5 * U(), Portfolio.aum() * CONFIG.FINE_RATE * (50 - S.compliance) / 10);
      S.cash -= fine;
      S.last.fines = fine;
      addRep(-2);
      Game.log(`⚖️ Amende du régulateur : ${fmtMoney(fine)} (conformité ${Math.round(S.compliance)}/100).`, 'bad');
      UI.toast(`⚖️ Amende : ${fmtMoney(fine)}`, 'bad');
    }

    // Réputation
    const rt = this.reputationTarget();
    if (rt > S.reputation) S.reputation += (rt - S.reputation) * CONFIG.REP_UP_SPEED * (1 + Progression.tierBonus('repGain') + Strat.b('repGain'));
    else S.reputation -= (S.reputation - rt) * CONFIG.REP_DOWN_SPEED;
    S.reputation = clamp(S.reputation, 0, 100);

    // Recherche
    const g = Team.rpPerWeek();
    S.rp += g;
    S.last.rpGain = g;
  },

  /* Risque > 90 : vente forcée d'une partie des positions avec frais majorés */
  marginCall() {
    S.counters.marginCalls++;
    const fee = Portfolio.derisk(CONFIG.MARGIN_CALL_SELL, 2);
    if (S.fund.leverage > 1) S.fund.leverage = 1;
    Portfolio.normalizeTarget();
    S.riskShock = Math.min(S.riskShock, 0);
    addRep(-3); confAll(-5);
    S.risk = clamp(this.targetScore(), 0, 100);
    Game.log(`🚨 MARGIN CALL : ${fmtPct(CONFIG.MARGIN_CALL_SELL, 0)} des positions vendues de force (frais ${fmtMoney(fee)}). Levier ramené à 1x.`, 'bad');
    UI.toast('🚨 Margin call ! Ventes forcées.', 'bad');
  }
};

/* =============================================================================
   9. EVENTS — cartes à choix multiples
   -----------------------------------------------------------------------------
   prepare(s) applique les effets immédiats et renvoie des paramètres
   sérialisables (pour qu'un événement en attente survive à une sauvegarde).
   Chaque option a un coût : pas de choix dominant.
   ============================================================================= */
/* --- Stratégies de fonds (choisies au lancement) --- */
const STRATEGIES = {
  longonly: { name: 'Long-only actions', icon: '📈', desc: 'Alpha +1 %/an sur toutes les actions (indices et secteurs). Particuliers et HNWI +20 %.', b: { alphaEq: 0.01, retail: 0.2, hnwi: 0.2 } },
  macro:    { name: 'Global macro', icon: '🌐', desc: "Qualité d'information +15 pts, volatilité −5 %. HNWI/UHNWI +30 %.", b: { info: 0.15, volRed: 0.05, hnwi: 0.3 } },
  quant:    { name: 'Quantitatif', icon: '🧮', desc: 'Frais −30 %, recherche +30 %, alpha +0,5 %/an partout. Institutionnels +25 %.', b: { fee: 0.3, rp: 0.3, alphaAll: 0.005, inst: 0.25 } },
  crypto:   { name: 'Actifs numériques', icon: '🪙', desc: 'Crypto débloquée dès le lancement, alpha crypto +4 %/an, particuliers +40 %. Conformité −8.', b: { cryptoEarly: 1, alphaCrypto: 0.04, retail: 0.4, compliance: -8 } },
  activist: { name: 'Activiste / situations spéciales', icon: '🦈', desc: 'Opportunités 50 % plus fréquentes et plus sûres, réputation +20 % plus rapide. Conformité −4.', b: { oppFreq: 0.5, oppP: 0.08, repGain: 0.2, compliance: -4 } }
};
/* Indice de référence selon la stratégie (w : poids des actifs ; cash : rendement annuel fixe) */
const BENCHMARKS = {
  longonly: { name: 'Indice actions monde', w: { equities: 1 } },
  macro:    { name: 'Indice multi-actifs (40 actions / 40 oblig. / 10 matières / 10 devises)', w: { equities: 0.4, bonds: 0.4, commodities: 0.1, fx: 0.1 } },
  quant:    { name: 'Monétaire + 4 % (objectif de performance absolue)', cash: 0.04 },
  crypto:   { name: 'Indice actifs numériques (70 % crypto / 30 % tech)', w: { crypto: 0.7, tech: 0.3 } },
  activist: { name: 'Indice actions « value » (monde, industrie, finance)', w: { equities: 0.6, industrials: 0.2, finance: 0.2 } },
  default:  { name: 'Indice 60/40', w: { equities: 0.6, bonds: 0.4 } }
};
const Bench = {
  def() { return S.bench.def ? BENCHMARKS[S.bench.def] : null; },
  name() { const d = this.def(); return d ? d.name : '—'; },
  weekReturn(r) { const d = this.def(); if (!d) return 0; if (d.cash !== undefined) return d.cash / 52; let x = 0; for (const k in d.w) x += d.w[k] * (r[k] || 0); return x; },
  /* Démarre l'indice au lancement (rebasé sur la NAV du fonds à cette date) */
  start(id) { S.bench.def = BENCHMARKS[id] ? id : 'default'; S.bench.value = 100; S.bench.startNav = S.fund.navps; S.bench.startWeek = S.week; S.bench.hist = [100];
    Game.log(`📏 Indice de référence : ${this.name()}.`, 'info'); },
  you() { return S.fund.navps / S.bench.startNav - 1; },
  idx() { return S.bench.value / 100 - 1; }
};
const Strat = { b(key) { const st = S && S.strategy && STRATEGIES[S.strategy]; return st ? (st.b[key] || 0) : 0; } };

const EVENTS = [
  {
    id: 'flash_crash', icon: '⚡', title: 'Krach éclair',
    cond: s => s.week > 6, cooldown: 12,
    weight: s => ({ bull: 1, range: 1, bear: 2, crisis: 1.5, bubble: 2 })[s.market.regime],
    prepare(s) {
      const drop = -(0.06 + rng() * 0.04) * sev();
      Market.factorShock({ M: drop / 0.95, S: drop * 0.3 }, false);   // rebond géré ci-dessous
      const p = { bull: 0.75, range: 0.65, bear: 0.4, crisis: 0.25, bubble: 0.5 }[s.market.regime];
      // Rebond rapide (5 sem., ~90 % de la baisse) avec probabilité p, sinon lent (15 sem., ~70 %)
      const fast = rng() < p, wk = fast ? 5 : 15, rec = fast ? 0.9 : 0.7;
      Market.factorMod({ M: -drop / 0.95 * rec * 52 / wk }, wk);
      const est = clamp(p + gauss() * 0.25 * (1 - Team.infoQuality()), 0.05, 0.95);
      return { drop, est, cost: 3 * U() };
    },
    text: p => `Les marchés actions ont décroché de ${fmtPct(-p.drop)} en une séance. Vos analystes estiment la probabilité d'un rebond rapide à ${Math.round(p.est * 100)} %.`,
    options: [
      { label: 'Acheter le creux', hint: () => '+10 % d’exposition actions · risque +8', apply() { Portfolio.shiftInto('equities', 0.10); riskShock(8); } },
      { label: 'Rester investi et rassurer les clients', hint: p => `💰 −${fmtMoney(p.cost)} · 🤝 confiance +3`, apply(p) { payCash(p.cost); confAll(3); } },
      { label: 'Vendre pour protéger le capital', hint: () => '30 % des actifs risqués vendus (frais) · risque −10 · ⭐ −2 · 🤝 −2', apply() { Portfolio.derisk(0.3); riskShock(-10); addRep(-2); confAll(-2); } }
    ]
  },
  {
    id: 'crypto_bubble', icon: '🫧', title: 'Bulle crypto',
    cond: s => s.tier >= 4 && s.market.regime !== 'crisis' && s.market.regime !== 'bubble', cooldown: 60,
    weight: s => s.market.regime === 'bull' ? 2 : 0.7,
    prepare(s) {
      Market.forceRegime('bubble', randInt(8, 14), { regime: 'crisis', p: 0.55 });
      return { cost: 4 * U(), unlocked: Market.isUnlocked('crypto') };
    },
    text: p => `Les cryptomonnaies s'envolent, les actifs risqués suivent. Tout le monde parle de « nouveau paradigme ». Vos clients vous demandent pourquoi vous n'êtes pas exposé. ${p.unlocked ? '' : '(La crypto n’est pas encore débloquée : le pari se fera sur les actions.)'}`,

const Events = {
  get(id) { return EVENTS.find(e => e.id === id); },
  redeem(invId, frac) {
    const inv = S.investors.list.find(i => i.id === invId);
    if (!inv) return;
    const amt = Investors.capital(inv) * frac;
    inv.shares *= 1 - frac;
    Portfolio.withdraw(amt);
    if (inv.shares <= 1e-9) S.investors.list = S.investors.list.filter(i => i !== inv);
    Portfolio.syncNavps();
  },
  /* Étape 8 du tick : tirage d'un événement */
  maybeTrigger() {
    const ev = S.events;
    if (ev.pending || S.week < ev.nextWeek) return;
    const mode = CONFIG.MODES[S.difficulty];
    ev.nextWeek = S.week + randInt(mode.eventInterval[0], mode.eventInterval[1]);
    const weights = {};
    for (const e of EVENTS) {
      if (!!e.prop !== !S.prop.launched) continue; // phase prop firm : événements dédiés uniquement
      if (!e.cond(S)) continue;
      if (ev.last[e.id] !== undefined && S.week - ev.last[e.id] < e.cooldown) continue;
      weights[e.id] = e.weight(S);
    }
    const id = pickWeighted(weights);
    if (!id) return;
    this.trigger(id);
  },
  trigger(id) {
    const e = this.get(id);
    S.events.last[id] = S.week;
    const params = e.prepare(S) || {};
    S.events.pending = { id, params, week: S.week };
    Game.log(`Événement : ${e.icon} ${e.title}.`, 'warn');
    UI.toast(`${e.icon} ${e.title}`, 'warn');
    UI.showEvent();
  },
  resolve(i) {
    const p = S.events.pending;
    if (!p) return;
    const e = this.get(p.id);
    const opt = e.options[i];
    if (!opt) return;
    opt.apply(p.params);
    S.events.pending = null;
    Team.invalidate();
    Portfolio.syncNavps();
    Game.log(`↳ Décision : « ${opt.label} ».`, 'info');
    if (S.quarter) S.quarter.decisions.push(`${e.icon} ${e.title} → ${opt.label}`);
    UI.closeModal();
    const q = S.events.queue;
    if (q && q.length && !S.events.pending) this.trigger(q.shift());
    if (!S.events.pending && S.events.victoryQueued) { S.events.victoryQueued = false; UI.showVictory(); }
    UI.renderAll();
  }
};

  { id: 'dd', gen: () => ({ x: pick([0.05, 0.08]) }), text: p => `Drawdown du trimestre ≤ ${fmtPct(p.x, 0)}`, live: q => q.maxDD, ok: (q, p) => q.maxDD <= p.x, fmt: v => fmtPct(v, 1) + ' de drawdown' },
  { id: 'flows', text: () => 'Flux nets de clients positifs', live: q => q.subs - q.reds, ok: q => q.subs >= q.reds, fmt: v => fmtMoney(v) + ' nets' },
  { id: 'calm', text: () => 'Risque moyen < 60 et aucun margin call', live: q => q.riskAvg, ok: q => q.mc === 0 && q.riskAvg < 60, fmt: v => 'risque moyen ' + Math.round(v) }
];
const Quarter = {
  goalDef() { return S.goal && GOALS.find(g => g.id === S.goal.id); },
  start() {
    const g = pick(GOALS.filter(x => x.id !== 'beat' || S.bench.def));
    S.goal = { id: g.id, p: g.gen ? g.gen() : {}, reward: 8 * U() };
    S.quarter = { start: S.week, nav: S.fund.navps, bench: S.bench.value, aum: Game.totalAUM(), cash: S.cash, peak: S.fund.navps, maxDD: 0,
      subs: 0, reds: 0, mgmt: 0, perf: 0, sal: 0, risk: 0, n: 0, mc: S.counters.marginCalls, pnl: {}, regimes: [], decisions: [] };
  },
  /* Statistiques courantes du trimestre */
  live() {
    const q = S.quarter;
    return { ret: S.fund.navps / q.nav - 1, benchRet: S.bench.value / q.bench - 1, maxDD: q.maxDD, subs: q.subs, reds: q.reds,
      riskAvg: q.n ? q.risk / q.n : S.risk, mc: S.counters.marginCalls - q.mc };
  },
  step() {
    if (!S.prop.launched) return;
    if (!S.quarter) return this.start();
    const q = S.quarter;
    q.subs += S.last.subs; q.reds += S.last.reds; q.mgmt += S.last.mgmt; q.perf += S.last.perf; q.sal += S.last.salaries;
    q.risk += S.risk; q.n++;
    q.peak = Math.max(q.peak, S.fund.navps); q.maxDD = Math.max(q.maxDD, 1 - S.fund.navps / q.peak);
    for (const k in (S.last.pnl || {})) q.pnl[k] = (q.pnl[k] || 0) + S.last.pnl[k];
    if (S.week - q.start >= 13) this.end();
  },
  end() {
    const q = S.quarter, L = this.live(), g = this.goalDef();
    const ok = g.ok(L, S.goal.p);
    S.quarterN++;
    if (ok) { S.goalStreak++; S.goalsDone++; S.cash += S.goal.reward; addRep(2); confAll(2); }
    else { S.goalStreak = 0; addRep(-1); confAll(-3); }
    const pnl = Object.entries(q.pnl).filter(([, v]) => Math.abs(v) > 1e-9).sort((a, b) => b[1] - a[1]);
    const name = k => k === 'opps' ? 'Opportunités' : CONFIG.ASSETS[k].name;
    S.lastReport = {
      n: S.quarterN, week: S.week, ret: L.ret, benchRet: L.benchRet, benchName: Bench.name(), aum0: q.aum, aum1: Game.totalAUM(), subs: q.subs, reds: q.reds,
      fees: q.mgmt + q.perf, sal: q.sal, maxDD: q.maxDD, goal: g.text(S.goal.p), ok, reward: S.goal.reward, streak: S.goalStreak,
      best: pnl.length ? [name(pnl[0][0]), pnl[0][1]] : null, worst: pnl.length > 1 ? [name(pnl[pnl.length - 1][0]), pnl[pnl.length - 1][1]] : null,
      regimes: q.regimes, decisions: q.decisions.slice(-6)
    };
    Game.log(`📄 Rapport trimestriel n°${S.quarterN} : ${fmtPct(L.ret, 1, true)} (indice ${fmtPct(L.benchRet, 1, true)}). Objectif « ${g.text(S.goal.p)} » ${ok ? 'atteint ✅' : 'manqué ❌'}.`, ok ? 'good' : 'warn');
    this.start();
    if (S.showReports && !S.events.pending && !UI.batch) UI.showReport();
    else if (UI.batch) { /* affiché à la fin de l'avance rapide */ }
    else UI.toast(`📄 Rapport trimestriel : objectif ${ok ? 'atteint ✅' : 'manqué ❌'}`, ok ? 'good' : 'warn');
  }
};

  invest(id, frac) {

    const A = Portfolio.aum();

    if (amt <= 0) return UI.toast(`Limite atteinte : ${fmtPct(this.maxShare, 0)} de l'AUM maximum en opportunités.`, 'warn');

const Satellites = {
  maxCount() { return S.tier >= 9 ? 2 : S.tier >= 7 ? 1 : 0; },
  cost() { return 100 * U(); },
  perf(x) { const h = x.hist; if (h.length < 5) return 0.06; const n = Math.min(26, h.length - 1); return clamp((h[h.length - 1] / h[h.length - 1 - n] - 1) * 52 / n, -0.8, 1.5); },
  launch(type) {
    if (S.satellites.length >= this.maxCount() || S.satellites.some(x => x.type === type)) return;
    if (S.cash < this.cost()) return UI.toast('Cash insuffisant pour lancer un fonds.', 'bad');
    S.cash -= this.cost();
    const seed = Portfolio.aum() * 0.03;
    S.satellites.push({ id: S.nextSatId++, type, aum: seed, navps: 100, hwm: 100, conf: 55, start: S.week, hist: [100], lastFlow: 0 });
    Game.log(`🧩 Lancement du ${SAT_TYPES[type].name} avec ${fmtMoney(seed)} de nouveaux clients.`, 'tier');
    UI.toast(`🧩 ${SAT_TYPES[type].name} lancé !`, 'tier');
    UI.renderAll();
  },
  close(id) {
    const x = S.satellites.find(y => y.id === id); if (!x) return;
    S.satellites = S.satellites.filter(y => y !== x);
    addRep(-2);
    Game.log(`Fermeture du ${SAT_TYPES[x.type].name} : les clients récupèrent leurs ${fmtMoney(x.aum)}.`, 'warn');
    UI.renderAll();
  },
  step() {
    const r = S.market.lastReturns;
    for (const x of S.satellites.slice()) {
      const T = SAT_TYPES[x.type];
      let ret = 0, wsum = 0;
      for (const k in T.w) { const kk = Market.isUnlocked(k) ? k : 'equities'; ret += T.w[k] * (r[kk] + Portfolio.alpha(kk) / 52); wsum += T.w[k]; }
      x.navps *= 1 + ret; x.aum *= 1 + ret;
      const mg = x.aum * CONFIG.MGMT_FEE / 52;
      x.aum -= mg; x.navps *= 1 - CONFIG.MGMT_FEE / 52; S.cash += mg * S.feeShare;
      if ((S.week - x.start) % CONFIG.PERF_FEE_PERIOD === 0 && x.navps > x.hwm) {
        const fee = (x.navps / x.hwm - 1) * x.aum * CONFIG.PERF_FEE;
        x.aum -= fee; x.navps *= 1 - fee / (x.aum + fee); S.cash += fee * S.feeShare; x.hwm = x.navps;
      }
      x.hist.push(x.navps); if (x.hist.length > 60) x.hist.shift();
      const perf = this.perf(x);
      let d = clamp((perf - T.objective) * 8, -1.5, 1.5) + (S.reputation - 30) / 50 * 0.4 + (55 - x.conf) * 0.05;
      if (S.compliance < T.minCompliance) d -= 1.5;
      x.conf = clamp(x.conf + d + gauss() * 0.6, 0, 100);
      let flow = x.aum * 0.003 * Investors.attractiveness() * T.flow * Investors.saturation(x.aum) * (x.conf > 40 ? 1 : 0);
      if (x.conf < 40) flow -= x.aum * (40 - x.conf) / 40 * 0.08;
      x.aum = Math.max(0, x.aum + flow); x.lastFlow = flow;
      if (x.aum < 1000) { Game.log(`Le ${T.name} n'a plus de clients et ferme.`, 'bad'); S.satellites = S.satellites.filter(y => y !== x); }
    }
  }
};

/* --- Analyse de marché : statistiques, corrélations, risque, frontière --- */
const Analysis = {
  _front: null, _frontKey: '',
  optimizerAvailable() { return !!S && (Team.hasRole('quant') || S.strategy === 'quant'); },
  /* Données débloquées par l'équipe et les améliorations */
  level() { return { data: Progression.upg('data') > 0 || S.strategy === 'macro', risk: Progression.upg('riskengine') > 0, quant: this.optimizerAvailable() }; },
  keys() { return RISKY.filter(k => Market.isUnlocked(k)); },
  rets(k, n) { const h = S.market.hist[k] || []; const out = []; for (let i = Math.max(1, h.length - n); i < h.length; i++) out.push(h[i] / h[i - 1] - 1); return out; },
  mean(a) { return a.reduce((x, y) => x + y, 0) / (a.length || 1); },
  sd(a) { const m = this.mean(a); return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / Math.max(1, a.length - 1)); },
  corr(a, b) {
    const n = Math.min(a.length, b.length); if (n < 4) return 0;
    a = a.slice(-n); b = b.slice(-n);
    const ma = this.mean(a), mb = this.mean(b);
    let c = 0, va = 0, vb = 0;
    for (let i = 0; i < n; i++) { c += (a[i] - ma) * (b[i] - mb); va += (a[i] - ma) ** 2; vb += (b[i] - mb) ** 2; }
    return va > 0 && vb > 0 ? c / Math.sqrt(va * vb) : 0;
  },
  /* Statistiques d'un actif sur l'historique visible */
  stats(k) {
    const h = S.market.hist[k] || [];
    const ch = n => h.length > n ? h[h.length - 1] / h[h.length - 1 - n] - 1 : null;
    const r52 = this.rets(k, 52), re = this.rets('equities', 52);
    let peak = 0, mdd = 0;
    for (const v of h.slice(-53)) { peak = Math.max(peak, v); mdd = Math.max(mdd, 1 - v / peak); }
    const s52 = this.sd(r52);
    const n = Math.min(r52.length, re.length);
    const a = r52.slice(-n), b = re.slice(-n), ma = this.mean(a), mb = this.mean(b);
    let cov = 0, vb = 0;
    for (let i = 0; i < n; i++) { cov += (a[i] - ma) * (b[i] - mb); vb += (b[i] - mb) ** 2; }
    return { c4: ch(4), c13: ch(13), c52: ch(52), vol: s52 * Math.sqrt(52), mdd,
      sharpe: s52 > 0 ? (this.mean(r52) * 52 - 0.02) / (s52 * Math.sqrt(52)) : 0, beta: vb > 0 ? cov / vb : 0 };
  },
  /* Rendement annualisé moyen observé dans chaque régime depuis le début de la partie */
  regimePerf(k, reg) { const c = S.market.regStats[k] && S.market.regStats[k][reg]; return c && c.n >= 2 ? { v: (Math.exp(c.s / c.n) - 1) * 52, n: c.n } : null; },   // rendement hebdo moyen × 52
  /* Covariance théorique (régime courant) sur une liste d'actifs */
  cov(keys) {
    const C = Market.corrMatrix(S.market.regime), red = Math.min(0.45, Team.effects().volRed + Strat.b('volRed'));
    const idx = keys.map(k => RISKY.indexOf(k)), v = keys.map(k => Market.effVol(k) * (1 - red));
    return keys.map((_, i) => keys.map((_, j) => C[idx[i]][idx[j]] * v[i] * v[j]));
  },
  /* Contribution de chaque ligne au risque du portefeuille (somme = 100 %) */
  riskContrib() {
    const w = Portfolio.weights(), keys = RISKY.filter(k => Math.abs(w[k]) > 1e-4);
    if (!keys.length) return [];
    const V = this.cov(keys), x = keys.map(k => w[k]);
    const m = V.map(row => row.reduce((t, c, j) => t + c * x[j], 0));
    const tot = x.reduce((t, xi, i) => t + xi * m[i], 0);
    if (tot <= 0) return [];
    return keys.map((k, i) => ({ k, w: w[k], c: x[i] * m[i] / tot })).sort((a, b) => b.c - a.c);
  },
  /* Nombre effectif de paris indépendants -> score de diversification 0-100 */
  diversification() {
    if (!S) return { neff: 0, score: 0 };
    const rc = this.riskContrib().filter(r => r.c > 0);
    if (!rc.length) return { neff: 0, score: 0 };
    const neff = 1 / rc.reduce((t, r) => t + r.c * r.c, 0);
    return { neff, score: clamp((neff - 1) / 5 * 100, 0, 100) };
  },
  /* Portefeuilles aléatoires (long-only, 40 % max par ligne) : rendement prévu vs volatilité */
  frontier() {
    const key = S.week + '|' + S.tier + '|' + S.market.regime + '|' + S.market.perceived;
    if (this._front && this._frontKey === key) return this._front;
    const keys = this.keys(), V = this.cov(keys), mu = keys.map(k => S.market.forecasts[k] || 0);
    const pts = [];
    const evalW = x => { let r = 0, v = 0; for (let i = 0; i < x.length; i++) { r += x[i] * mu[i]; for (let j = 0; j < x.length; j++) v += x[i] * x[j] * V[i][j]; } return { r, vol: Math.sqrt(Math.max(v, 0)), x }; };
    for (let t = 0; t < 400; t++) {   // Math.random : n'influence pas l'aléatoire du jeu
      const sub = keys.map(() => Math.random() < 0.45 ? -Math.log(Math.random() + 1e-9) : 0);
      let sum = sub.reduce((a, b) => a + b, 0); if (sum <= 0) continue;
      let x = sub.map(v => v / sum);
      for (let it = 0; it < 5; it++) { const ex = x.reduce((a, v) => a + Math.max(0, v - 0.4), 0); if (ex < 1e-6) break; const free = x.filter(v => v < 0.4).reduce((a, v) => a + v, 0) || 1; x = x.map(v => v >= 0.4 ? 0.4 : v + ex * v / free); }
      pts.push(evalW(x));
    }
    this._frontKey = key;
    return (this._front = { keys, pts, evalW });
  },
  /* Portefeuille au meilleur ratio rendement prévu / risque (investi à 90 %) */
  optimal() {
    const F = this.frontier();
    let best = null, bs = -Infinity;
    for (const p of F.pts) { const sh = (p.r - 0.02) / Math.max(0.01, p.vol); if (sh > bs) { bs = sh; best = p; } }
    const t = {};
    if (best) F.keys.forEach((k, i) => { const w = Math.round(best.x[i] * 90); if (w > 0) t[k] = w; });
    return { t, p: best };
  }
};
