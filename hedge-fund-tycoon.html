<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedge Fund Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<!--
=============================================================================
  HEDGE FUND TYCOON — jeu tycoon financier, fichier unique (HTML + CSS + JS)
=============================================================================
  COMMENT LANCER LE JEU
  ---------------------
  1. Double-cliquez sur « hedge-fund-tycoon.html » : il s'ouvre dans votre
     navigateur (Chrome, Firefox, Edge ou Safari récents).
  2. Aucune installation, aucun serveur, aucune étape de build.
  3. Le graphique de NAV utilise Chart.js (CDN jsDelivr). Sans connexion
     Internet, un graphique de secours simplifié est dessiné et le jeu
     fonctionne normalement.
  4. La partie est sauvegardée dans le localStorage du navigateur :
     automatiquement toutes les 4 semaines et à chaque déménagement,
     et manuellement via le bouton 💾. Le bouton 📂 recharge la sauvegarde.
  5. Raccourci clavier : barre d'espace = « Semaine suivante ».

  ORGANISATION DU CODE (script principal, en bas du fichier)
  ----------------------------------------------------------
   1. CONFIG        constantes d'équilibrage (à ajuster ici)
   2. UTILS         aléatoire, formatage, maths
   3. STATE         modèle d'état + création d'une partie
   4. MARKET        prix, régimes markoviens, corrélations
   5. PORTFOLIO     positions, allocation cible, frais, stop-loss
   6. TEAM          employés, recrutement, formation, effets
   7. INVESTORS     clients, flux, frais de gestion / performance
   8. RISK          risque, conformité, réputation, margin call, amendes
   9. EVENTS        cartes événements à choix multiples
  10. PROGRESSION   paliers / locaux, améliorations, victoire / défaite
  11. GAME          boucle de jeu (tick hebdomadaire)
  12. SAVE          sauvegarde localStorage + legacy
  13. UI            rendu, onglets, modales, toasts, graphique
  14. MAIN          démarrage
=============================================================================
-->
<style>
  :root {
    --bg: #0b0f17;
    --bg2: #121826;
    --panel: rgba(20, 26, 40, 0.88);
    --panel2: rgba(28, 36, 54, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6e9f0;
    --muted: #8b95a8;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --accent: #d9a066;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    transition: background 1s ease;
  }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .amber { color: var(--amber); }
  .accent { color: var(--accent); }
  h1, h2, h3, h4 { margin: 0; }
  h3 { font-size: 15px; margin-bottom: 8px; }
  h4 { font-size: 13px; margin-bottom: 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  /* Décor de fond : grande icône du local, change à chaque palier */
  #decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #decorIcon { position: absolute; right: -40px; bottom: -60px; font-size: 420px; opacity: 0.05; filter: grayscale(0.3); transition: opacity 1s; }
  #app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; }

  /* Barre du haut */
  .topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 20px; letter-spacing: .02em; }
  .logo { font-size: 28px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #111; font-weight: 700; border-color: transparent; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
  .btn.danger { border-color: rgba(248,113,113,.5); color: var(--red); }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .btn.on { border-color: var(--green); color: var(--green); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; backdrop-filter: blur(6px); }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }

  /* Palier */
  .tierbar { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .gl { border-bottom: 1px dotted var(--muted); cursor: help; }
  .goalbar { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; font-size: 13px; padding: 8px 12px; }
  .goalbar > div { min-width: 0; }
  .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .ach .card { padding: 8px; font-size: 12px; }
  .ach .off { opacity: .35; filter: grayscale(1); }
  .tier-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .tier-badge .ic { font-size: 26px; }
  .tier-badge .lvl { background: var(--accent); color: #111; border-radius: 6px; padding: 2px 7px; font-size: 12px; }
  .tier-progress { flex: 1; min-width: 200px; }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s; }

  /* Indicateurs */
  .stats { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat .lab { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .val { font-size: 17px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .sub { font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gauge { height: 4px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .gauge > div { height: 100%; border-radius: 3px; }

  /* Graphique */
  .chartpanel { margin-bottom: 10px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .chartwrap { position: relative; height: 220px; }
  #chartMsg { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Onglets */
  .tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 8px; scrollbar-width: thin; }
  .tab { background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; font-size: 13px; font-family: inherit; }
  .tab.active { color: var(--text); background: var(--panel); border-color: var(--border); }
  .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); margin-left: 5px; vertical-align: middle; }

  .grid { display: grid; gap: 10px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .mt { margin-top: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.05); }
  .kv:last-child { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: rgba(255,255,255,.08); }
  .pill.g { background: rgba(52,211,153,.15); color: var(--green); }
  .pill.r { background: rgba(248,113,113,.15); color: var(--red); }
  .pill.a { background: rgba(251,191,36,.15); color: var(--amber); }
  .pill.b { background: rgba(96,165,250,.15); color: var(--blue); }

  /* Cartes d'actifs */
  .asset { position: relative; }
  .asset .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .asset .name { font-weight: 700; }
  .asset .price { font-size: 18px; font-weight: 700; }
  .asset svg { width: 100%; height: 40px; display: block; margin: 6px 0; }
  .locked { opacity: .45; }

  /* Allocation */
  .stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.06); }
  .stack > div { height: 100%; transition: width .3s; min-width: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-size: 11px; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 4px; vertical-align: -1px; }
  .alloc-row { display: grid; grid-template-columns: 170px 30px 1fr 30px 70px 70px 110px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .alloc-row:last-child { border-bottom: none; }
  .grp-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding: 4px 0; border-bottom: 2px solid var(--border); color: var(--accent); }
  .heat { border-collapse: collapse; font-size: 10px; }
  .heat td, .heat th { width: 30px; height: 26px; text-align: center; padding: 0; }
  .heat th.v { writing-mode: vertical-rl; transform: rotate(180deg); height: 70px; font-weight: 600; color: var(--muted); }
  .heat th.h { text-align: right; padding-right: 6px; width: auto; white-space: nowrap; color: var(--muted); }
  .sens { display: inline-block; width: 34px; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; position: relative; vertical-align: middle; }
  .sens > i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .lockbox { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); }
  .alloc-row input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], input[type=number] { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; font-family: inherit; font-size: 12px; }

  /* Équipe */
  .emp .title { font-weight: 700; }
  .traits { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }

  /* Journal */
  .journal { max-height: 520px; overflow-y: auto; }
  .jline { padding: 5px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; font-size: 13px; }
  .jline .w { color: var(--muted); min-width: 74px; }
  .jline.good .t { color: var(--green); }
  .jline.bad .t { color: var(--red); }
  .jline.warn .t { color: var(--amber); }
  .jline.tier .t { color: var(--accent); font-weight: 700; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.t th, table.t td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  table.t th { color: var(--muted); font-weight: 600; }
  table.t tr.cur td { background: rgba(255,255,255,.05); color: var(--accent); font-weight: 700; }
  .tablewrap { overflow-x: auto; }

  /* Tutoriel */
  #tutPanel { position: fixed; left: 12px; bottom: 12px; z-index: 46; width: min(380px, calc(100vw - 24px)); background: #1b2436; border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); font-size: 13px; }
  #tutPanel h4 { color: var(--accent); margin-bottom: 4px; }
  #tutPanel p { margin: 6px 0; line-height: 1.45; }
  .tut-hl { outline: 3px solid var(--accent) !important; outline-offset: 2px; animation: tutpulse 1.2s ease-in-out infinite; position: relative; z-index: 2; }
  @keyframes tutpulse { 0%, 100% { outline-color: var(--accent); } 50% { outline-color: transparent; } }
  /* Toasts */
  #toasts { position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; flex-direction: column; gap: 6px; max-width: min(360px, calc(100vw - 24px)); }
  .toast { background: var(--panel2); border: 1px solid var(--border); border-left: 4px solid var(--blue); border-radius: 8px; padding: 9px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .25s ease; }
  .toast.good { border-left-color: var(--green); }
  .toast.bad { border-left-color: var(--red); }
  .toast.warn { border-left-color: var(--amber); }
  .toast.tier { border-left-color: var(--accent); }
  @keyframes tin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Modales */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #151c2b; border: 1px solid var(--border); border-radius: 14px; max-width: 620px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal h2 { font-size: 20px; margin-bottom: 8px; }
  .modal .icon { font-size: 40px; }
  .choice { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 10px 12px; }
  .choice b { display: block; margin-bottom: 3px; }
  .choice .hint { font-size: 12px; color: var(--muted); }
  .diffopt { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .diffopt label { flex: 1; min-width: 200px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; }
  .diffopt input { margin-right: 6px; }

  /* Fondu au noir lors d'un déménagement */
  #fade { position: fixed; inset: 0; background: #000; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .9s ease; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; text-align: center; }
  #fade:not(.show) { visibility: hidden; transition: opacity .9s ease, visibility 0s linear .9s; }
  #fade.show { opacity: 1; pointer-events: all; visibility: visible; }
  #fade .big { font-size: 90px; }
  #fade .ttl { font-size: 26px; font-weight: 700; margin-top: 10px; }

  /* Responsive */
  @media (max-width: 1100px) {
    .stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  .alloc-row .a-info { display: contents; }
  @media (max-width: 760px) {
    #app { padding: 8px 16px 40px; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g2, .g3, .g4 { grid-template-columns: 1fr; }
    .chartwrap { height: 170px; }
    .brand h1 { font-size: 17px; }
    #decorIcon { font-size: 260px; }
    /* Ligne d'allocation sur 3 rangées : nom / − curseur + / infos */
    .alloc-row { grid-template-columns: 30px minmax(0, 1fr) 30px; }
    .alloc-row .a-name { grid-column: 1 / 4; }
    .alloc-row .a-info { grid-column: 1 / 4; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
    #toasts .toast:nth-last-child(n+4) { display: none; }
  }

  /* =====================================================================
     THÈMES (ébauche) — même structure, habillage différent.
     body[data-theme] : 'terminal' (type Bloomberg) | 'journal' (éditorial)
     ===================================================================== */
  /* ---- 1. Terminal ---- */
  body[data-theme="terminal"] {
    --bg: #000; --bg2: #000; --panel: #070707; --panel2: #0c0c0c; --border: #262626;
    --text: #e6e6e6; --muted: #8c8c8c; --green: #00c853; --red: #ff3d3d; --amber: #ffab00; --blue: #4fc3f7; --accent: #ffab00; --radius: 0px;
    background: #000; font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
  }
  body[data-theme="terminal"] #decorIcon { display: none; }
  body[data-theme="terminal"] .panel, body[data-theme="terminal"] .card, body[data-theme="terminal"] .stat,
  body[data-theme="terminal"] .modal, body[data-theme="terminal"] .toast, body[data-theme="terminal"] #tutPanel { border-radius: 0; backdrop-filter: none; box-shadow: none; }
  body[data-theme="terminal"] .panel { background: #000; border-color: #262626; }
  body[data-theme="terminal"] .card { background: #050505; border-color: #1f1f1f; }
  body[data-theme="terminal"] .stat { background: #000; border: none; border-left: 2px solid var(--amber); padding: 4px 10px; }
  body[data-theme="terminal"] .stat .lab { color: var(--amber); }
  body[data-theme="terminal"] .stat .val { font-weight: 500; font-size: 18px; }
  body[data-theme="terminal"] h1 { font-size: 16px; letter-spacing: .15em; text-transform: uppercase; color: var(--amber); }
  body[data-theme="terminal"] h3, body[data-theme="terminal"] h4 { color: var(--amber); text-transform: uppercase; letter-spacing: .1em; font-weight: 500; }
  body[data-theme="terminal"] .logo { display: none; }
  body[data-theme="terminal"] .btn { border-radius: 0; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; background: #111; border-color: #333; font-family: inherit; }
  body[data-theme="terminal"] .btn:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
  body[data-theme="terminal"] .btn.primary { background: var(--amber); color: #000; }
  body[data-theme="terminal"] .tabs { border-bottom: 1px solid var(--amber); gap: 0; }
  body[data-theme="terminal"] .tab { border-radius: 0; font-family: inherit; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--amber); }
  body[data-theme="terminal"] .tab.active { background: var(--amber); color: #000; border-color: var(--amber); }
  body[data-theme="terminal"] .pill { border-radius: 0; background: #1a1a1a; }
  body[data-theme="terminal"] .bar, body[data-theme="terminal"] .gauge, body[data-theme="terminal"] .stack { border-radius: 0; }
  body[data-theme="terminal"] .bar > div, body[data-theme="terminal"] .gauge > div { border-radius: 0; }
  body[data-theme="terminal"] .tier-badge .lvl { border-radius: 0; }
  body[data-theme="terminal"] table.t th { color: var(--amber); text-transform: uppercase; font-weight: 500; font-size: 11px; }
  body[data-theme="terminal"] .kv { border-bottom: 1px solid #141414; }
  body[data-theme="terminal"] select, body[data-theme="terminal"] input { border-radius: 0; background: #000; font-family: inherit; }

  /* ---- 2. Journal financier ---- */
  body[data-theme="journal"] {
    --bg: #f4efe4; --bg2: #f4efe4; --panel: #fbf8f1; --panel2: #fffdf8; --border: #d8cdb8;
    --text: #1c1915; --muted: #6e6557; --green: #17693c; --red: #a1232b; --amber: #9a6400; --blue: #1f4e79; --accent: #7a1f2b; --radius: 2px;
    background: #f4efe4; color: var(--text); font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; font-size: 15px;
  }
  body[data-theme="journal"] #decorIcon { display: none; }
  body[data-theme="journal"] .num, body[data-theme="journal"] .stat .val, body[data-theme="journal"] table.t td, body[data-theme="journal"] .btn,
  body[data-theme="journal"] select, body[data-theme="journal"] input, body[data-theme="journal"] .tab, body[data-theme="journal"] .pill { font-family: 'Inter', system-ui, sans-serif; }
  body[data-theme="journal"] .panel { background: transparent; border: none; border-top: 3px double var(--text); border-radius: 0; backdrop-filter: none; padding: 10px 0; }
  body[data-theme="journal"] .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 2px; }
  body[data-theme="journal"] .stat { background: transparent; border: none; border-top: 1px solid var(--text); border-radius: 0; padding: 6px 4px; }
  body[data-theme="journal"] .stat .lab { color: var(--accent); font-variant: small-caps; text-transform: none; letter-spacing: .05em; font-size: 13px; }
  body[data-theme="journal"] .stat .val { font-size: 20px; }
  body[data-theme="journal"] h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  body[data-theme="journal"] h3 { font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--text); padding-bottom: 3px; }
  body[data-theme="journal"] h4 { color: var(--accent); font-variant: small-caps; text-transform: none; letter-spacing: .06em; font-size: 14px; }
  body[data-theme="journal"] .logo { display: none; }
  body[data-theme="journal"] .btn { background: transparent; border: 1px solid var(--text); border-radius: 2px; color: var(--text); }
  body[data-theme="journal"] .btn:hover:not(:disabled) { background: var(--text); color: var(--bg); }
  body[data-theme="journal"] .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  body[data-theme="journal"] .tabs { border-bottom: 1px solid var(--text); }
  body[data-theme="journal"] .tab { color: var(--muted); border-radius: 0; }
  body[data-theme="journal"] .tab.active { background: transparent; color: var(--text); border: none; border-bottom: 3px solid var(--accent); font-weight: 700; }
  body[data-theme="journal"] .pill { background: transparent; border: 1px solid var(--border); border-radius: 2px; }
  body[data-theme="journal"] .bar, body[data-theme="journal"] .gauge, body[data-theme="journal"] .stack, body[data-theme="journal"] .sens { background: rgba(0,0,0,.08); border-radius: 0; }
  body[data-theme="journal"] .kv { border-bottom: 1px dotted var(--border); }

/* =============================================================================
   2. UTILS — aléatoire (graine sauvegardée), formatage, maths
   ============================================================================= */
const RNG = {
  seed: (Date.now() ^ 0x5f3759df) >>> 0,
  next() { // mulberry32
    let t = (this.seed = (this.seed + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
};
const rng = () => RNG.next();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rand = (a, b) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function poisson(l) {
  if (l <= 0) return 0;
  if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * gauss()));
  const L = Math.exp(-l);
  let k = 0, p = 1;
  do { k++; p *= rng(); } while (p > L);
  return k - 1;
}
function pickWeighted(obj) {
  const entries = Object.entries(obj).filter(([, w]) => w > 0);
  const total = entries.reduce((a, [, w]) => a + w, 0);
  let r = rng() * total;
  for (const [k, w] of entries) { r -= w; if (r <= 0) return k; }
  return entries.length ? entries[entries.length - 1][0] : null;
}
/* Fonction de répartition de la loi normale (approximation d'Abramowitz-Stegun) */
function normCdf(x) { const t = 1 / (1 + 0.2316419 * Math.abs(x)); const d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* Formatage monétaire : séparateurs de milliers puis notation k / M / Md / T */
function fmtNum(x, d = 0) { return x.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtMoney(x) {
  if (x === null || x === undefined || !isFinite(x)) return x === Infinity ? '∞' : '—';
  const s = x < 0 ? '−' : '';
  const a = Math.abs(x);
  let str;
  if (a < 10) str = fmtNum(a, 2) + ' $';
  else if (a < 1e5) str = fmtNum(Math.round(a)) + ' $';
  else if (a < 1e6) str = fmtNum(a / 1e3, 1) + ' k$';
  else if (a < 1e9) str = fmtNum(a / 1e6, 2) + ' M$';
  else if (a < 1e12) str = fmtNum(a / 1e9, 2) + ' Md$';
  else str = fmtNum(a / 1e12, 2) + ' T$';
  return s + str;
}
function fmtShort(x) { // pour axes de graphique
  const a = Math.abs(x);
  if (a >= 1e12) return fmtNum(x / 1e12, 1) + ' T';
  if (a >= 1e9) return fmtNum(x / 1e9, 1) + ' Md';
  if (a >= 1e6) return fmtNum(x / 1e6, 1) + ' M';
  if (a >= 1e3) return fmtNum(x / 1e3, 0) + ' k';
  return fmtNum(x, 0);
}
function fmtPct(x, d = 1, sign = false) {
  if (!isFinite(x)) return '—';
  const v = x * 100;
  // Les variations signées portent aussi ▲/▼ : l'information ne repose pas sur la couleur seule
  const s = sign ? (v > 0 ? '▲+' : v < 0 ? '▼−' : '') : (v < 0 ? '−' : '');
  return s + fmtNum(Math.abs(v), d) + ' %';
}
function fmtSigned(x, d = 0) { return (x > 0 ? '+' : x < 0 ? '−' : '') + fmtNum(Math.abs(x), d); }
function cls(x) { return x > 0 ? 'green' : x < 0 ? 'red' : 'muted'; }

/* Cholesky (matrice de corrélation -> facteur triangulaire) avec garde-fou */
function cholesky(A) {
  const n = A.length;
  const L = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let sum = A[i][j];
      for (let k = 0; k < j; k++) sum -= L[i][k] * L[j][k];
      if (i === j) L[i][j] = Math.sqrt(Math.max(sum, 1e-6));
      else L[i][j] = sum / L[j][j];
    }
  }
  return L;
}
