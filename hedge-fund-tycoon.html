const Events = {
  get(id) { return EVENTS.find(e => e.id === id); },
  redeem(invId, frac) {
    const inv = S.investors.list.find(i => i.id === invId);
    if (!inv) return;
    const amt = Investors.capital(inv) * frac;
    inv.shares *= 1 - frac;
    Portfolio.withdraw(amt);
    if (inv.shares <= 1e-9) S.investors.list = S.investors.list.filter(i => i !== inv);
    Portfolio.syncNavps();
  },
  /* Étape 8 du tick : tirage d'un événement */
  maybeTrigger() {
    const ev = S.events;
    if (ev.pending || S.week < ev.nextWeek) return;
    const mode = CONFIG.MODES[S.difficulty];
    ev.nextWeek = S.week + randInt(mode.eventInterval[0], mode.eventInterval[1]);
    const weights = {};
    for (const e of EVENTS) {
      if (!e.cond(S)) continue;
      if (ev.last[e.id] !== undefined && S.week - ev.last[e.id] < e.cooldown) continue;
      weights[e.id] = e.weight(S);
    }
    const id = pickWeighted(weights);
    if (!id) return;
    this.trigger(id);
  },
  trigger(id) {
    const e = this.get(id);
    S.events.last[id] = S.week;
    const params = e.prepare(S) || {};
    S.events.pending = { id, params, week: S.week };
    Game.log(`Événement : ${e.icon} ${e.title}.`, 'warn');
    UI.toast(`${e.icon} ${e.title}`, 'warn');
    UI.showEvent();
  },
  resolve(i) {
    const p = S.events.pending;
    if (!p) return;
    const e = this.get(p.id);
    const opt = e.options[i];
    if (!opt) return;
    opt.apply(p.params);
    S.events.pending = null;
    Team.invalidate();
    Portfolio.syncNavps();
    Game.log(`↳ Décision : « ${opt.label} ».`, 'info');
    UI.closeModal();
    UI.renderAll();
  }
};

/* =============================================================================
   10. PROGRESSION — paliers, améliorations, victoire / défaite
   ============================================================================= */
const Progression = {
  upg(id) { return (S && S.upgrades[id]) || 0; },

  /* Somme des bonus de paliers atteints (+50 % au palier 12, x2 au palier 15) */
  tierBonus(key) {
    if (!S) return 0;
    let b = 0;
    for (let i = 0; i < S.tier; i++) b += TIERS[i].bonus[key] || 0;
    if (S.tier >= 12) b *= 1.5;
    if (S.tier >= 15) b *= 2;
    return b;
  },
  tierForAUM(a) {
    let t = 1;
    for (let i = 0; i < TIERS.length; i++) if (a >= TIERS[i].min) t = i + 1;
    return t;
  },

  /* Étape 9 du tick : déménagement automatique (irréversible sauf hard mode) */
  checkTier() {
    const A = Portfolio.aum();
    const t = this.tierForAUM(A);
    if (t > S.tier) {
      const from = S.tier;
      for (let n = from + 1; n <= t; n++) {
        const T = TIERS[n - 1];
        Game.log(`🚚 Déménagement : palier ${n} — ${T.name} (${T.local}). Capacité ${T.cap === Infinity ? '∞' : T.cap}. Bonus : ${T.bonusTxt}. Déblocages : ${T.unlocks}.`, 'tier');
      }
      S.tier = t;
      Team.invalidate();
      Portfolio.normalizeTarget();
      Team.refreshCandidates(true);
      UI.tierTransition(TIERS[t - 1], t);
      Save.save(true);
    } else if (S.hardMode && S.tier > 1 && A < TIERS[S.tier - 1].min * 0.5) {
      S.tier--;
      Team.invalidate();
      Portfolio.normalizeTarget();
      Game.log(`⬇️ Hard mode : le fonds est rétrogradé au palier ${S.tier} (${TIERS[S.tier - 1].name}).`, 'bad');
      UI.toast(`⬇️ Rétrogradation : ${TIERS[S.tier - 1].name}`, 'bad');
      UI.applyDecor();
    }
  },

  /* Améliorations */
  upgradeCost(u) { const l = this.upg(u.id); return l < u.cost.length ? { cash: u.cost[l], rp: u.rp[l] } : null; },
  buyUpgrade(id) {
    const u = UPGRADES.find(x => x.id === id);
    if (!u) return;
    const c = this.upgradeCost(u);
    if (!c) return;
    if (S.tier < u.tier) return UI.toast(`Palier ${u.tier} requis.`, 'warn');
    if (S.cash < c.cash || S.rp < c.rp) return UI.toast('Ressources insuffisantes.', 'bad');
    S.cash -= c.cash; S.rp -= c.rp;
    S.upgrades[id] = this.upg(id) + 1;
    if (id === 'pr') addRep(5);
    Team.invalidate();
    Game.log(`Amélioration : ${u.name} niveau ${S.upgrades[id]}.`, 'good');
    UI.toast(`${u.icon} ${u.name} niv. ${S.upgrades[id]}`, 'good');
    UI.renderAll();
  },

  /* Étape 10 du tick : victoire / défaite */
  checkEnd() {
    const A = Portfolio.aum();
    const c = S.counters, mode = CONFIG.MODES[S.difficulty];
    S.stats.peakAUM = Math.max(S.stats.peakAUM, A);
    if (A >= CONFIG.COLLAPSE_AFTER) S.investors.everAbove = true;

    if (!S.won && A >= CONFIG.WIN_AUM && S.reputation >= CONFIG.WIN_REP) {
      S.won = true;
      Game.log('🏆 VICTOIRE : 1 Md$ sous gestion et une réputation d’exception !', 'tier');
      UI.showVictory();
      return;
    }
    // Faillite : cash < 0 ET risque > 90 de façon durable
    if (S.cash < 0 && S.risk > CONFIG.RISK_MARGIN) c.bankruptWeeks++; else c.bankruptWeeks = 0;
    if (c.bankruptWeeks >= CONFIG.BANKRUPT_WEEKS) return this.lose('Faillite', 'Trésorerie négative et risque extrême pendant plusieurs semaines : vos prime brokers coupent les lignes.');
    // Licence : conformité < 20 prolongée
    if (S.compliance < 20) {
      c.lowComplianceWeeks++;
      if (c.lowComplianceWeeks === 1) UI.toast('🚨 Conformité critique : la licence est menacée !', 'bad');
    } else c.lowComplianceWeeks = 0;
    if (c.lowComplianceWeeks >= mode.licenseWeeks) return this.lose('Licence révoquée', 'Le régulateur suspend votre licence de gestion après des manquements répétés.');
    // Effondrement de l'AUM
    if (S.investors.everAbove && A < CONFIG.COLLAPSE_AUM) return this.lose('Effondrement de l’AUM', 'Vos clients sont partis : le fonds ne gère plus que des miettes.');
  },
  lose(title, why) {
    S.status = 'lost';
    Game.log(`💀 FIN DE PARTIE — ${title}. ${why}`, 'bad');
    Legacy.recordRun();
    Save.save(true);
    UI.showEnd(title, why);
  }
};

/* =============================================================================
   11. GAME — boucle de jeu (un tick = une semaine)
   ============================================================================= */
const Game = {
  log(text, type = 'info') {
    if (!S) return;
    S.journal.unshift({ w: S.week, t: text, type });
    if (S.journal.length > 400) S.journal.length = 400;
  },

  newGame(difficulty, name) {
    const legacy = Legacy.get();
    RNG.seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    S = createState(difficulty, name, legacy);
    Market.warmup(30);
    Portfolio.applyPreset(difficulty === 'casual' ? 'equilibre' : 'equilibre');
    Team.refreshCandidates(true);
    S.risk = Risk.targetScore();
    this.recordHistory();
    this.log(`Création de « ${S.fundName} » dans un garage avec ${fmtMoney(S.cash)} de capital (mode ${CONFIG.MODES[difficulty].label}).`, 'tier');
    if (S.legacyBonus > 0) this.log(`Bonus legacy : +${fmtPct(S.legacyBonus, 0)} de capital de départ.`, 'good');
    this.log('Conseil : investissez une partie de votre cash dans le fonds (onglet Portefeuille) pour rassurer vos premiers clients.', 'info');
  },

  /* Le tick hebdomadaire, dans l'ordre imposé par le game design */
  tick() {
    if (!S || S.status !== 'playing') return false;
    if (S.events.pending) { UI.showEvent(); return false; }
    S.week++;
    const cash0 = S.cash, aum0 = Portfolio.aum();
    S.last.txFees = 0;
    Market.step();                 // 1. prix (régime + volatilité + corrélations)
    Portfolio.applyReturns();      // 2. revenus du portefeuille
    Portfolio.weeklyTrading();     // 3. frais de transaction (stop-loss, rééquilibrage)
    Team.paySalaries();            // 4. salaires
    Investors.collectFees();       // 5. frais de gestion + performance
    Investors.step();              // 6. flux des investisseurs
    Risk.step();                   // 7. risque, conformité, réputation, recherche
    Team.refreshCandidates(false);
    Events.maybeTrigger();         // 8. événements
    if (S.status === 'playing') Progression.checkTier();   // 9. palier
    if (S.status === 'playing') Progression.checkEnd();    // 10. victoire / défaite
    // 11. journal / historique
    S.last.cash = S.cash - cash0;
    S.last.aum = Portfolio.aum() - aum0;
    this.recordHistory();
    if (S.week % 13 === 0) this.log(`Bilan trimestriel : AUM ${fmtMoney(Portfolio.aum())}, NAV ${fmtNum(S.fund.navps, 2)}, perf. 26 sem. ${fmtPct(Investors.perfAnnual(26), 1, true)}/an.`, 'info');
    if (S.week % CONFIG.AUTOSAVE_EVERY === 0) Save.save(true);
    S.seed = RNG.seed;
    UI.renderAll();
    return true;
  },

  recordHistory() {
    const h = S.history;
    h.week.push(S.week); h.navps.push(S.fund.navps); h.aum.push(Portfolio.aum());
    if (h.week.length > 700) { // sous-échantillonnage de la moitié la plus ancienne
      const half = 350;
      for (const key of ['week', 'navps', 'aum']) h[key] = h[key].slice(0, half).filter((_, i) => i % 2 === 0).concat(h[key].slice(half));
    }
    S.fund.navHist.push(S.fund.navps);
    if (S.fund.navHist.length > 120) S.fund.navHist.shift();
  },

  setDifficulty(d) {
    if (!S || S.difficulty === d) return;
    S.difficulty = d;
    if (d === 'casual') {
      S.fund.leverage = 1;
      for (const k of RISKY) if (S.fund.target[k] < 0) S.fund.target[k] = 0;
      S.fund.autoRebalance = true;
      Portfolio.normalizeTarget();
      Portfolio.rebalance();
    }
    this.log(`Difficulté changée : ${CONFIG.MODES[d].label}.`, 'warn');
    UI.renderAll();
  },

  /* Choix de fin débloqués par la victoire */
  endChoice(c) {
    if (c === 'ipo') {
      const gain = Portfolio.aum() * 0.03;
      S.cash += gain; addRep(5);
      this.log(`📈 Introduction en bourse de la société de gestion : +${fmtMoney(gain)} de trésorerie. Le jeu continue en mode endless.`, 'tier');
    } else if (c === 'philanthropy') {
      const gift = Math.max(0, S.cash * 0.5);
      S.cash -= gift; S.reputation = 100; S.repBonus += 10;
      this.log(`💝 Philanthropie : ${fmtMoney(gift)} donnés à des fondations. Réputation maximale.`, 'tier');
    } else if (c === 'retire') {
      S.status = 'retired';
      Legacy.recordRun();
      this.log('🏖️ Vous prenez votre retraite au sommet. Une légende de la finance.', 'tier');
      Save.save(true);
      UI.closeModal();
      UI.showEnd('Retraite dorée', 'Vous quittez la scène en vainqueur. Votre héritage profitera à votre prochaine partie.', true);
      return;
    }
    S.endChoice = c;
    UI.closeModal();
    UI.renderAll();
  }
};

/* =============================================================================
   12. SAVE — localStorage (sauvegarde, chargement, reset) + legacy
   ============================================================================= */
const Save = {
  storage() { try { return window.localStorage; } catch (e) { return null; } },
  exists() { const st = this.storage(); try { return !!(st && st.getItem(CONFIG.SAVE_KEY)); } catch (e) { return false; } },
  save(silent) {
    if (!S || !UI.enabled) return false;
    const st = this.storage();
    if (!st) { if (!silent) UI.toast('Sauvegarde indisponible (localStorage bloqué).', 'bad'); return false; }
    try {
      S.seed = RNG.seed;
      st.setItem(CONFIG.SAVE_KEY, JSON.stringify(S));
      if (!silent) UI.toast('💾 Partie sauvegardée.', 'good');
      return true;
    } catch (e) {
      if (!silent) UI.toast('Erreur de sauvegarde : ' + e.message, 'bad');
      return false;
    }
  },
  load() {
    const st = this.storage();
    if (!st) return false;
    try {
      const raw = st.getItem(CONFIG.SAVE_KEY);
      if (!raw) { UI.toast('Aucune sauvegarde trouvée.', 'warn'); return false; }
      const data = JSON.parse(raw);
      // Migration douce : on complète avec un état neuf pour les champs manquants
      const fresh = createState(data.difficulty || 'casual', data.fundName, Legacy.get());
      S = deepMerge(fresh, data);
      RNG.seed = (S.seed >>> 0) || RNG.seed;
      Team.invalidate();
      UI.toast('📂 Partie chargée.', 'good');
      return true;
    } catch (e) {
      UI.toast('Sauvegarde illisible : ' + e.message, 'bad');
      return false;
    }
  },
  clear() { const st = this.storage(); try { if (st) st.removeItem(CONFIG.SAVE_KEY); } catch (e) { /* ignore */ } }
};
function deepMerge(base, over) {
  if (Array.isArray(over)) return over;
  if (over && typeof over === 'object') {
    const out = (base && typeof base === 'object' && !Array.isArray(base)) ? Object.assign({}, base) : {};
    for (const k of Object.keys(over)) out[k] = deepMerge(base ? base[k] : undefined, over[k]);
    return out;
  }
  return over === undefined ? base : over;
}

/* Legacy : bonus cumulatif de capital de départ (+10 % par partie, plafonné) */
const Legacy = {
  get() {
    try { return JSON.parse(Save.storage()?.getItem(CONFIG.LEGACY_KEY) || '{}') || {}; } catch (e) { return {}; }
  },
  recordRun() {
    if (!UI.enabled) return;
    const l = this.get();
    l.runs = (l.runs || 0) + 1;
    l.bestAUM = Math.max(l.bestAUM || 0, S ? S.stats.peakAUM : 0);
    try { Save.storage()?.setItem(CONFIG.LEGACY_KEY, JSON.stringify(l)); } catch (e) { /* ignore */ }
  },
  bonus() { return Math.min(CONFIG.LEGACY_CAP, (this.get().runs || 0) * CONFIG.LEGACY_STEP); }
};

  onClick(e) {
    const el = e.target.closest('[data-tab],[data-act],[data-modal]');
    if (!el) return;
    if (el.dataset.tab) { this.tab = el.dataset.tab; this.renderTab(); this.renderTabs(); return; }
    if (el.dataset.modal) { const h = this.modalHandlers[el.dataset.modal]; if (h) h(el); return; }
    if (!S) return;
    const a = el.dataset.act, id = el.dataset.id ? Number(el.dataset.id) : null, k = el.dataset.k;
    switch (a) {
      case 'hire': Team.hire(id); break;
      case 'fire': {
        const emp = S.team.employees.find(x => x.id === id);
        if (emp) this.confirm(`Licencier ${emp.name} ?`, `Indemnité : ${fmtMoney(Team.salary(emp) * CONFIG.SEVERANCE_WEEKS)}.`, () => Team.fire(id));
        break;
      }
      case 'train': Team.train(id); break;
      case 'promote': Team.promote(id); break;
      case 'headhunt': Team.headhunt(); break;
      case 'upgrade': Progression.buyUpgrade(el.dataset.u); break;
      case 'preset': Portfolio.applyPreset(k); if (Portfolio.isCasual()) Portfolio.rebalance(); this.renderAll(); break;
      case 'w-minus': case 'w-plus': {
        const step = a === 'w-plus' ? 5 : -5;
        S.fund.target[k] = clamp(S.fund.target[k] + step, Portfolio.minWeight(k), S.fund.leverage * 100);
        this.clampTargetRoom(k);
        S.fund.preset = null;
        this.renderTab(); this.renderHeaderStats();
        break;
      }
      case 'rebalance': {
        const fee = Portfolio.rebalance(true);
        Game.log(`Rééquilibrage manuel exécuté (frais ${fmtMoney(fee)}).`, 'info');
        this.toast(`Allocation appliquée (frais ${fmtMoney(fee)})`, 'good');
        this.renderAll(); break;
      }
      case 'auto-rebal': S.fund.autoRebalance = !S.fund.autoRebalance; this.renderTab(); break;
      case 'founder-in': Investors.founderInvest(S.cash * Number(el.dataset.f)); break;
      case 'founder-out': {
        const f = Investors.founder();
        if (f) Investors.founderWithdraw(Investors.capital(f) * Number(el.dataset.f));
        break;
      }
      case 'leverage': S.fund.leverage = Number(el.dataset.v); Portfolio.normalizeTarget(); this.renderTab(); break;
      case 'show-event': this.showEvent(); break;
    }
  },
  onInput(e) {
    const el = e.target;
    if (!S || !el.classList.contains('alloc-slider')) return;
    const k = el.dataset.k;
    S.fund.target[k] = Number(el.value);
    this.clampTargetRoom(k);
    el.value = S.fund.target[k];
    S.fund.preset = null;
    this.updateAllocPreview();

  onChange(e) {

    const f = S.fund;

    if (Math.abs(f.target[k]) > room) f.target[k] = Math.sign(f.target[k]) * Math.max(0, room);

  /* ---------- Graphique NAV (Chart.js, avec repli canvas) ---------- */
  onChartLoaded() {
    this.chartLoaded = true;
    if (this.chartFailed) { this.chartFailed = false; this.$('chartMsg').textContent = ''; const cv = this.$('navChart'); cv.style.width = ''; cv.style.height = ''; }
    this.updateChart();
  },
  onChartFailed() {
    this.chartFailed = true;
    this.$('chartMsg').textContent = 'Chart.js indisponible (hors ligne ?) : graphique simplifié affiché.';
    this.updateChart();
  },
  updateChart() {
    if (!this.enabled || !S) return;
    const h = S.history;
    const labels = h.week.map(w => 'J' + w * 7);
    if (this.chartLoaded && typeof window.Chart === 'function') {
      try {
        if (!this.chart) {
          const ctx = this.$('navChart').getContext('2d');
          this.chart = new window.Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [
              { label: 'NAV / part', data: h.navps.slice(), borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#d9a066', borderWidth: 2, pointRadius: 0, tension: 0.15, yAxisID: 'y' },
              { label: 'AUM', data: h.aum.map(v => v > 0 ? v : null), borderColor: '#60a5fa', borderWidth: 1.5, borderDash: [4, 3], pointRadius: 0, tension: 0.15, yAxisID: 'y1', spanGaps: true }
            ] },
            options: {
              responsive: true, maintainAspectRatio: false, animation: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { labels: { color: '#8b95a8', boxWidth: 12 } },
                tooltip: { callbacks: { label: c => c.dataset.yAxisID === 'y1' ? 'AUM : ' + fmtMoney(c.parsed.y) : 'NAV : ' + fmtNum(c.parsed.y, 2) } }
              },
              scales: {
                x: { ticks: { color: '#8b95a8', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.04)' } },
                y: { position: 'left', ticks: { color: '#8b95a8' }, grid: { color: 'rgba(255,255,255,.05)' } },
                y1: { position: 'right', type: 'logarithmic', ticks: { color: '#60a5fa', callback: v => { const l = Math.log10(v); return Math.abs(l - Math.round(l)) < 1e-6 ? fmtShort(v) : ''; } }, grid: { drawOnChartArea: false } }
              }
            }
          });
        } else {
          this.chart.data.labels = labels;
          this.chart.data.datasets[0].data = h.navps.slice();
          this.chart.data.datasets[0].borderColor = TIERS[S.tier - 1].accent;
          this.chart.data.datasets[1].data = h.aum.map(v => v > 0 ? v : null);
          this.chart.update('none');
        }
        return;
      } catch (err) {
        this.chartLoaded = false; this.chartFailed = true;
        this.$('chartMsg').textContent = 'Graphique Chart.js désactivé suite à une erreur : repli simplifié.';
      }
    }
    if (this.chartFailed || !window.Chart) this.drawFallback();
  },
  /* Repli sans Chart.js : simple courbe sur canvas */
  drawFallback() {
    const cv = this.$('navChart');
    const wrap = cv.parentElement;
    const W = wrap.clientWidth || 600, H = wrap.clientHeight || 200;
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const d = S.history.navps;
    if (d.length < 2) return;
    const min = Math.min(...d), max = Math.max(...d), rg = max - min || 1;
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    for (let i = 0; i <= 4; i++) { const y = 10 + i * (H - 20) / 4; ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.fillStyle = '#8b95a8'; ctx.font = '11px sans-serif';
    ctx.fillText(fmtNum(max, 1), 2, 14); ctx.fillText(fmtNum(min, 1), 2, H - 6);
    ctx.strokeStyle = TIERS[S.tier - 1].accent; ctx.lineWidth = 2; ctx.beginPath();
    d.forEach((v, i) => { const x = 40 + i / (d.length - 1) * (W - 44); const y = 10 + (1 - (v - min) / rg) * (H - 20); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  },

  /* ---------- Décor du palier ---------- */
  applyDecor() {
    if (!this.enabled || !S) return;
    const T = TIERS[S.tier - 1];
    const r = document.documentElement.style;
    r.setProperty('--bg', T.bg[0]); r.setProperty('--bg2', T.bg[1]); r.setProperty('--accent', T.accent);
    this.$('decorIcon').textContent = T.icon;
  },
  tierTransition(T, n) {
    if (!this.enabled) return;
    const fade = this.$('fade');
    this.$('fadeIcon').textContent = T.icon;
    this.$('fadeTitle').textContent = `Palier ${n} : ${T.name}`;
    this.$('fadeSub').textContent = `${T.local} · ${T.bonusTxt} · Débloqué : ${T.unlocks}`;
    fade.classList.add('show');
    setTimeout(() => { this.applyDecor(); this.renderAll(); }, 900);
    setTimeout(() => fade.classList.remove('show'), 2300);
    this.toast(`🚚 Déménagement : ${T.icon} ${T.name} !`, 'tier');
  },

  /* ---------- Toasts ---------- */
  toast(msg, type = 'info') {
    if (!this.enabled) return;
    const box = this.$('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    box.appendChild(el);
    while (box.children.length > 5) box.removeChild(box.firstChild);
    setTimeout(() => el.remove(), 4500);
  },

  /* ---------- Modales ---------- */
  showModal(html, handlers = {}, closable = true) {
    if (!this.enabled) return;
    this.stopAuto();
    this.modalHandlers = Object.assign({}, handlers, closable ? { close: () => this.closeModal() } : {});
    this.$('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
    this.modalOpen = true;
  },
  closeModal() { if (!this.enabled) return; this.$('modalRoot').innerHTML = ''; this.modalOpen = false; this.modalHandlers = {}; },
  confirm(title, text, onYes) {
    this.showModal(`<h2>${title}</h2><p class="muted">${text}</p><div class="row mt"><button class="btn primary" data-modal="yes">Confirmer</button><button class="btn" data-modal="close">Annuler</button></div>`,
      { yes: () => { this.closeModal(); onYes(); } });
  },

  showEvent() {
    if (!this.enabled || !S || !S.events.pending) return;
    const p = S.events.pending, e = Events.get(p.id);
    const opts = e.options.map((o, i) => `<button class="btn choice" data-modal="opt${i}"><b>${o.label}</b><span class="hint">${o.hint(p.params)}</span></button>`).join('');
    const handlers = {};
    e.options.forEach((o, i) => { handlers['opt' + i] = () => Events.resolve(i); });
    this.showModal(`<div class="icon">${e.icon}</div><h2>${e.title}</h2><p>${e.text(p.params)}</p>
      <div class="small muted">Régime : ${CONFIG.REGIMES[S.market.perceived].icon} ${CONFIG.REGIMES[S.market.perceived].name} (estimé) · Cash ${fmtMoney(S.cash)} · AUM ${fmtMoney(Portfolio.aum())}</div>${opts}`, handlers, false);
  },

  showVictory() {
    this.showModal(`<div class="icon">🏆</div><h2>Victoire !</h2>
      <p>« ${esc(S.fundName)} » gère <b>${fmtMoney(Portfolio.aum())}</b> avec une réputation de <b>${Math.round(S.reputation)}/100</b> après ${S.week} semaines. Vous êtes une légende de la gestion alternative.</p>
      <p class="muted">Choix de fin débloqués :</p>
      <button class="btn choice" data-modal="ipo"><b>📈 Introduction en bourse (IPO)</b><span class="hint">+3 % de l'AUM en trésorerie, réputation +5, la partie continue (endless).</span></button>
      <button class="btn choice" data-modal="phil"><b>💝 Philanthropie</b><span class="hint">Donnez 50 % du cash : réputation 100 et bonus permanent, la partie continue.</span></button>
      <button class="btn choice" data-modal="retire"><b>🏖️ Retraite</b><span class="hint">Terminez la partie au sommet et gagnez un bonus legacy pour la suivante.</span></button>
      <button class="btn choice" data-modal="cont"><b>▶ Continuer sans choisir</b><span class="hint">Mode endless : visez les paliers 9 à 15.</span></button>`,
      { ipo: () => Game.endChoice('ipo'), phil: () => Game.endChoice('philanthropy'), retire: () => Game.endChoice('retire'), cont: () => { this.closeModal(); this.renderAll(); } }, false);
  },
  showEnd(title, why, good) {
    const nb = Legacy.bonus();
    this.showModal(`<div class="icon">${good ? '🏖️' : '💀'}</div><h2>${title}</h2><p>${why}</p>
      <div class="kv"><span class="muted">Semaines jouées</span><b>${S.week}</b></div>
      <div class="kv"><span class="muted">AUM maximal atteint</span><b>${fmtMoney(S.stats.peakAUM)}</b></div>
      <div class="kv"><span class="muted">Palier atteint</span><b>${S.tier} — ${TIERS[S.tier - 1].name}</b></div>
      <p class="mt">Bonus legacy pour la prochaine partie : <b class="green">+${fmtPct(nb, 0)} de capital de départ</b> (cumulable, plafonné à +${fmtPct(CONFIG.LEGACY_CAP, 0)}).</p>
      <div class="row mt"><button class="btn primary" data-modal="restart">Recommencer avec le bonus legacy</button><button class="btn" data-modal="close">Voir le journal</button></div>`,
      { restart: () => { this.closeModal(); Save.clear(); this.showStart(false); } });
    this.renderAll();
  },

  showStart(hasSave) {
    const l = Legacy.get();
    const lb = Legacy.bonus();
    this.showModal(`<div class="icon">📊</div><h2>Hedge Fund Tycoon</h2>
      <p>Partez d'un garage avec ${fmtMoney(CONFIG.START_CASH * (1 + lb))} et bâtissez un empire de la gestion alternative. Objectif : <b>1 Md$ d'AUM</b> et une <b>réputation ≥ 90</b>.</p>
      ${l.runs ? `<p class="small green">Legacy : ${l.runs} partie(s) précédente(s), meilleur AUM ${fmtMoney(l.bestAUM || 0)} → +${fmtPct(lb, 0)} de capital.</p>` : ''}
      <div class="row"><span class="small muted">Nom du fonds</span><input type="text" id="fundNameIn" maxlength="32" value="Garage Capital" style="flex:1"></div>
      <div class="diffopt">
        <label><input type="radio" name="diff" value="casual" checked><b>Casual</b><div class="small muted">Rééquilibrage auto, préréglages, pas de levier ni de short, événements plus rares et plus doux.</div></label>
        <label><input type="radio" name="diff" value="intermediate"><b>Intermédiaire</b><div class="small muted">Levier, short, stop-loss, devises… événements plus durs, conformité stricte, clients exigeants.</div></label>
      </div>
      <div class="row mt">${hasSave ? '<button class="btn primary" data-modal="cont">▶ Continuer la partie sauvegardée</button>' : ''}<button class="btn ${hasSave ? '' : 'primary'}" data-modal="new">✨ Nouvelle partie</button></div>
      <p class="small muted mt">Astuce : la barre d'espace fait passer une semaine. Un tick = une semaine.</p>`,
      {
        cont: () => { if (Save.load()) { this.closeModal(); this.afterLoad(); } },
        new: () => {
          const d = document.querySelector('input[name=diff]:checked')?.value || 'casual';
          const name = (this.$('fundNameIn')?.value || '').trim() || 'Garage Capital';
          const go = () => { this.closeModal(); Game.newGame(d, name); this.afterLoad(); Save.save(true); };
          if (hasSave) this.confirm('Nouvelle partie ?', 'La sauvegarde existante sera écrasée.', go); else go();
        }
      }, false);
  },
  afterLoad() {
    this.stopAuto();
    if (this.chart) { try { this.chart.destroy(); } catch (e) { /* ignore */ } this.chart = null; }
    this.applyDecor();
    this.renderAll();
    if (S.events.pending) this.showEvent();
    else if (S.status === 'lost' || S.status === 'retired') this.showEnd(S.status === 'retired' ? 'Retraite dorée' : 'Partie terminée', 'Cette partie est terminée.', S.status === 'retired');
  },

  showSettings() {
    if (!S) return;
    const speeds = CONFIG.AUTO_SPEEDS;
    this.showModal(`<h2>⚙️ Paramètres</h2>
      <h4 class="mt">Difficulté</h4>
      <div class="diffopt">
        <label><input type="radio" name="sdiff" value="casual" ${S.difficulty === 'casual' ? 'checked' : ''}><b>Casual</b></label>
        <label><input type="radio" name="sdiff" value="intermediate" ${S.difficulty === 'intermediate' ? 'checked' : ''}><b>Intermédiaire</b></label>
      </div>
      <div class="small amber">⚠️ Changer de difficulté en cours de partie modifie la volatilité, les événements et la conformité. Passer en casual ferme levier et positions courtes.</div>
      <h4 class="mt">Options</h4>
      <label class="row"><input type="checkbox" id="hardChk" ${S.hardMode ? 'checked' : ''}> Hard mode : rétrogradation de palier si l'AUM tombe sous 50 % du seuil</label>
      <div class="row mt"><span>Vitesse de l'avance auto</span><select id="speedSel">${Object.keys(speeds).map(k => `<option value="${k}" ${(this.autoSpeed || 'normal') === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
      <h4 class="mt">Partie</h4>
      <div class="row"><button class="btn" data-modal="save">💾 Sauvegarder</button><button class="btn" data-modal="load">📂 Charger</button><button class="btn danger" data-modal="reset">🗑️ Recommencer (reset)</button></div>
      <div class="row mt"><button class="btn primary" data-modal="apply">Appliquer</button><button class="btn" data-modal="close">Fermer</button></div>`,
      {
        apply: () => {
          const d = document.querySelector('input[name=sdiff]:checked')?.value;
          S.hardMode = !!this.$('hardChk')?.checked;
          this.autoSpeed = this.$('speedSel')?.value || 'normal';
          this.closeModal();
          if (d && d !== S.difficulty) this.confirm('Changer la difficulté ?', `Passer en ${CONFIG.MODES[d].label} en cours de partie. Continuer ?`, () => Game.setDifficulty(d));
          this.renderAll();
        },
        save: () => Save.save(false),
        load: () => { this.closeModal(); if (Save.load()) this.afterLoad(); },
        reset: () => this.confirm('Recommencer ?', 'La partie en cours et sa sauvegarde seront effacées (le bonus legacy est conservé).', () => { Save.clear(); this.showStart(false); })
      });
  },

  /* ---------- Avance automatique (désactivée par défaut) ---------- */
  toggleAuto() { if (this.autoTimer) this.stopAuto(); else this.startAuto(); this.renderHeaderStats(); },
  startAuto() {
    if (!S || S.status !== 'playing') return;
    const ms = CONFIG.AUTO_SPEEDS[this.autoSpeed || 'normal'];
    this.autoTimer = setInterval(() => {
      if (this.modalOpen || !S || S.status !== 'playing' || S.events.pending) { this.stopAuto(); this.renderHeaderStats(); return; }
      Game.tick();
    }, ms);
  },
  stopAuto() { if (this.autoTimer) { clearInterval(this.autoTimer); this.autoTimer = null; } }
};

/* =============================================================================
   14. MAIN — démarrage
   ============================================================================= */
function boot() {
  UI.init();
  UI.showStart(Save.exists());
  // Si Chart.js est déjà chargé (cache) ou n'arrive pas en 6 s, on bascule proprement
  if (window.Chart) UI.chartLoaded = true;
  setTimeout(() => { if (!window.Chart && !UI.chartFailed) UI.onChartFailed(); }, 6000);
  window.addEventListener('resize', () => { if (S && !UI.chartLoaded) UI.drawFallback(); });
}
document.addEventListener('DOMContentLoaded', boot);

/* Accès console / tests automatisés */
window.HFT = { get S() { return S; }, Game, Market, Portfolio, Team, Investors, Risk, Events, Progression, Save, UI, CONFIG, RNG, TIERS, UPGRADES, ROLES, INVESTOR_TYPES, EVENTS };
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" async onload="UI.onChartLoaded()" onerror="UI.onChartFailed()"></script>
</body>
</html>
