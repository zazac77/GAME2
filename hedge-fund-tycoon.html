  /* Probabilités affichées : bruitées selon la qualité d'information */
  shown(ev) { const q = Team.infoQuality(); const raw = ev.sc.map((sc, i) => Math.max(0.03, sc.p + (ev.noise[i] || 0) * 0.25 * (1 - q))); const t = raw.reduce((a, b) => a + b, 0); return raw.map(v => v / t); },
  schedule() {
    const T = pick(CAL_TYPES.filter(t => S.tier >= t.tier));
    const ev = { id: S.week * 10 + randInt(0, 9), type: T.id, icon: T.icon, name: T.name, week: S.week + randInt(4, 8), sc: T.sc, noise: T.sc.map(() => gauss()) };
    S.calendar.push(ev);
    S.calendar.sort((a, b) => a.week - b.week);
  },
  step() {
    if (S.week >= S.nextCalWeek) { this.schedule(); S.nextCalWeek = S.week + randInt(3, 6); }
    for (const ev of S.calendar.slice()) {
      if (ev.week === S.week + 1) UI.toast(`📅 La semaine prochaine : ${ev.icon} ${ev.name}`, 'info');
      if (ev.week > S.week) continue;
      const r = rng(); let acc = 0, out = ev.sc[ev.sc.length - 1];
      for (const sc of ev.sc) { acc += sc.p; if (r <= acc) { out = sc; break; } }
      const k = CONFIG.MODES[S.difficulty].eventSeverity;
      const x = {}; for (const f in out.x) x[f] = out.x[f] * (out.x[f] < 0 ? k : 1);
      if (Object.keys(x).length) Market.factorShock(x, false);
      S.calendar = S.calendar.filter(e => e !== ev);
      Game.log(`📅 ${ev.icon} ${ev.name} : ${out.label}.`, 'info');
      UI.toast(`📅 ${ev.name} : ${out.label}`, out.x.M < 0 || out.x.R > 0 ? 'warn' : 'good');
    }
  }
};

/* --- Couvertures : options de vente (protection) sur un actif --- */
const Hedges = {
  available() { return S.prop.launched && S.tier >= 2; },
  months: 13,
  /* Prime ≈ 0,25 × volatilité prévue × √durée (plus chère quand le marché est nerveux) */
  STRIKES: [0, 0.05, 0.10, 0.20],   // seuil de déclenchement : 0 % (à la monnaie), −5 %, −10 %, −20 %
  /* Prime (en % du montant couvert) : put de Black-Scholes (taux nul) sur la volatilité prévue,
     majorée de 10 % (marge du vendeur). Plus le prix d'exercice est proche, plus c'est cher. */
  premiumRate(k, otm = 0.10) {
    const sig = Math.max(0.01, Market.expectedVol(k, this.months)), T = this.months / 52, K = 1 - otm;
    const d1 = (Math.log(1 / K) + sig * sig * T / 2) / (sig * Math.sqrt(T)), d2 = d1 - sig * Math.sqrt(T);
    return 1.1 * (K * normCdf(-d2) - normCdf(-d1));
  },
  value() { if (!S || !S.hedges) return 0; let v = 0; for (const h of S.hedges) v += this.payoff(h); return v; },
  payoff(h) { const pr = S.market.prices[h.k]; return h.notional * Math.max(0, h.strike - pr) / h.spot; },
  buy(k, frac, otm = 0.10) {
    const A = Portfolio.aum(); const notional = A * frac; const prem = notional * this.premiumRate(k, otm);
    if (prem > Portfolio.liquid() * 0.5) return UI.toast('Liquidités du fonds insuffisantes.', 'bad');
    Portfolio.withdraw(prem); Portfolio.syncNavps();
    const spot = S.market.prices[k];
    S.hedges.push({ id: S.nextHedgeId++, k, notional, spot, strike: spot * (1 - otm), otm, expiry: S.week + this.months, premium: prem });
    Game.log(`🛡️ Protection achetée sur ${CONFIG.ASSETS[k].name} : ${fmtMoney(notional)} couverts sous ${otm ? '−' + fmtPct(otm, 0) : 'le prix actuel'}, prime ${fmtMoney(prem)}.`, 'info');
    UI.renderAll();
  },
  close(id, expired) {
    const h = S.hedges.find(x => x.id === id); if (!h) return;
    const v = this.payoff(h);
    S.hedges = S.hedges.filter(x => x !== h);
    if (v > 0) Portfolio.deposit(v);
    Portfolio.syncNavps();
    Game.log(`🛡️ Protection ${CONFIG.ASSETS[h.k].name} ${expired ? 'arrivée à échéance' : 'revendue'} : ${v > 0 ? 'gain ' + fmtMoney(v) : 'expire sans valeur'}.`, v > 0 ? 'good' : 'info');
    if (!UI.batch) UI.renderAll();
  },
  step() { for (const h of S.hedges.slice()) if (S.week >= h.expiry) this.close(h.id, true); },
  /* La protection réduit le score de risque (jusqu'à −15 points) */
  riskRelief() { const A = Portfolio.aum(); if (!S.hedges.length || A <= 0) return 0; return Math.min(15, S.hedges.reduce((t, h) => t + h.notional, 0) / A * 30); }
};

const RIVAL_DEFS = [
  { name: 'Blackstone Ridge', icon: '🗻', style: 'Actions monde', w: { equities: 0.9 } },
  { name: 'Aurora Macro', icon: '🌐', style: 'Global macro', w: { equities: 0.35, bonds: 0.35, commodities: 0.15, fx: 0.15 } },
  { name: 'Quantica', icon: '🧮', style: 'Quantitatif', w: { equities: 0.3, bonds: 0.4, fx: 0.1 }, alpha: 0.02 },
  { name: 'Moonshot Capital', icon: '🌙', style: 'Croissance & tech', w: { tech: 0.7, crypto: 0.15 } },
  { name: 'Prudentia', icon: '🛡️', style: 'Défensif', w: { bonds: 0.5, health: 0.15, staples: 0.15 } },
  { name: 'Iron Value', icon: '⚙️', style: 'Value', w: { finance: 0.3, energy: 0.3, industrials: 0.3 } }
];
const Rivals = {
  init() { S.rivals = RIVAL_DEFS.map(d => ({ name: d.name, nav: 100, hist: [100], idio: 0 })); },
  step() {
    if (!S.rivals.length) this.init();
    const r = S.market.lastReturns;
    S.rivals.forEach((x, i) => {
      const d = RIVAL_DEFS[i];
      let ret = (d.alpha || 0.01) / 52 - CONFIG.MGMT_FEE / 52 + gauss() * 0.008;
      for (const k in d.w) ret += d.w[k] * (r[k] || 0);
      x.nav *= 1 + ret; x.hist.push(x.nav); if (x.hist.length > 53) x.hist.shift();
    });
  },
  perf(h) { const n = Math.min(52, h.length - 1); return n > 0 ? h[h.length - 1] / h[h.length - 1 - n] - 1 : 0; },
  /* Classement sur 52 semaines (le joueur compte à partir du lancement) */
  table() {
    const rows = S.rivals.map((x, i) => ({ name: RIVAL_DEFS[i].name, icon: RIVAL_DEFS[i].icon, style: RIVAL_DEFS[i].style, perf: this.perf(x.hist), me: false }));
    if (S.prop.launched) rows.push({ name: S.fundName, icon: '⭐', style: S.strategy ? STRATEGIES[S.strategy].name : '—', perf: this.perf(S.fund.navHist.slice(-53)), me: true });
    return rows.sort((a, b) => b.perf - a.perf);
  },
  rank() { const t = this.table(); const i = t.findIndex(r => r.me); return i < 0 ? null : i + 1; },
  /* Top 3 : +15 % d'attractivité ; dernier : −10 % (après 26 semaines d'historique) */
  attractMult() { if (!S.prop.launched || S.fund.navHist.length < 27) return 1; const r = this.rank(); return r === null ? 1 : r <= 3 ? 1.15 : r === S.rivals.length + 1 ? 0.9 : 1; }
};

  /* Marge d'intérêt ~8 %/an, pertes sur crédits en baisse et surtout en crise */
  step() {
    if (!S.bank.capital) { S.bank.lastPnl = 0; return; }
    const rate = { bull: 0.09, range: 0.08, bear: 0.03, crisis: -0.20, bubble: 0.10 }[S.market.regime] - (S.compliance < 70 ? 0.03 : 0);

    S.cash += pnl; S.bank.lastPnl = pnl;
  }
};

/* =============================================================================
   10. PROGRESSION — paliers, améliorations, victoire / défaite
   ============================================================================= */
const Progression = {
  upg(id) { return (S && S.upgrades[id]) || 0; },

  /* Somme des bonus de paliers atteints (+50 % au palier 12, x2 au palier 15) */
  tierBonus(key) {
    if (!S) return 0;
    let b = 0;
    for (let i = 0; i < S.tier; i++) b += TIERS[i].bonus[key] || 0;
    if (S.tier >= 12) b *= 1.5;
    if (S.tier >= 15) b *= 2;
    return b;
  },
  tierForAUM(a) {
    let t = 1;
    for (let i = 0; i < TIERS.length; i++) if (a >= TIERS[i].min) t = i + 1;
    return t;
  },

  /* Étape 9 du tick : déménagement automatique (irréversible sauf hard mode) */
  checkTier() {
    const A = Game.totalAUM();
    const t = this.tierForAUM(A);
    if (t > S.tier) {
      const from = S.tier;
      for (let n = from + 1; n <= t; n++) {
        const T = TIERS[n - 1];
        Game.log(`🚚 Déménagement : palier ${n} — ${T.name} (${T.local}). Capacité ${T.cap === Infinity ? '∞' : T.cap}. Bonus : ${T.bonusTxt}. Déblocages : ${T.unlocks}.`, 'tier');
      }
      S.tier = t;
      Team.invalidate();
      Portfolio.normalizeTarget();
      Team.refreshCandidates(true);
      UI.tierTransition(TIERS[t - 1], t);
      Save.save(true);
    } else if (S.hardMode && S.tier > 1 && A < TIERS[S.tier - 1].min * 0.5) {
      S.tier--;
      Team.invalidate();
      Portfolio.normalizeTarget();
      Game.log(`⬇️ Hard mode : le fonds est rétrogradé au palier ${S.tier} (${TIERS[S.tier - 1].name}).`, 'bad');
      UI.toast(`⬇️ Rétrogradation : ${TIERS[S.tier - 1].name}`, 'bad');
      UI.applyDecor();
    }
  },

  /* Améliorations */
  upgradeCost(u) { const l = this.upg(u.id); return l < u.cost.length ? { cash: u.cost[l], rp: u.rp[l] } : null; },
  buyUpgrade(id) {
    const u = UPGRADES.find(x => x.id === id);
    if (!u) return;
    const c = this.upgradeCost(u);
    if (!c) return;
    if (S.tier < u.tier) return UI.toast(`Palier ${u.tier} requis.`, 'warn');
    if (S.cash < c.cash || S.rp < c.rp) return UI.toast('Ressources insuffisantes.', 'bad');
    S.cash -= c.cash; S.rp -= c.rp;
    S.upgrades[id] = this.upg(id) + 1;
    if (id === 'pr') addRep(5);
    Team.invalidate();
    Game.log(`Amélioration : ${u.name} niveau ${S.upgrades[id]}.`, 'good');
    UI.toast(`${u.icon} ${u.name} niv. ${S.upgrades[id]}`, 'good');
    UI.renderAll();
  },

  /* Étape 10 du tick : victoire / défaite */
  checkEnd() {
    const A = Game.totalAUM();
    const c = S.counters, mode = CONFIG.MODES[S.difficulty];
    S.stats.peakAUM = Math.max(S.stats.peakAUM, A);
    if (Portfolio.aum() >= CONFIG.COLLAPSE_AFTER) S.investors.everAbove = true;

    if (!S.won && A >= CONFIG.WIN_AUM && S.reputation >= CONFIG.WIN_REP) {
      S.won = true;
      Game.log('🏆 VICTOIRE : 10 Md$ sous gestion et une réputation d’exception !', 'tier');
      if (S.events.pending) S.events.victoryQueued = true; // affichée après la décision en cours
      else UI.showVictory();
      return;
    }
    // Faillite : cash < 0 ET risque > 90 de façon durable
    if (S.cash < 0 && S.risk > CONFIG.RISK_MARGIN) c.bankruptWeeks++; else c.bankruptWeeks = 0;
    if (c.bankruptWeeks >= CONFIG.BANKRUPT_WEEKS) return this.lose('Faillite', 'Trésorerie négative et risque extrême pendant plusieurs semaines : vos prime brokers coupent les lignes.');
    // Licence : conformité < 20 prolongée
    if (S.compliance < 20) {
      c.lowComplianceWeeks++;
      if (c.lowComplianceWeeks === 1) UI.toast('🚨 Conformité critique : la licence est menacée !', 'bad');
    } else c.lowComplianceWeeks = 0;
    if (c.lowComplianceWeeks >= mode.licenseWeeks) return this.lose('Licence révoquée', 'Le régulateur suspend votre licence de gestion après des manquements répétés.');
    // Effondrement de l'AUM
    if (S.investors.everAbove && Portfolio.aum() < CONFIG.COLLAPSE_AUM) return this.lose('Effondrement de l’AUM', 'Vos clients sont partis : le fonds ne gère plus que des miettes.');
  },
  lose(title, why) {
    S.status = 'lost';
    Game.log(`💀 FIN DE PARTIE — ${title}. ${why}`, 'bad');
    Legacy.recordRun();
    Save.save(true);
    UI.showEnd(title, why);
  }
};

/* =============================================================================
   11. GAME — boucle de jeu (un tick = une semaine)
   ============================================================================= */
const Game = {
  log(text, type = 'info') {
    if (!S) return;
    S.journal.unshift({ w: S.week, t: text, type });
    if (S.journal.length > 400) S.journal.length = 400;
  },

  newGame(difficulty, name, tutorial = false) {
    const legacy = Legacy.get();
    RNG.seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    S = createState(difficulty, name, legacy);
    S.tutorial = { on: !!tutorial, step: 0, mark: 0, preset: false };
    S.prestige = legacy.prestige || 0;
    if (S.prestige) { S.reputation += 5 * S.prestige; this.log(`🌌 Prestige ${S.prestige} : réputation de départ +${5 * S.prestige}, clients +${10 * Math.min(3, S.prestige)} %.`, 'tier'); }
    Market.warmup(30);
    Portfolio.applyPreset(difficulty === 'casual' ? 'equilibre' : 'equilibre');
    Team.refreshCandidates(true);
    S.risk = Risk.targetScore();
    this.recordHistory();
    this.log(`Vous louez un desk chez une prop firm avec ${fmtMoney(S.cash)} en poche (mode ${CONFIG.MODES[difficulty].label}). Objectif : réussir le challenge, puis lancer « ${S.fundName} ».`, 'tier');
    if (S.legacyBonus > 0) this.log(`Bonus legacy : +${fmtPct(S.legacyBonus, 0)} de capital de départ.`, 'good');
    this.log('Première étape : achetez un challenge prop firm dans l’onglet Portefeuille.', 'info');
  },

  /* Le tick hebdomadaire, dans l'ordre imposé par le game design */
  tick() {
    if (!S || S.status !== 'playing') return false;
    if (S.events.pending) { UI.showEvent(); return false; }
    S.week++;
    const cash0 = S.cash, aum0 = Portfolio.aum();
    S.last.txFees = 0;
    Market.step();                 // 1. prix (régime + volatilité + corrélations)
    Calendar.step();               // 1b. rendez-vous macro du jour
    Portfolio.applyReturns();      // 2. revenus du portefeuille
    Hedges.step();                 // 2a. couvertures (échéances)
    Prop.step();                   // 2b. compte prop firm (challenge / financé)
    Portfolio.weeklyTrading();     // 3. frais de transaction (stop-loss, rééquilibrage)
    Team.paySalaries();            // 4. salaires
    Investors.collectFees();       // 5. frais de gestion + performance
    Opps.mature();                 // 5b. opportunités arrivées à échéance
    Investors.step();              // 6. flux des investisseurs
    Satellites.step();             // 6b. fonds satellites
    Rivals.step();                 // 6c. fonds concurrents
    Bank.step();                   // 6d. activité bancaire
    Risk.step();                   // 7. risque, conformité, réputation, recherche
    Team.refreshCandidates(false);
    Team.updateMorale();
    Team.advise();
    Opps.generate();
    Quarter.step();                // 7b. objectifs et rapport trimestriels
    Events.maybeTrigger();         // 8. événements
    if (S.status === 'playing') Progression.checkTier();   // 9. palier
    if (S.status === 'playing' && !S.events.pending) Milestones.check();
    if (S.status === 'playing') Progression.checkEnd();    // 10. victoire / défaite
    Achievements.check();
    // 11. journal / historique
    S.last.cash = S.cash - cash0;
    S.last.aum = Portfolio.aum() - aum0;
    this.recordHistory();
    if (S.week % CONFIG.AUTOSAVE_EVERY === 0) Save.save(true);
    S.seed = RNG.seed;
    if (!UI.batch) UI.renderAll();
    return true;
  },

  /* Mois suivant : 4 semaines d'un coup, arrêt si quelque chose demande votre attention */
  month() {
    if (!S || S.status !== 'playing') return;
    if (S.events.pending) return UI.showEvent();
    const t0 = S.tier, ph0 = S.prop.phase, mc0 = S.counters.marginCalls, q0 = S.quarterN, nav0 = S.fund.navps, aum0 = this.totalAUM(), cash0 = S.cash, w0 = S.week;
    UI.batch = true;
    let why = null;
    try {
      for (let i = 0; i < 4; i++) {
        if (!this.tick()) break;
        if (S.status !== 'playing') { why = 'fin de partie'; break; }
        if (S.events.pending) { why = 'événement'; break; }
        if (S.tier !== t0) { why = 'déménagement'; break; }
        if (S.prop.phase !== ph0) { why = 'étape prop firm'; break; }
        if (S.counters.marginCalls !== mc0) { why = 'margin call'; break; }
        if (S.quarterN !== q0) { why = 'rapport trimestriel'; break; }
        if (S.market.regime === 'crisis' && S.market.perceived === 'crisis' && S.market.perceivedSince === S.week) { why = 'crise détectée'; break; }
        if (Prop.active() && Prop.dd() > Prop.rules().maxDD * 0.7) { why = 'perte prop proche de la limite'; break; }
      }
    } finally { UI.batch = false; }
    UI.renderAll();
    const n = S.week - w0;
    UI.toast(`⏩ ${n} sem. : NAV ${fmtPct(S.fund.navps / nav0 - 1, 1, true)} · AUM ${fmtMoney(this.totalAUM() - aum0)} · cash ${fmtMoney(S.cash - cash0)}${why ? ' — arrêt : ' + why : ''}`, why ? 'warn' : 'info');
    if (S.events.pending) UI.showEvent();
    else if (S.quarterN !== q0 && S.showReports) UI.showReport();
  },

  /* AUM total de la société : fonds principal + fonds satellites */
  totalAUM() { return Portfolio.aum() + (S.satellites || []).reduce((a, x) => a + x.aum, 0); },

  /* Avance rapide jusqu'au prochain fait marquant (max 26 semaines) */
  skip() {
    if (!S || S.status !== 'playing') return;
    if (S.events.pending) return UI.showEvent();
    const t0 = S.tier, p0 = S.market.perceived, q0 = S.quarterN, a0 = S.advice.length ? S.advice[0].id : null, o0 = S.opps.length, ph0 = S.prop.phase;
    UI.batch = true;
    let n = 0, why = 'limite de 26 semaines';
    try {
      while (n < 26) {
        if (!this.tick()) break;
        n++;
        if (S.status !== 'playing') { why = 'fin de partie'; break; }
        if (S.events.pending) { why = 'événement'; break; }
        if (S.tier !== t0) { why = 'déménagement'; break; }
        if (S.market.perceived !== p0) { why = 'changement de régime'; break; }
        if (S.quarterN !== q0) { why = 'rapport trimestriel'; break; }
        if (S.prop.phase !== ph0) { why = 'étape prop firm'; break; }
        if (S.advice.length && S.advice[0].id !== a0) { why = 'conseil de l’équipe'; break; }
        if (S.opps.length > o0) { why = 'nouvelle opportunité'; break; }
      }
    } finally { UI.batch = false; }
    UI.renderAll();
    UI.toast(`⏭️ ${n} semaine(s) passée(s) — arrêt : ${why}.`, 'info');
    if (S.events.pending) UI.showEvent();
    else if (S.quarterN !== q0 && S.showReports) UI.showReport();
  },

  /* Bilan de fin de régime : votre NAV comparée au préréglage Équilibré */
  regimeReport(prev) {
    const st = S.regimeStat;
    const navNow = S.fund.navps;
    if (st && st.regime === prev && S.week - st.week >= 2) {
      const you = navNow / st.nav - 1, ref = S.bench.bal / st.bal - 1;
      const R = CONFIG.REGIMES[prev];
      const txt = `Bilan du régime ${R.icon} ${R.name} (${S.week - st.week} sem.) : vous ${fmtPct(you, 1, true)}, préréglage Équilibré ${fmtPct(ref, 1, true)}.`;
      this.log(txt, you >= ref ? 'good' : 'warn');
      UI.toast(txt, you >= ref ? 'good' : 'warn');
      if (S.quarter) S.quarter.regimes.push({ icon: R.icon, name: R.name, weeks: S.week - st.week, you, ref });
      if (prev === 'crisis' && S.counters.marginCalls === st.mc) S.events.flags.crisisSurvived = true;
    }
    S.regimeStat = { regime: S.market.regime, week: S.week, nav: navNow, bal: S.bench.bal, mc: S.counters.marginCalls };
  },

  recordHistory() {
    const h = S.history;
    h.week.push(S.week); h.navps.push(S.fund.navps); h.aum.push(this.totalAUM());
    h.bench.push(S.bench.def ? S.bench.value * S.bench.startNav / 100 : null);   // rebasé sur la NAV au lancement
    if (S.bench.def) { S.bench.hist.push(S.bench.value); if (S.bench.hist.length > 120) S.bench.hist.shift(); }
    if (h.week.length > 700) { // sous-échantillonnage de la moitié la plus ancienne
      const half = 350;
      for (const key of ['week', 'navps', 'aum', 'bench']) h[key] = h[key].slice(0, half).filter((_, i) => i % 2 === 0).concat(h[key].slice(half));
    }
    S.fund.navHist.push(S.fund.navps);
    if (S.fund.navHist.length > 120) S.fund.navHist.shift();
  },

  setDifficulty(d) {
    if (!S || S.difficulty === d) return;
    S.difficulty = d;
    if (d === 'casual') {
      S.fund.leverage = 1;
      for (const k of RISKY) if (S.fund.target[k] < 0) S.fund.target[k] = 0;
      S.fund.autoRebalance = true;
      Portfolio.normalizeTarget();
      Portfolio.rebalance();
    }
    this.log(`Difficulté changée : ${CONFIG.MODES[d].label}.`, 'warn');
    UI.renderAll();
  },

  /* Choix de fin débloqués par la victoire */
  endChoice(c) {
    if (c === 'ipo') {
      const gain = Portfolio.aum() * 0.03;
      S.cash += gain; addRep(5);
      this.log(`📈 Introduction en bourse de la société de gestion : +${fmtMoney(gain)} de trésorerie. Le jeu continue en mode endless.`, 'tier');
    } else if (c === 'philanthropy') {
      const gift = Math.max(0, S.cash * 0.5);
      S.cash -= gift; S.reputation = 100; S.repBonus += 10;
      this.log(`💝 Philanthropie : ${fmtMoney(gift)} donnés à des fondations. Réputation maximale.`, 'tier');
    } else if (c === 'retire') {
      S.status = 'retired';
      Legacy.recordRun();
      this.log('🏖️ Vous prenez votre retraite au sommet. Une légende de la finance.', 'tier');
      Save.save(true);
      UI.closeModal();
      UI.showEnd('Retraite dorée', 'Vous quittez la scène en vainqueur. Votre héritage profitera à votre prochaine partie.', true);
      return;
    }
    S.endChoice = c;
    UI.closeModal();
    UI.renderAll();
  }
};

/* =============================================================================
   12. SAVE — localStorage (sauvegarde, chargement, reset) + legacy
   ============================================================================= */
const Save = {
  slot: 1,
  key(n) { return n === 1 ? CONFIG.SAVE_KEY : CONFIG.SAVE_KEY + '_s' + n; },
  storage() { try { return window.localStorage; } catch (e) { return null; } },
  raw(n) { const st = this.storage(); try { return st ? st.getItem(this.key(n)) : null; } catch (e) { return null; } },
  exists() { return [1, 2, 3].some(n => !!this.raw(n)); },
  lastSlot() { const st = this.storage(); let n = 1; try { n = Number(st && st.getItem('hft_last_slot')) || 1; } catch (e) { /* ignore */ } return this.raw(n) ? n : ([1, 2, 3].find(x => this.raw(x)) || 1); },
  firstFree() { return [1, 2, 3].find(n => !this.raw(n)) || this.lastSlot(); },
  /* Résumé d'un emplacement (pour les listes) */
  info(n) {
    const r = this.raw(n); if (!r) return null;
    try { const d = JSON.parse(r); const h = d.history || {}; return { name: d.fundName, difficulty: d.difficulty, week: d.week, tier: d.tier, aum: (h.aum && h.aum.length) ? h.aum[h.aum.length - 1] : 0 }; } catch (e) { return { name: '(illisible)', week: 0, tier: 0, aum: 0 }; }
  },
  save(silent) {
    if (!S || !UI.enabled) return false;
    const st = this.storage();
    if (!st) { if (!silent) UI.toast('Sauvegarde indisponible (localStorage bloqué).', 'bad'); return false; }
    try {
      S.seed = RNG.seed;
      st.setItem(this.key(this.slot), JSON.stringify(S));
      st.setItem('hft_last_slot', String(this.slot));
      if (!silent) UI.toast(`💾 Partie sauvegardée (emplacement ${this.slot}).`, 'good');
      return true;
    } catch (e) {
      if (!silent) UI.toast('Erreur de sauvegarde : ' + e.message, 'bad');
      return false;
    }
  },
  exportFile() {
    if (!S) return;
    const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hedge-fund-tycoon-${(S.fundName || 'partie').replace(/[^\w-]+/g, '_')}-sem${S.week}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    UI.toast('⬇️ Partie exportée.', 'good');
  },
  importFile(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try { const data = JSON.parse(fr.result); if (!data || typeof data !== 'object' || !data.fund) throw new Error('fichier non reconnu'); this.restore(data); UI.closeModal(); UI.afterLoad(); this.save(true); UI.toast(`⬆️ Partie importée dans l'emplacement ${this.slot}.`, 'good'); }
      catch (e) { UI.toast('Import impossible : ' + e.message, 'bad'); }
    };
    fr.readAsText(file);
  },
  load(n = this.slot) {
    try {
      const raw = this.raw(n);
      if (!raw) { UI.toast('Aucune sauvegarde dans cet emplacement.', 'warn'); return false; }
      this.slot = n;
      this.restore(JSON.parse(raw));
      UI.toast(`📂 Partie chargée (emplacement ${n}).`, 'good');
      return true;
    } catch (e) {
      UI.toast('Sauvegarde illisible : ' + e.message, 'bad');
      return false;
    }
  },
  /* Reconstruit l'état à partir de données sauvegardées (migration douce) */
  restore(data) {
    {
      // Migration douce : on complète avec un état neuf pour les champs manquants
      const fresh = createState(data.difficulty || 'casual', data.fundName, Legacy.get());
      S = deepMerge(fresh, data);
      if (!data.prop) { S.prop.launched = true; S.prop.phase = 'off'; } // sauvegarde antérieure à la prop firm
      const hb = S.history.bench, hw = S.history.week.length;
      if (hb.length < hw) S.history.bench = Array(hw - hb.length).fill(null).concat(hb);
      if (S.prop.launched && !S.bench.def) { Bench.start(S.strategy || 'default'); S.history.bench = S.history.bench.map(() => null); }
      if (S.prop.launched && !S.strategy && !S.events.pending) S.events.queue = ['fund_strategy'];
      RNG.seed = (S.seed >>> 0) || RNG.seed;
      Team.invalidate();
    }
  },
  clear(n = this.slot) { const st = this.storage(); try { if (st) st.removeItem(this.key(n)); } catch (e) { /* ignore */ } }
};
function deepMerge(base, over) {
  if (Array.isArray(over)) return over;
  if (over && typeof over === 'object') {
    const out = (base && typeof base === 'object' && !Array.isArray(base)) ? Object.assign({}, base) : {};
    for (const k of Object.keys(over)) out[k] = deepMerge(base ? base[k] : undefined, over[k]);
    return out;
  }
  return over === undefined ? base : over;
}

/* Legacy : bonus cumulatif de capital de départ (+10 % par partie, plafonné) */
const Legacy = {
  get() {
    try { return JSON.parse(Save.storage()?.getItem(CONFIG.LEGACY_KEY) || '{}') || {}; } catch (e) { return {}; }
  },
  recordRun() {
    if (!UI.enabled) return;
    const l = this.get();
    l.runs = (l.runs || 0) + 1;
    l.bestAUM = Math.max(l.bestAUM || 0, S ? S.stats.peakAUM : 0);
    try { Save.storage()?.setItem(CONFIG.LEGACY_KEY, JSON.stringify(l)); } catch (e) { /* ignore */ }
  },
  bonus() { return Math.min(CONFIG.LEGACY_CAP, (this.get().runs || 0) * CONFIG.LEGACY_STEP); }
};

/* Thème Terminal : remplace les emojis par du texte (lisibilité, lecteurs d'écran) */
const EMOJI_RE = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍(?:\p{Extended_Pictographic})️?)*/gu;
function textify(str) {
  if (!str || UI.theme() !== 'terminal') return str;
  return String(str)
    .replace(/💰\s?(?=[+−-])/g, 'Cash ').replace(/⭐\s?(?=[+−-])/g, 'Réputation ').replace(/🛡️?\s?(?=[+−-])/g, 'Conformité ')
    .replace(/🤝\s?(?=[+−-]|confiance)/g, 'Confiance ').replace(/🔬\s?(?=[+−-])/g, 'Recherche ').replace(/(\d)\s?🔬/g, '$1 RP')
    .replace(/✅/g, '[OK]').replace(/❌/g, '[X]').replace(/⚠️/g, '[!]').replace(/🔒/g, '[verrouillé]').replace(/🟢/g, '[+]').replace(/🔴/g, '[−]').replace(/⚪/g, '[=]')
    .replace(EMOJI_RE, m => (m === '▶' || m === '▶️' ? '▶' : ''))
    .replace(/ {2,}/g, ' ').replace(/>\s+/g, m => m.replace(/ {2,}/g, ' '));
}
function gl(term, label) { return `<span class="gl" tabindex="0" role="button" data-gl="${esc(term)}" title="${esc(GLOSSARY[term] || '')}">${label || term}</span>`; }

        if (f.length) { const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
      }
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.classList.contains('gl')) { e.preventDefault(); this.showGlossary(document.activeElement.dataset.gl); return; }
      if (e.code === 'Space' && !this.modalOpen && !['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement?.tagName) && !document.activeElement?.closest('[tabindex="0"]')) {
        e.preventDefault(); Game.tick();
      }
    });
    this.applyTheme(this.theme());
    this.applyA11y(this.a11y());
    this.$('tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-label="${t.label.replace(/^\S+\s/, '')}">${this.tabLabel(t)}</button>`).join('');
  },

  /* ---------- Délégation d'événements ---------- */
  onClick(e) {
    const gt = e.target.closest('[data-gl]');
    if (gt && !e.target.closest('.modal')) { this.showGlossary(gt.dataset.gl); return; }
    const tb = e.target.closest('[data-tut]');
    if (tb) { tb.dataset.tut === 'next' ? Tutorial.next() : Tutorial.stop(); return; }
    const el = e.target.closest('[data-tab],[data-act],[data-modal]');
    if (!el) return;
    if (el.dataset.tab) { this.tab = el.dataset.tab; this.renderTab(); this.renderTabs(); Tutorial.render(); return; }
    if (el.dataset.modal) { const h = this.modalHandlers[el.dataset.modal]; if (h) h(el); return; }
    if (!S) return;
    const a = el.dataset.act, id = el.dataset.id ? Number(el.dataset.id) : null, k = el.dataset.k;
    switch (a) {
      case 'hire': Team.hire(id); break;
      case 'hire-eq': Team.hire(id, true); break;
      case 'fire': {
        const emp = S.team.employees.find(x => x.id === id);
        if (emp) this.confirm(`Licencier ${emp.name} ?`, `Indemnité : ${fmtMoney(Team.salary(emp) * CONFIG.SEVERANCE_WEEKS)}.`, () => Team.fire(id));
        break;
      }
      case 'train': Team.train(id); break;
      case 'promote': Team.promote(id); break;
      case 'headhunt': Team.headhunt(); break;
      case 'upgrade': Progression.buyUpgrade(el.dataset.u); break;
      case 'preset': if (S.tutorial) S.tutorial.preset = true; Portfolio.applyPreset(k); if (Portfolio.isCasual()) Portfolio.rebalance(); this.renderAll(); break;
      case 'w-minus': case 'w-plus': {
        const step = a === 'w-plus' ? 5 : -5;
        S.fund.target[k] = clamp(S.fund.target[k] + step, Portfolio.minWeight(k), S.fund.leverage * 100);
        this.clampTargetRoom(k);
        S.fund.preset = null;
        this.renderTab(); this.renderHeaderStats();
        break;
      }
      case 'rebalance': {
        const fee = Portfolio.rebalance(true);
        Game.log(`Rééquilibrage manuel exécuté (frais ${fmtMoney(fee)}).`, 'info');
        this.toast(`Allocation appliquée (frais ${fmtMoney(fee)})`, 'good');
        this.renderAll(); break;
      }
      case 'auto-rebal': S.fund.autoRebalance = !S.fund.autoRebalance; this.renderTab(); break;
      case 'prop-buy': Prop.buyChallenge(); break;
      case 'opp': Opps.invest(id, Number(el.dataset.f)); break;
      case 'advice': Team.applyAdvice(id); break;
      case 'bonus': Team.bonus(id); break;
      case 'sat-launch': Satellites.launch(k); break;
      case 'sat-close': this.confirm('Fermer ce fonds ?', 'Les clients récupèrent leur argent (réputation −2).', () => Satellites.close(id)); break;
      case 'report': this.showReport(); break;
      case 'hedge-buy': Hedges.buy(this.hedgeK || 'equities', Number(el.dataset.f), this.hedgeOtm ?? 0.10); break;
      case 'hedge-close': Hedges.close(id); break;
      case 'retain': Investors.retain(id); break;
      case 'bank-in': Bank.invest(Number(el.dataset.f)); break;
      case 'bank-out': Bank.withdraw(Number(el.dataset.f)); break;
      case 'prestige': this.confirm('Prestige ?', 'La partie actuelle se termine. Vous recommencez avec : réputation de départ +5 et clients +10 % par niveau de prestige (cumulables).', () => Prestige.go()); break;
      case 'corr-mode': this.corrMode = this.corrMode === 'theo' ? 'obs' : 'theo'; this.renderTab(); break;
      case 'prop-quit': this.confirm('Quitter la prop firm ?', 'Vous ne toucherez plus de versements.', () => Prop.quit()); break;
      case 'founder-in': Investors.founderInvest(S.cash * Number(el.dataset.f)); break;
      case 'founder-out': {
        const f = Investors.founder();
        if (f) Investors.founderWithdraw(Investors.capital(f) * Number(el.dataset.f));
        break;
      }
      case 'leverage': S.fund.leverage = Number(el.dataset.v); Portfolio.normalizeTarget(); this.renderTab(); break;
      case 'show-event': this.showEvent(); break;
    }
  },
  onInput(e) {
    const el = e.target;
    if (!S || !el.classList.contains('alloc-slider')) return;
    const k = el.dataset.k;
    S.fund.target[k] = Number(el.value);
    this.clampTargetRoom(k);
    el.value = S.fund.target[k];
    S.fund.preset = null;
    this.updateAllocPreview();
  },
  onChange(e) {
    const el = e.target;
    if (!S) return;
    if (el.classList.contains('alloc-slider')) { this.renderTab(); this.renderHeaderStats(); }
    if (el.dataset.sl) { S.fund.stopLoss[el.dataset.sl] = Number(el.value); S.fund.refPrice[el.dataset.sl] = S.market.prices[el.dataset.sl]; }
    if (el.id === 'ddAlertSel') { S.fund.ddAlert = Number(el.value); S.fund.ddAlerted = false; }
    if (el.id === 'hedgeSel') { this.hedgeK = el.value; this.renderTab(); }
    if (el.id === 'strikeSel') { this.hedgeOtm = Number(el.value); this.renderTab(); }
  },
  /* Empêche la somme brute des cibles de dépasser le levier autorisé */
  clampTargetRoom(k) {
    const f = S.fund;
    const others = RISKY.filter(x => x !== k).reduce((a, x) => a + Math.abs(f.target[x]), 0);
    const room = f.leverage * 100 - others;
    if (Math.abs(f.target[k]) > room) f.target[k] = Math.sign(f.target[k]) * Math.max(0, room);
  },

  /* ---------- Rendu global ---------- */
  renderAll() {
    if (!this.enabled || !S) return;
    this.renderHeaderStats();
    this.renderTabs();
    this.renderTab();
    this.updateChart();
    Tutorial.render();
  },
  renderHeaderStats() {
    if (!this.enabled || !S) return;
    const A = Portfolio.aum();
    this.$('fundName').textContent = `${S.fundName} · ${CONFIG.MODES[S.difficulty].label}${S.hardMode ? ' · Hard' : ''}${S.won ? ' · 🏆 Endless' : ''}`;
    const nextBtn = this.$('btnNext');
    nextBtn.disabled = S.status !== 'playing';
    nextBtn.textContent = textify(S.events.pending ? '❗ Décision en attente' : '▶ Semaine suivante');

    // Palier
    const T = TIERS[S.tier - 1], N = TIERS[S.tier];
    let prog = 1, nextTxt = 'Palier maximal atteint — mode endless';
    if (!S.prop.launched) {
      const p = S.prop, r = Prop.rules();
      if (p.phase === 'challenge') { prog = clamp(Prop.gain() / r.target, 0, 1); nextTxt = `🎯 Challenge : ${fmtPct(Prop.gain(), 1, true)} / ${fmtPct(r.target, 0, true)} · drawdown ${fmtPct(Prop.dd(), 1)} / ${fmtPct(r.maxDD, 0)}${r.deadline ? ' · sem. ' + (S.week - p.startWeek) + '/' + r.deadline : ''}`; }
      else if (p.phase === 'funded') { prog = clamp(p.fundedWeeks / r.gradWeeks, 0, 1); nextTxt = `💼 Compte financé ${fmtMoney(p.size)} · ${p.fundedWeeks}/${r.gradWeeks} sem. avant le lancement du fonds · track ${fmtPct(Prop.trackAnnual(), 1, true)}/an`; }
      else { prog = 0; nextTxt = '🎯 Achetez un challenge prop firm (onglet Portefeuille) pour commencer'; }
    } else if (N) {
      prog = T.min > 0 ? clamp(Math.log(Math.max(A, T.min) / T.min) / Math.log(N.min / T.min), 0, 1) : clamp(A / N.min, 0, 1);
      nextTxt = `Prochain : ${N.icon} ${N.name} à ${fmtMoney(N.min)} d'AUM`;
    }
    this.$('tierBar').innerHTML = textify(`
      <div class="tier-badge"><span class="ic">${T.icon}</span><div><div><span class="lvl">Palier ${S.tier}</span> ${T.name}</div><div class="small muted">${T.local} · capacité ${S.team.employees.length}/${T.cap === Infinity ? '∞' : T.cap}${T.bonusTxt !== '—' ? ' · ' + T.bonusTxt : ''}</div></div></div>
      <div class="tier-progress"><div class="row between small"><span class="muted">${nextTxt}</span><span class="num">${fmtPct(prog, 0)}</span></div><div class="bar" aria-hidden="true"><div style="width:${prog * 100}%"></div></div></div>`);

    this.renderGoalBar();
    this.$('chartTitle').textContent = S.prop.launched ? 'Valeur liquidative du fonds (NAV par part, base 100 au lancement) & AUM' : 'Performance de votre allocation (base 100) — le fonds n’est pas encore lancé';
    this.$('btnSkip').disabled = S.status !== 'playing';
    this.$('btnMonth').disabled = S.status !== 'playing';
    const gauge = (v, color) => `<div class="gauge" aria-hidden="true"><div style="width:${clamp(v, 0, 100)}%;background:${color}"></div></div>`;
    const colHigh = v => v > 90 ? 'var(--red)' : v > 70 ? 'var(--amber)' : v > 50 ? '#facc15' : 'var(--green)';
    const colLow = v => v < 20 ? 'var(--red)' : v < 50 ? 'var(--amber)' : 'var(--green)';
    const conf = Investors.globalConfidence();
    const items = [
      { l: 'Cash société', v: fmtMoney(S.cash), s: `<span class="${cls(S.last.cash)}">${S.last.cash >= 0 ? '+' : ''}${fmtMoney(S.last.cash)}/sem</span>`, c: S.cash < 0 ? 'red' : '' },
      !S.prop.launched ? { l: 'Compte prop', v: Prop.active() ? fmtMoney(S.prop.equity) : '—', s: `<span class="muted">${{ idle: 'aucun compte', challenge: 'challenge', funded: 'financé', off: '' }[S.prop.phase]}</span>` } :
      S.satellites.length ? { l: 'AUM total', v: fmtMoney(Game.totalAUM()), s: `<span class="muted">fonds principal ${fmtMoney(A)}</span>` } :
      { l: 'AUM', v: fmtMoney(A), s: `<span class="${cls(S.last.subs - S.last.reds)}">flux ${S.last.subs - S.last.reds >= 0 ? '+' : ''}${fmtMoney(S.last.subs - S.last.reds)}</span>` },
      { l: S.prop.launched ? 'NAV / part' : 'Allocation (base 100)', v: fmtNum(S.fund.navps, 2), s: `<span class="${cls(S.last.fundReturn)}">${fmtPct(S.last.fundReturn, 2, true)} sem.</span>` },
      { l: 'Réputation', v: `${Math.round(S.reputation)}<span class="small muted">/100</span>`, s: gauge(S.reputation, 'var(--accent)') },
      { l: gl('Margin call', 'Risque'), v: `${Math.round(S.risk)}<span class="small muted">/100</span>`, s: gauge(S.risk, colHigh(S.risk)), c: S.risk > 90 ? 'red' : S.risk > 70 ? 'amber' : '' },
      { l: gl('Conformité'), v: `${Math.round(S.compliance)}<span class="small muted">/100</span>`, s: gauge(S.compliance, colLow(S.compliance)), c: S.compliance < 20 ? 'red' : S.compliance < 50 ? 'amber' : '' },
      { l: 'Confiance clients', v: `${Math.round(conf)}<span class="small muted">/100</span>`, s: gauge(conf, colLow(conf)) },
      { l: 'Recherche', v: `🔬 ${fmtNum(Math.floor(S.rp))}`, s: `<span class="muted">+${fmtNum(Team.rpPerWeek(), 1)}/sem</span>` },
      { l: 'Jour', v: `${fmtNum(S.week * 7)}`, s: `<span class="muted">Sem. ${S.week} · An ${Math.floor(S.week / 52) + 1}</span>` }
    ];
    this.$('stats').innerHTML = textify(items.map(i => `<div class="stat"><div class="lab">${i.l}</div><div class="val num ${i.c || ''}">${i.v}</div><div class="sub num">${i.s}</div></div>`).join(''));
    this.$('btnAuto').textContent = textify(`⏩ Auto : ${this.autoTimer ? 'ON' : 'OFF'}`);
    this.$('btnAuto').classList.toggle('on', !!this.autoTimer);
  },
  /* Bandeau : indice de référence + objectif du trimestre */
  renderGoalBar() {
    const el = this.$('goalBar');
    let html;
    if (!S.bench.def) html = `<div class="muted">📊 Indice de référence : défini au lancement du fonds, selon la stratégie choisie.</div>`;
    else { const you = Bench.you(), idx = Bench.idx();
    html = `<div>📊 <b>Vous vs ${Bench.name()}</b> (depuis le lancement) : <span class="num ${cls(you)}">${fmtPct(you, 1, true)}</span> vs <span class="num ${cls(idx)}">${fmtPct(idx, 1, true)}</span> <span class="pill ${you >= idx ? 'g' : 'r'}">${you >= idx ? 'devant' : 'derrière'} de ${fmtPct(Math.abs(you - idx), 1)}</span></div>`; }
    if (S.prop.launched && S.goal && S.quarter) {
      const g = Quarter.goalDef(), L = Quarter.live(), ok = g.ok(L, S.goal.p);
      html += `<div>🎯 <b>Objectif du trimestre :</b> ${g.text(S.goal.p)} — <span class="${ok ? 'green' : 'amber'}">${ok ? '✅ en bonne voie' : '⏳ pas encore'}</span> (${g.fmt(g.live(L))}) · ${Math.max(0, 13 - (S.week - S.quarter.start))} sem. restantes · prime ${fmtMoney(S.goal.reward)} · série ${S.goalStreak}</div>`;
    }
    if (S.strategy) html += `<div class="muted">${STRATEGIES[S.strategy].icon} ${STRATEGIES[S.strategy].name}</div>`;
    if (S.lastReport) html += `<button class="btn small" data-act="report">📄 Dernier rapport</button>`;
    el.innerHTML = textify(html);
  },
  renderTabs() {
    if (!S) return;
    const alerts = { portfolio: S.risk > 70, team: S.tier >= 2 && S.team.employees.length === 0 && S.team.candidates.length > 0, investors: Investors.globalConfidence() < 40 };
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === this.tab);
      b.setAttribute('aria-selected', b.dataset.tab === this.tab ? 'true' : 'false');
      const t = TABS.find(x => x.id === b.dataset.tab);
      b.innerHTML = this.tabLabel(t) + (alerts[t.id] ? '<span class="dot"></span>' : '');
    });
  },
  renderTab() {
    if (!this.enabled || !S) return;
    const fn = { market: 'tabMarket', portfolio: 'tabPortfolio', team: 'tabTeam', investors: 'tabInvestors', upgrades: 'tabUpgrades', analysis: 'tabAnalysis', journal: 'tabJournal' }[this.tab];
    const el = this.$('tabContent');
    const scroll = el.querySelector('.journal')?.scrollTop;
    el.innerHTML = textify(this[fn]());
    if (scroll) { const j = el.querySelector('.journal'); if (j) j.scrollTop = scroll; }
  },

  sparkline(arr) {
    if (!arr || arr.length < 2) return '<svg></svg>';
    const w = 200, h = 40;
    const min = Math.min(...arr), max = Math.max(...arr), rg = max - min || 1;
    const pts = arr.map((v, i) => `${(i / (arr.length - 1) * w).toFixed(1)},${(h - 2 - (v - min) / rg * (h - 4)).toFixed(1)}`).join(' ');
    const col = arr[arr.length - 1] >= arr[0] ? 'var(--green)' : 'var(--red)';
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${pts}"/></svg>`;
  },

  /* ---------- Onglet Marché ---------- */
  tabMarket() {
    const m = S.market, q = Team.infoQuality();
    const R = CONFIG.REGIMES[m.perceived];
    const card = k => {
      const a = CONFIG.ASSETS[k];
      const unlocked = Market.isUnlocked(k);
      if (k === 'cash') {
        return `<div class="card asset"><div class="top"><span class="name">${a.icon} ${a.name}</span><span class="pill">Sécurité</span></div>
          <div class="price num">1,00</div><svg viewBox="0 0 200 40" preserveAspectRatio="none"><line x1="0" y1="20" x2="200" y2="20" stroke="var(--muted)" stroke-width="1.5"/></svg>
          <div class="kv small"><span class="muted">Rendement</span><span>0 %/an</span></div><div class="kv small"><span class="muted">Liquidité</span><span>${a.liq} · frais 0 %</span></div></div>`;
      }
      const r = m.lastReturns[k], fc = m.forecasts[k] || 0;
      return `<div class="card asset ${unlocked ? '' : 'locked'}">
        <div class="top"><span class="name">${a.icon} ${a.name}</span>${unlocked ? `<span class="num ${cls(r)}">${fmtPct(r, 2, true)}</span>` : `<span class="pill a">🔒 Palier ${a.tier}</span>`}</div>
        <div class="price num">${fmtNum(m.prices[k], 2)}</div>
        ${this.sparkline(m.hist[k])}
        <div class="kv small"><span class="muted">Rendement prévu</span><span class="num ${cls(fc)}">${fmtPct(fc, 1, true)}/an <span class="muted">±${fmtPct(Portfolio.forecastError(k), 0)}</span></span></div>
        ${unlocked ? `<div class="kv small"><span class="muted">Recommandation</span><span class="pill ${Portfolio.rating(k).c}">${Portfolio.rating(k).t}</span></div>` : ''}
        <div class="kv small"><span class="muted" title="Volatilité annualisée attendue sur les 3 prochains mois et sur 1 an, selon le régime perçu et les probabilités de changement de régime. Si celle à 3 mois dépasse celle à 1 an, le marché est plus nerveux que d’habitude.">Volatilité prévue</span><span class="num">3 mois ${fmtPct(Market.expectedVol(k, 13), 0)} · 1 an ${fmtPct(Market.expectedVol(k, 52), 0)}</span></div>
        <div class="kv small"><span class="muted">Liquidité</span><span>${a.liq} · frais ${fmtPct(Portfolio.feeRate(k), 2)}</span></div>
        ${a.profile ? `<div class="small muted">${a.profile}</div>` : ''}
      </div>`;
    };
    const locked = RISKY.filter(k => !Market.isUnlocked(k));
    const cards = Object.entries(CONFIG.ASSET_GROUPS).map(([g, label]) => {
      const ks = RISKY.filter(k => CONFIG.ASSETS[k].group === g && Market.isUnlocked(k)).concat(g === 'obligations' ? ['cash'] : []);
      return ks.length ? `<h3 class="mt">${label}</h3><div class="grid g4">${ks.map(card).join('')}</div>` : '';
    }).join('') + (locked.length ? `<div class="small muted mt">🔒 À débloquer : ${locked.map(k => `${CONFIG.ASSETS[k].icon} ${CONFIG.ASSETS[k].name} (palier ${CONFIG.ASSETS[k].tier})`).join(' · ')}</div>` : '');
    const topMods = m.mods.slice().sort((x, y) => Math.abs(y.mu) - Math.abs(x.mu)).slice(0, 6);
    const mods = m.mods.length ? topMods.map(md => `<span class="pill ${md.mu > 0 ? 'g' : 'r'}">${md.k === 'all' ? 'Tous' : CONFIG.ASSETS[md.k].name} ${fmtPct(md.mu, 0, true)}/an · ${md.weeks} sem.</span>`).join(' ') + (m.mods.length > 6 ? ` <span class="muted small">+${m.mods.length - 6} autres</span>` : '') : '<span class="muted small">Aucun</span>';
    return `
      <div class="grid g3">
        <div class="card"><h4>Régime de marché (estimé)</h4><div style="font-size:22px;font-weight:700">${R.icon} ${R.name}</div>
          <div class="small muted">Détecté depuis ${Math.max(0, S.week - (m.perceivedSince || 0))} sem. Un changement de régime est repéré avec retard : ${fmtPct(m.perceivedConf || 0.4, 0)} de chances par semaine (analystes, quants, data premium accélèrent la détection).</div>
          <div class="small mt">${{ bull: '👉 Conseil : Dynamique.', range: '👉 Conseil : Équilibré, ne touchez à rien.', bear: '👉 Conseil : Prudent si ça dure.', crisis: '👉 Conseil : Prudent, coupez le levier.', bubble: '👉 Conseil : profitez-en mais préparez la sortie.' }[m.perceived]} ${S.prop.launched ? 'Une fois le fonds lancé, ce sont surtout les clients (réputation, confiance) qui le font grandir.' : 'En prop firm, la régularité prime : un drawdown trop fort élimine.'}</div></div>
        <div class="card"><h4>Qualité d'information</h4><div style="font-size:22px;font-weight:700">${fmtPct(q, 0)}</div>
          <div class="gauge"><div style="width:${q * 100}%;background:var(--blue)"></div></div>
          <div class="small muted mt">Chaque carte d'actif affiche le <b>rendement prévu</b> pour les semaines à venir (il dépend du régime en cours) et sa marge d'erreur. Plus la qualité d'information est haute, plus la prévision est précise. Usage : renforcez les actifs 🟢, réduisez les 🔴, ou utilisez le préréglage « 🔮 Selon les prévisions » (onglet Portefeuille). La qualité d'information génère aussi un alpha jusqu'à +2,5 %/an.</div></div>
        <div class="card"><h4>Facteurs temporaires</h4><div class="row">${mods}</div>
          <div class="small muted mt">Régimes possibles : 🐂 haussier, ↔️ latéral, 🐻 baissier, 🔥 crise (corrélations ↑, volatilité ↑), 🫧 bulle (les actifs risqués surperforment… puis chutent).</div></div>
      </div>
      ${this.adviceAndOpps()}
      ${cards}`;
  },
  adviceAndOpps() {
    const adv = S.advice.map(a => `<div class="kv small"><span>${esc(a.text)}</span>${a.act ? `<button class="btn small" data-act="advice" data-id="${a.id}">Appliquer</button>` : ''}</div>`).join('')
      || '<div class="small muted">Rien à signaler. Recrutez (risk analyst, analystes, trader…) : ils vous alerteront et feront des recommandations.</div>';
    let opps;
    if (!S.prop.launched) opps = '<div class="small muted">Les opportunités ponctuelles apparaissent une fois votre fonds lancé.</div>';
    else {
      const A = Portfolio.aum(), err = Opps.err();
      const open = S.opps.filter(o => o.status === 'open' && o.expires > S.week).map(o => {
        const ev = o.shownP * o.up + (1 - o.shownP) * o.down;
        return `<div class="card" style="margin-top:6px"><b>${o.icon} ${esc(o.title)}</b>
          <div class="small">Succès : <span class="green">${fmtPct(o.up, 0, true)}</span> · échec : <span class="red">${fmtPct(o.down, 0, true)}</span> · horizon ${o.weeks} sem. · expire dans ${o.expires - S.week} sem.</div>
          <div class="small">Probabilité de succès estimée : <b>${fmtPct(o.shownP, 0)}</b> <span class="muted">±${fmtPct(err, 0)}</span> · espérance estimée <span class="${cls(ev)}">${fmtPct(ev, 1, true)}</span></div>
          <div class="row mt">${[0.02, 0.05, 0.1].map(f => `<button class="btn small" data-act="opp" data-id="${o.id}" data-f="${f}">Investir ${fmtPct(f, 0)} (${fmtMoney(A * f)})</button>`).join('')}</div></div>`;
      }).join('');
      const held = (S.fund.specials || []).map(x => `<div class="kv small"><span>${x.icon} ${esc(x.title)}</span><span class="num">${fmtMoney(x.amount)} · échéance dans ${x.maturity - S.week} sem.</span></div>`).join('');
      opps = (open || '<div class="small muted">Aucune opportunité ouverte. Prochaine dans quelques semaines.</div>') + (held ? `<h4 class="mt">Positions en cours</h4>${held}` : '')
        + `<div class="small muted mt">Maximum ${fmtPct(Opps.maxShare, 0)} de l'AUM engagé. La fiabilité de la probabilité affichée dépend de la qualité d'information.</div>`;
    }
    const cal = S.calendar.length ? S.calendar.map(ev => { const pr = Calendar.shown(ev); const wk = ev.week - S.week;
        return `<div class="card" style="margin-top:6px"><b>${ev.icon} ${ev.name}</b> <span class="pill ${wk <= 1 ? 'a' : ''}">${wk <= 0 ? 'cette semaine' : 'dans ' + wk + ' sem.'}</span>
          ${ev.sc.map((sc, i) => `<div class="kv small"><span>${sc.label}</span><span class="num">${fmtPct(pr[i], 0)}</span></div>`).join('')}</div>`; }).join('')
      : '<div class="small muted">Aucun rendez-vous annoncé pour l’instant.</div>';
    return `<div class="grid g3 mt"><div class="card"><h4>📅 Calendrier macro</h4>${cal}<div class="small muted mt">Probabilités estimées par l'équipe (plus fiables avec une bonne qualité d'information). Anticipez : couvrez-vous ou ajustez l'allocation avant l'annonce.</div></div>
      <div class="card"><h4>🗣️ L'équipe vous parle</h4>${adv}</div><div class="card"><h4>💡 Opportunités</h4>${opps}</div></div>`;
  },

  /* ---------- Onglet Portefeuille ---------- */
  stackBar(w) {
    const parts = Object.keys(CONFIG.ASSETS).map(k => ({ k, v: Math.max(0, w[k] || 0) }));
    const tot = parts.reduce((a, p) => a + p.v, 0) || 1;
    return `<div class="stack">${parts.filter(p => p.v > 0).map(p => `<div title="${CONFIG.ASSETS[p.k].name} ${fmtPct(p.v / tot, 0)}" style="width:${p.v / tot * 100}%;background:${CONFIG.ASSETS[p.k].color}"></div>`).join('')}</div>`;
  },
  tabPortfolio() {
    const f = S.fund, A = Portfolio.aum(), w = Portfolio.weights();
    const casual = Portfolio.isCasual();
    const tw = Object.fromEntries(RISKY.map(k => [k, f.target[k] / 100])); tw.cash = Math.max(0, Portfolio.targetCash() / 100);
    const legend = Object.keys(CONFIG.ASSETS).filter(k => Market.isUnlocked(k)).map(k => `<span style="--c:${CONFIG.ASSETS[k].color}">${CONFIG.ASSETS[k].name}</span>`).join('');
    const presets = Portfolio.presets();
    const maxL = Portfolio.maxLeverage();
    const levBtns = [1, 2, 5].map(v => `<button class="btn small ${f.leverage === v ? 'on' : ''}" data-act="leverage" data-v="${v}" ${v > maxL ? 'disabled' : ''}>${v}x</button>`).join('');
    const founder = Investors.founder();
    const fee = Portfolio.estimateRebalance();
    const shorts = RISKY.filter(k => f.positions[k] < 0);

    const row = k => {
      const a = CONFIG.ASSETS[k];
      const min = Portfolio.minWeight(k), max = f.leverage * 100;
      const sl = casual ? '<span class="small muted">—</span>' : `<select data-sl="${k}" title="Stop-loss" aria-label="Stop-loss : ${a.name}">${[0, 0.05, 0.1, 0.15, 0.2, 0.3].map(v => `<option value="${v}" ${f.stopLoss[k] === v ? 'selected' : ''}>${v ? 'SL ' + fmtPct(v, 0) : 'Pas de SL'}</option>`).join('')}</select>`;
      return `<div class="alloc-row">
        <div class="a-name"><b>${a.icon} ${a.name}</b>${min < 0 ? ' <span class="pill b">short possible</span>' : ''}</div>
        <button class="btn small" data-act="w-minus" data-k="${k}">−</button>
        <div class="a-slider"><input type="range" class="alloc-slider" aria-label="Allocation cible : ${a.name}" data-k="${k}" min="${min}" max="${max}" step="1" value="${f.target[k]}"></div>
        <button class="btn small" data-act="w-plus" data-k="${k}">+</button>
        <div class="a-info"><span class="num"><span class="muted small">Cible </span><b id="tgt-${k}">${f.target[k]} %</b></span>
        <span class="num small"><span class="muted">Actuel </span>${fmtPct(w[k], 0)}</span>
        ${sl}</div>
      </div>`;
    };
    const rows = Object.entries(CONFIG.ASSET_GROUPS).map(([g, label]) => {
      const ks = RISKY.filter(k => CONFIG.ASSETS[k].group === g && Market.isUnlocked(k));
      if (!ks.length) return '';
      const tot = ks.reduce((t, k) => t + f.target[k], 0);
      return `<div class="grp-head"><b>${label}</b><span class="muted small">cible ${tot} %</span></div>${ks.map(row).join('')}`;
    }).join('');

    return `${this.propCard()}
      <div class="grid g2">
        <div class="card">
          <h4>Allocation</h4>
          <div class="small muted">Actuelle</div>${this.stackBar(w)}
          <div class="small muted mt">Cible</div><div id="tgtStack">${this.stackBar(tw)}</div>
          <div class="legend">${legend}</div>
          <div class="mt"><h4>Préréglages</h4><div class="row">${Object.entries(presets).map(([id, p]) => `<button class="btn small ${f.preset === id ? 'on' : ''}" data-act="preset" data-k="${id}">${p.label}</button>`).join('')}</div></div>
          ${casual ? '<div class="small muted mt">Mode casual : rééquilibrage automatique chaque semaine, pas de levier ni de vente à découvert.</div>' :
          `<div class="mt"><h4>Levier maximal</h4><div class="row">${levBtns}<span class="small muted">${maxL === 1 ? '2x au palier 5, 5x au palier 7' : maxL === 2 ? '5x au palier 7' : ''}</span></div></div>
           <div class="mt row"><span class="small muted">Alerte drawdown à</span><select id="ddAlertSel" aria-label="Seuil d’alerte de drawdown">${[0.05, 0.1, 0.15, 0.2, 0.3].map(v => `<option value="${v}" ${f.ddAlert === v ? 'selected' : ''}>${fmtPct(v, 0)}</option>`).join('')}</select></div>`}
        </div>
        <div class="card">
          <h4>Synthèse du fonds</h4>
          <div class="kv"><span class="muted">AUM</span><b class="num">${fmtMoney(A)}</b></div>
          <div class="kv"><span class="muted">Cash du fonds (cible)</span><span class="num" id="tgtCash">${Portfolio.targetCash()} %</span></div>
          <div class="kv"><span class="muted">${gl('Exposition brute')} / ${gl('Levier', 'levier effectif')}</span><span class="num">${fmtPct(Portfolio.gross(), 0)}</span></div>
          <div class="kv"><span class="muted">Volatilité estimée (an)</span><span class="num">${fmtPct(Risk.portfolioVol(A <= 0), 1)}</span></div>
          <div class="kv"><span class="muted">Performance 26 sem. (annualisée)</span><span class="num ${cls(Investors.perfAnnual(26))}">${fmtPct(Investors.perfAnnual(26), 1, true)}</span></div>
          <div class="kv"><span class="muted">${gl('Drawdown')} depuis le plus haut</span><span class="num ${Portfolio.drawdown() > 0.1 ? 'red' : ''}">${fmtPct(Portfolio.drawdown(), 1)}</span></div>
          <div class="kv"><span class="muted">${gl('High-water mark')}</span><span class="num">${fmtNum(f.hwm, 2)}</span></div>
          <div class="kv"><span class="muted">Frais de transaction (sem. dernière)</span><span class="num">${fmtMoney(S.last.txFees)}</span></div>
          ${shorts.length ? `<div class="kv"><span class="muted">Positions courtes</span><span>${shorts.map(k => CONFIG.ASSETS[k].name).join(', ')}</span></div>` : ''}
          <div class="row mt">
            <button class="btn primary" data-act="rebalance" ${A <= 0 ? 'disabled' : ''}>Appliquer l'allocation (frais ≈ ${fmtMoney(fee)})</button>
            ${casual ? '' : `<button class="btn ${f.autoRebalance ? 'on' : ''}" data-act="auto-rebal" ${Portfolio.autoAvailable() ? '' : 'disabled title="Recrutez un trader pour automatiser"'}>Rééquilibrage auto : ${f.autoRebalance && Portfolio.autoAvailable() ? 'ON' : 'OFF'}</button>`}
          </div>
          ${!casual && !Portfolio.autoAvailable() ? '<div class="small muted mt">Automatisation : recrutez un Trader pour déléguer le rééquilibrage hebdomadaire.</div>' : ''}
          <div class="mt"><h4>Capital du fondateur (skin in the game)</h4>
            <div class="small muted">Investir le cash de la société dans le fonds rassure les clients (+ confiance) mais immobilise votre trésorerie.</div>
            <div class="kv"><span class="muted">Votre part</span><span class="num">${founder ? fmtMoney(Investors.capital(founder)) : '0 $'}</span></div>
            <div class="row"><button class="btn small" data-act="founder-in" data-f="0.25" ${S.cash <= 0 ? 'disabled' : ''}>Investir 25 % du cash</button>
            <button class="btn small" data-act="founder-in" data-f="1" ${S.cash <= 0 ? 'disabled' : ''}>Investir tout le cash</button>
            <button class="btn small" data-act="founder-out" data-f="0.5" ${founder ? '' : 'disabled'}>Retirer 50 %</button></div>
          </div>
        </div>
      </div>
      ${this.hedgeCard()}
      <div class="card mt">
        <div class="row between"><h4 style="margin:0">Allocation cible par actif</h4><span class="small muted">Somme brute max : ${f.leverage * 100} % · le reste est en cash ${f.leverage > 1 ? '(cash négatif = emprunt à ' + fmtPct(CONFIG.BORROW_RATE, 0) + ')' : ''}</span></div>
        ${rows}
      </div>`;
  },
  /* Couvertures : achat de protections (options de vente) */
  hedgeCard() {
    if (!Hedges.available()) return '';
    const A = Portfolio.aum();
    const ks = RISKY.filter(k => Market.isUnlocked(k) && (CONFIG.ASSETS[k].group === 'actions' || ['crypto', 'commodities', 'space'].includes(k)));
    this.hedgeK = ks.includes(this.hedgeK) ? this.hedgeK : 'equities';
    this.hedgeOtm = Hedges.STRIKES.includes(this.hedgeOtm) ? this.hedgeOtm : 0.10;
    const rate = Hedges.premiumRate(this.hedgeK, this.hedgeOtm);
    const list = S.hedges.map(h => `<div class="kv small"><span>${CONFIG.ASSETS[h.k].icon} ${CONFIG.ASSETS[h.k].name} · ${fmtMoney(h.notional)} couverts sous ${fmtNum(h.strike, 1)} (prix ${fmtNum(S.market.prices[h.k], 1)})</span>
      <span class="num">valeur ${fmtMoney(Hedges.payoff(h))} · ${h.expiry - S.week} sem. <button class="btn small" data-act="hedge-close" data-id="${h.id}">Revendre</button></span></div>`).join('');
    return `<div class="card mt"><h4>🛡️ ${gl('Couverture', 'Couvertures')} (protections)</h4>
      <div class="small muted">Une protection (option de vente) rapporte la baisse de l'actif sous le prix d'exercice choisi, pendant 13 semaines. Vous payez une ${gl('Prime', 'prime')} d'avance (plus chère quand le marché est nerveux). Elle réduit aussi le score de risque.</div>
      <div class="row mt"><select id="hedgeSel" aria-label="Actif à couvrir">${ks.map(k => `<option value="${k}" ${k === this.hedgeK ? 'selected' : ''}>${CONFIG.ASSETS[k].icon} ${CONFIG.ASSETS[k].name}</option>`).join('')}</select>
      <label for="strikeSel" class="small">Prix d'exercice</label><select id="strikeSel">${Hedges.STRIKES.map(o => `<option value="${o}" ${o === this.hedgeOtm ? 'selected' : ''}>${o ? '−' + fmtPct(o, 0) + ' (prime ' + fmtPct(Hedges.premiumRate(this.hedgeK, o), 1) + ')' : 'Prix actuel (prime ' + fmtPct(Hedges.premiumRate(this.hedgeK, 0), 1) + ')'}</option>`).join('')}</select>
      <span class="small">Prime : <b>${fmtPct(rate, 1)}</b> du montant couvert</span>
      ${[0.1, 0.25, 0.5].map(f => `<button class="btn small" data-act="hedge-buy" data-f="${f}">Couvrir ${fmtPct(f, 0)} de l'AUM (prime ${fmtMoney(A * f * rate)})</button>`).join('')}</div>
      ${list ? `<h4 class="mt">Protections en cours</h4>${list}` : ''}
      ${Object.keys(S.exclusions).length ? `<div class="small amber mt">🚫 Exclusions clients : ${Object.keys(S.exclusions).map(k => CONFIG.ASSETS[k].name).join(', ')}</div>` : ''}</div>`;
  },
  /* Carte prop firm (en haut de l'onglet Portefeuille) */
  propCard() {
    const p = S.prop, r = Prop.rules();
    if (p.launched && p.phase !== 'funded') return '';
    let body;
    if (p.phase === 'idle') {
      const free = Prop.canRetryFree();
      body = `<div class="small">Payez le challenge : on vous confie un compte de ${fmtMoney(r.size)}. Gagnez <b>${fmtPct(r.target, 0, true)}</b> sans jamais perdre <b>${fmtPct(r.maxDD, 0)}</b> depuis le plus haut${r.deadline ? `, en <b>${r.deadline} semaines</b> maximum` : ' (pas de limite de temps)'}. Le compte suit l'allocation cible ci-dessous.</div>
        <div class="row mt"><button class="btn primary" data-act="prop-buy" ${S.cash >= r.fee || free ? '' : 'disabled'}>${free && S.cash < r.fee ? 'Challenge gratuit (période de grâce)' : 'Acheter le challenge (' + fmtMoney(r.fee) + ')'}</button>
        ${S.cash < r.fee && !free ? `<span class="small muted">Cash insuffisant : challenge gratuit dans ${p.cooldownUntil - S.week} sem.</span>` : ''}
        <span class="small muted">Tentatives : ${p.attempts}</span></div>`;
    } else if (p.phase === 'challenge') {
      body = `<div class="kv"><span class="muted">Compte</span><b class="num">${fmtMoney(p.equity)}</b></div>
        <div class="kv"><span class="muted">Gain / objectif</span><span class="num ${cls(Prop.gain())}">${fmtPct(Prop.gain(), 1, true)} / ${fmtPct(r.target, 0, true)}</span></div>
        <div class="bar"><div style="width:${clamp(Prop.gain() / r.target, 0, 1) * 100}%"></div></div>
        <div class="kv mt"><span class="muted">Drawdown / limite</span><span class="num ${Prop.dd() > r.maxDD * 0.6 ? 'red' : ''}">${fmtPct(Prop.dd(), 1)} / ${fmtPct(r.maxDD, 0)}</span></div>
        <div class="bar"><div style="width:${clamp(Prop.dd() / r.maxDD, 0, 1) * 100}%;background:var(--red)"></div></div>
        <div class="kv mt"><span class="muted">Frais de transaction (sem. / total)</span><span class="num">${fmtMoney(p.lastFee || 0)} / ${fmtMoney(p.fees || 0)}</span></div>
        ${r.deadline ? `<div class="kv mt"><span class="muted">Temps</span><span class="num">${S.week - p.startWeek} / ${r.deadline} sem.</span></div>` : ''}
        <div class="small muted mt">Astuce : le drawdown est éliminatoire. Une allocation Équilibrée ou Prudente passe plus sûrement qu'un pari Dynamique.</div>`;
    } else {
      body = `<div class="kv"><span class="muted">Compte financé</span><b class="num">${fmtMoney(p.equity)}</b> <span class="small muted">(base ${fmtMoney(p.size)})</span></div>
        <div class="kv"><span class="muted">Gain en cours</span><span class="num ${cls(Prop.gain())}">${fmtPct(Prop.gain(), 1, true)} · versement de ${fmtPct(CONFIG.PROP.split, 0)} toutes les ${CONFIG.PROP.payoutEvery} sem.</span></div>
        <div class="kv"><span class="muted">Drawdown / limite</span><span class="num ${Prop.dd() > r.maxDD * 0.6 ? 'red' : ''}">${fmtPct(Prop.dd(), 1)} / ${fmtPct(r.maxDD, 0)}</span></div>
        <div class="kv"><span class="muted">Track record</span><span class="num ${cls(Prop.trackAnnual())}">${fmtPct(Prop.trackAnnual(), 1, true)}/an sur ${p.fundedWeeks} sem.</span></div>
        <div class="kv"><span class="muted">Gains encaissés</span><span class="num green">${fmtMoney(p.payouts)}</span></div>
        <div class="kv"><span class="muted">Frais de transaction (sem. / total)</span><span class="num">${fmtMoney(p.lastFee || 0)} / ${fmtMoney(p.fees || 0)}</span></div>
        ${p.launched ? '<div class="row mt"><button class="btn small" data-act="prop-quit">Quitter la prop firm</button></div>' : `<div class="small muted mt">Lancement du fonds possible après ${r.gradWeeks} semaines financées avec un track record positif (${p.fundedWeeks}/${r.gradWeeks}). Un bon track record donne plus de réputation et de premiers clients.</div>`}`;
    }
    const title = { idle: '🎯 Prop firm : challenge', challenge: '🎯 Challenge en cours', funded: '💼 Compte financé' }[p.phase];
    return `<div class="card" style="margin-bottom:10px;border-color:var(--accent)"><h4>${title}</h4>${body}</div>`;
  },
  updateAllocPreview() {
    const f = S.fund;
    RISKY.forEach(k => { const el = this.$('tgt-' + k); if (el) el.textContent = f.target[k] + ' %'; });
    const c = this.$('tgtCash'); if (c) c.textContent = Portfolio.targetCash() + ' %';
    const tw = Object.fromEntries(RISKY.map(k => [k, f.target[k] / 100])); tw.cash = Math.max(0, Portfolio.targetCash() / 100);
    const st = this.$('tgtStack'); if (st) st.innerHTML = this.stackBar(tw);
  },

  /* ---------- Onglet Équipe ---------- */
  tabTeam() {

        <div class="kv small"><span class="muted">Salaire</span><span class="num">${fmtMoney(Team.salary(emp) * 52)}/an <span class="muted">(${fmtMoney(Team.salary(emp))}/sem)</span></span></div>
        <div class="kv small"><span class="muted">Puissance</span><span class="num">${fmtNum(Team.power(emp), 1)}</span></div>

        <div class="gauge"><div style="width:${emp.morale ?? 70}%;background:${(emp.morale ?? 70) < 40 ? 'var(--red)' : (emp.morale ?? 70) < 60 ? 'var(--amber)' : 'var(--green)'}"></div></div>
