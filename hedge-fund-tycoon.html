<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedge Fund Tycoon</title>
<!--
=============================================================================
  HEDGE FUND TYCOON — jeu tycoon financier, fichier unique (HTML + CSS + JS)
=============================================================================
  COMMENT LANCER LE JEU
  ---------------------
  1. Double-cliquez sur « hedge-fund-tycoon.html » : il s'ouvre dans votre
     navigateur (Chrome, Firefox, Edge ou Safari récents).
  2. Aucune installation, aucun serveur, aucune étape de build.
  3. Le graphique de NAV utilise Chart.js (CDN jsDelivr). Sans connexion
     Internet, un graphique de secours simplifié est dessiné et le jeu
     fonctionne normalement.
  4. La partie est sauvegardée dans le localStorage du navigateur :
     automatiquement toutes les 4 semaines et à chaque déménagement,
     et manuellement via le bouton 💾. Le bouton 📂 recharge la sauvegarde.
  5. Raccourci clavier : barre d'espace = « Semaine suivante ».

  ORGANISATION DU CODE (script principal, en bas du fichier)
  ----------------------------------------------------------
   1. CONFIG        constantes d'équilibrage (à ajuster ici)
   2. UTILS         aléatoire, formatage, maths
   3. STATE         modèle d'état + création d'une partie
   4. MARKET        prix, régimes markoviens, corrélations
   5. PORTFOLIO     positions, allocation cible, frais, stop-loss
   6. TEAM          employés, recrutement, formation, effets
   7. INVESTORS     clients, flux, frais de gestion / performance
   8. RISK          risque, conformité, réputation, margin call, amendes
   9. EVENTS        cartes événements à choix multiples
  10. PROGRESSION   paliers / locaux, améliorations, victoire / défaite
  11. GAME          boucle de jeu (tick hebdomadaire)
  12. SAVE          sauvegarde localStorage + legacy
  13. UI            rendu, onglets, modales, toasts, graphique
  14. MAIN          démarrage
=============================================================================
-->
<style>
  :root {
    --bg: #0b0f17;
    --bg2: #121826;
    --panel: rgba(20, 26, 40, 0.88);
    --panel2: rgba(28, 36, 54, 0.9);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6e9f0;
    --muted: #8b95a8;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --accent: #d9a066;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    transition: background 1s ease;
  }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .amber { color: var(--amber); }
  .accent { color: var(--accent); }
  h1, h2, h3, h4 { margin: 0; }
  h3 { font-size: 15px; margin-bottom: 8px; }
  h4 { font-size: 13px; margin-bottom: 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  /* Décor de fond : grande icône du local, change à chaque palier */
  #decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #decorIcon { position: absolute; right: -40px; bottom: -60px; font-size: 420px; opacity: 0.05; filter: grayscale(0.3); transition: opacity 1s; }
  #app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; }

  /* Barre du haut */
  .topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 20px; letter-spacing: .02em; }
  .logo { font-size: 28px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit; transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); color: #111; font-weight: 700; border-color: transparent; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
  .btn.danger { border-color: rgba(248,113,113,.5); color: var(--red); }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .btn.on { border-color: var(--green); color: var(--green); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; backdrop-filter: blur(6px); }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }

  /* Palier */
  .tierbar { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .tier-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .tier-badge .ic { font-size: 26px; }
  .tier-badge .lvl { background: var(--accent); color: #111; border-radius: 6px; padding: 2px 7px; font-size: 12px; }
  .tier-progress { flex: 1; min-width: 200px; }
  .bar { height: 8px; background: rgba(255,255,255,.08); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s; }

  /* Indicateurs */
  .stats { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat .lab { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .val { font-size: 17px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .sub { font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gauge { height: 4px; background: rgba(255,255,255,.08); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .gauge > div { height: 100%; border-radius: 3px; }

  /* Graphique */
  .chartpanel { margin-bottom: 10px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .chartwrap { position: relative; height: 220px; }
  #chartMsg { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Onglets */
  .tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 8px; scrollbar-width: thin; }
  .tab { background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; font-size: 13px; font-family: inherit; }
  .tab.active { color: var(--text); background: var(--panel); border-color: var(--border); }
  .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); margin-left: 5px; vertical-align: middle; }

  .grid { display: grid; gap: 10px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .mt { margin-top: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,.05); }
  .kv:last-child { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: rgba(255,255,255,.08); }
  .pill.g { background: rgba(52,211,153,.15); color: var(--green); }
  .pill.r { background: rgba(248,113,113,.15); color: var(--red); }
  .pill.a { background: rgba(251,191,36,.15); color: var(--amber); }
  .pill.b { background: rgba(96,165,250,.15); color: var(--blue); }

  /* Cartes d'actifs */
  .asset { position: relative; }
  .asset .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .asset .name { font-weight: 700; }
  .asset .price { font-size: 18px; font-weight: 700; }
  .asset svg { width: 100%; height: 40px; display: block; margin: 6px 0; }
  .locked { opacity: .45; }

  /* Allocation */
  .stack { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.06); }
  .stack > div { height: 100%; transition: width .3s; min-width: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-size: 11px; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 4px; vertical-align: -1px; }
  .alloc-row { display: grid; grid-template-columns: 170px 30px 1fr 30px 70px 70px 110px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .alloc-row:last-child { border-bottom: none; }
  .alloc-row input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], input[type=number] { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; font-family: inherit; font-size: 12px; }

  /* Équipe */
  .emp .title { font-weight: 700; }
  .traits { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }

  /* Journal */
  .journal { max-height: 520px; overflow-y: auto; }
  .jline { padding: 5px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; font-size: 13px; }
  .jline .w { color: var(--muted); min-width: 74px; }
  .jline.good .t { color: var(--green); }
  .jline.bad .t { color: var(--red); }
  .jline.warn .t { color: var(--amber); }
  .jline.tier .t { color: var(--accent); font-weight: 700; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.t th, table.t td { padding: 5px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  table.t th { color: var(--muted); font-weight: 600; }
  table.t tr.cur td { background: rgba(255,255,255,.05); color: var(--accent); font-weight: 700; }
  .tablewrap { overflow-x: auto; }

  /* Toasts */
  #toasts { position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; flex-direction: column; gap: 6px; max-width: min(360px, calc(100vw - 24px)); }
  .toast { background: var(--panel2); border: 1px solid var(--border); border-left: 4px solid var(--blue); border-radius: 8px; padding: 9px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.4); animation: tin .25s ease; }
  .toast.good { border-left-color: var(--green); }
  .toast.bad { border-left-color: var(--red); }
  .toast.warn { border-left-color: var(--amber); }
  .toast.tier { border-left-color: var(--accent); }
  @keyframes tin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Modales */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #151c2b; border: 1px solid var(--border); border-radius: 14px; max-width: 620px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal h2 { font-size: 20px; margin-bottom: 8px; }
  .modal .icon { font-size: 40px; }
  .choice { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 10px 12px; }
  .choice b { display: block; margin-bottom: 3px; }
  .choice .hint { font-size: 12px; color: var(--muted); }
  .diffopt { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .diffopt label { flex: 1; min-width: 200px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; }
  .diffopt input { margin-right: 6px; }

  /* Fondu au noir lors d'un déménagement */
  #fade { position: fixed; inset: 0; background: #000; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .9s ease; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; text-align: center; }
  #fade.show { opacity: 1; pointer-events: all; }
  #fade .big { font-size: 90px; }
  #fade .ttl { font-size: 26px; font-weight: 700; margin-top: 10px; }

  /* Responsive */
  @media (max-width: 1100px) {
    .stats { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  .alloc-row .a-info { display: contents; }
  @media (max-width: 760px) {
    #app { padding: 8px 16px 40px; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g2, .g3, .g4 { grid-template-columns: 1fr; }
    .chartwrap { height: 170px; }
    .brand h1 { font-size: 17px; }
    #decorIcon { font-size: 260px; }
    /* Ligne d'allocation sur 3 rangées : nom / − curseur + / infos */
    .alloc-row { grid-template-columns: 30px minmax(0, 1fr) 30px; }
    .alloc-row .a-name { grid-column: 1 / 4; }
    .alloc-row .a-info { grid-column: 1 / 4; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
    #toasts .toast:nth-last-child(n+4) { display: none; }
  }
</style>
</head>
<body>
<div id="decor"><span id="decorIcon">🔧</span></div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">📊</span>
      <div>
        <h1>Hedge Fund Tycoon</h1>
        <div id="fundName" class="muted small">—</div>
      </div>
    </div>
    <div class="controls">
      <button id="btnNext" class="btn primary" title="Barre d'espace">▶ Semaine suivante</button>
      <button id="btnAuto" class="btn" title="Avance automatique">⏩ Auto : OFF</button>
      <button id="btnSave" class="btn" title="Sauvegarder">💾</button>
      <button id="btnLoad" class="btn" title="Charger la sauvegarde">📂</button>
      <button id="btnSettings" class="btn" title="Paramètres">⚙️</button>
    </div>
  </header>

  <section id="tierBar" class="panel tierbar"></section>
  <section id="stats" class="stats"></section>

  <section class="panel chartpanel">
    <div class="chart-head">
      <h3 style="margin:0">Valeur liquidative (NAV par part) &amp; AUM</h3>
      <div id="chartLegend" class="small muted"></div>
    </div>
    <div class="chartwrap"><canvas id="navChart"></canvas></div>
    <div id="chartMsg"></div>
  </section>

  <nav class="tabs" id="tabs"></nav>
  <main id="tabContent" class="panel"></main>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>
<div id="fade"><div class="big" id="fadeIcon"></div><div class="ttl" id="fadeTitle"></div><div class="muted" id="fadeSub"></div></div>

<script>
'use strict';

/* =============================================================================
   1. CONFIG — constantes d'équilibrage
   -----------------------------------------------------------------------------
   Toutes les valeurs « magiques » du jeu sont ici. Les rendements et
   volatilités sont ANNUELS ; le moteur les convertit en hebdomadaire :
     rendement hebdo = mu / 52 + vol * z / sqrt(52)   (z ~ N(0,1) corrélé)
   ============================================================================= */
const CONFIG = {
  VERSION: 1,
  SAVE_KEY: 'hft_save_v1',
  LEGACY_KEY: 'hft_legacy_v1',
  WEEKS_PER_YEAR: 52,

  // --- Démarrage ---------------------------------------------------------
  START_CASH: 100,              // cash de la société de gestion
  START_REPUTATION: 10,
  START_COMPLIANCE: 65,
  START_NAVPS: 100,             // NAV par part initiale

  // --- Frais & financement ------------------------------------------------
  MGMT_FEE: 0.02,               // 2 %/an, prélevé chaque semaine (prorata 1/52)
  PERF_FEE: 0.20,               // 20 % des gains au-dessus du high-water mark
  PERF_FEE_PERIOD: 13,          // cristallisation trimestrielle
  BORROW_RATE: 0.05,            // coût du levier (cash négatif du fonds)
  SHORT_COST: 0.01,             // coût d'emprunt des titres vendus à découvert
  CASH_RATE: 0.0,               // le cash ne rapporte rien (sécurité)
  OVERDRAFT_RATE: 0.12,         // découvert de la société de gestion
  JUMP_PROB: 0.015,             // probabilité d'un choc « queue épaisse »
  JUMP_MULT: 2.5,

  // --- Difficulté -----------------------------------------------------------
  MODES: {
    casual: {
      label: 'Casual', volMult: 0.8, negDriftMult: 0.7, eventInterval: [5, 8], eventSeverity: 0.6,
      complexityPerTier: 1.5, fineProb: 0.06, licenseWeeks: 10, investorDemand: 1.0
    },
    intermediate: {
      label: 'Intermédiaire', volMult: 1.0, negDriftMult: 1.0, eventInterval: [3, 6], eventSeverity: 1.0,
      complexityPerTier: 3.2, fineProb: 0.12, licenseWeeks: 6, investorDemand: 0.9
    }
  },

  // --- Actifs ----------------------------------------------------------------
  // mu/vol : valeurs de référence (moyenne de long terme). fee : frais de
  // transaction selon la liquidité. tier : palier de déblocage.
  ASSETS: {
    equities:    { name: 'Actions',            icon: '📈', mu: 0.08, vol: 0.16, fee: 0.0005, liq: 'Très liquide', tier: 1, shortable: true,  color: '#34d399', alphaInfo: true },
    bonds:       { name: 'Obligations',        icon: '🏦', mu: 0.03, vol: 0.05, fee: 0.0008, liq: 'Liquide',      tier: 1, shortable: false, color: '#60a5fa', alphaInfo: false },
    commodities: { name: 'Matières premières', icon: '🛢️', mu: 0.05, vol: 0.20, fee: 0.0020, liq: 'Moyenne',      tier: 4, shortable: true,  color: '#f59e0b', alphaInfo: true },
    fx:          { name: 'Devises',            icon: '💱', mu: 0.015, vol: 0.08, fee: 0.0003, liq: 'Très liquide', tier: 5, shortable: true,  color: '#a78bfa', alphaInfo: false },
    crypto:      { name: 'Crypto',             icon: '🪙', mu: 0.20, vol: 0.70, fee: 0.0050, liq: 'Faible',       tier: 6, shortable: true,  color: '#f472b6', alphaInfo: true },
    derivatives: { name: 'Dérivés (vente de vol.)', icon: '🧮', mu: 0.10, vol: 0.22, fee: 0.0030, liq: 'Moyenne', tier: 8, shortable: false, color: '#2dd4bf', alphaInfo: false },
    emerging:    { name: 'Marchés émergents',  icon: '🌏', mu: 0.10, vol: 0.24, fee: 0.0035, liq: 'Faible',       tier: 11, shortable: true, color: '#fb923c', alphaInfo: true },
    cash:        { name: 'Cash',               icon: '💵', mu: 0.0,  vol: 0.0,  fee: 0,      liq: 'Immédiate',    tier: 1, shortable: false, color: '#94a3b8', alphaInfo: false }
  },

  // --- Régimes de marché -------------------------------------------------------
  // mu : rendement annuel espéré de chaque actif dans ce régime.
  // volMult : multiplicateur de volatilité. corrStress : rapprochement des
  // corrélations vers la matrice de stress (0 = normal, 1 = tout corrélé).
  REGIMES: {
    bull:   { name: 'Haussier', icon: '🐂', volMult: 0.85, corrStress: 0.0,
              mu: { equities: 0.20, bonds: 0.025, commodities: 0.12, fx: 0.012, crypto: 0.70, derivatives: 0.16, emerging: 0.27 } },
    range:  { name: 'Latéral',  icon: '↔️', volMult: 0.8, corrStress: 0.0,
              mu: { equities: 0.08, bonds: 0.035, commodities: 0.06, fx: 0.01, crypto: 0.30, derivatives: 0.14, emerging: 0.09 } },
    bear:   { name: 'Baissier', icon: '🐻', volMult: 1.3, corrStress: 0.25,
              mu: { equities: -0.10, bonds: 0.05, commodities: -0.03, fx: 0.02, crypto: -0.30, derivatives: 0.0, emerging: -0.15 } },
    crisis: { name: 'Crise',    icon: '🔥', volMult: 2.2, corrStress: 0.65,
              mu: { equities: -0.45, bonds: 0.08, commodities: -0.25, fx: 0.03, crypto: -1.20, derivatives: -0.90, emerging: -0.60 } },
    bubble: { name: 'Bulle',    icon: '🫧', volMult: 1.15, corrStress: 0.2,
              mu: { equities: 0.35, bonds: 0.0, commodities: 0.15, fx: 0.0, crypto: 2.20, derivatives: 0.20, emerging: 0.40 } }
  },
  // Transitions markoviennes hebdomadaires (chaque ligne somme à 1)
  REGIME_TRANSITIONS: {
    bull:   { bull: 0.974, range: 0.014, bear: 0.006, crisis: 0.002, bubble: 0.004 },
    range:  { bull: 0.022, range: 0.964, bear: 0.008, crisis: 0.002, bubble: 0.004 },
    bear:   { bull: 0.010, range: 0.040, bear: 0.940, crisis: 0.010, bubble: 0.000 },
    crisis: { bull: 0.000, range: 0.040, bear: 0.100, crisis: 0.860, bubble: 0.000 },
    bubble: { bull: 0.030, range: 0.000, bear: 0.000, crisis: 0.060, bubble: 0.910 }
  },
  // Corrélations « normales » entre actifs risqués
  BASE_CORR: {
    'equities|bonds': -0.2, 'equities|commodities': 0.3, 'equities|fx': 0.1, 'equities|crypto': 0.35, 'equities|derivatives': 0.6, 'equities|emerging': 0.7,
    'bonds|commodities': -0.1, 'bonds|fx': 0.0, 'bonds|crypto': -0.05, 'bonds|derivatives': -0.2, 'bonds|emerging': -0.1,
    'commodities|fx': 0.2, 'commodities|crypto': 0.2, 'commodities|derivatives': 0.25, 'commodities|emerging': 0.45,
    'fx|crypto': 0.1, 'fx|derivatives': 0.05, 'fx|emerging': 0.3,
    'crypto|derivatives': 0.3, 'crypto|emerging': 0.35,
    'derivatives|emerging': 0.5
  },
  // Matrice de stress (crise) : actifs risqués très corrélés, obligations refuge
  STRESS_CORR: { risky: 0.85, fx: 0.3, bondsRisky: -0.4, bondsFx: -0.14 },

  // --- Risque -----------------------------------------------------------------

/* =============================================================================
   2. UTILS — aléatoire (graine sauvegardée), formatage, maths
   ============================================================================= */
const RNG = {
  seed: (Date.now() ^ 0x5f3759df) >>> 0,
  next() { // mulberry32
    let t = (this.seed = (this.seed + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
};
const rng = () => RNG.next();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rand = (a, b) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function poisson(l) {
  if (l <= 0) return 0;
  if (l > 30) return Math.max(0, Math.round(l + Math.sqrt(l) * gauss()));
  const L = Math.exp(-l);
  let k = 0, p = 1;
  do { k++; p *= rng(); } while (p > L);
  return k - 1;
}
function pickWeighted(obj) {
  const entries = Object.entries(obj).filter(([, w]) => w > 0);
  const total = entries.reduce((a, [, w]) => a + w, 0);
  let r = rng() * total;
  for (const [k, w] of entries) { r -= w; if (r <= 0) return k; }
  return entries.length ? entries[entries.length - 1][0] : null;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* Formatage monétaire : séparateurs de milliers puis notation k / M / Md / T */
function fmtNum(x, d = 0) { return x.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtMoney(x) {
  if (x === null || x === undefined || !isFinite(x)) return x === Infinity ? '∞' : '—';
  const s = x < 0 ? '−' : '';
  const a = Math.abs(x);
  let str;
  if (a < 10) str = fmtNum(a, 2) + ' $';
  else if (a < 1e5) str = fmtNum(Math.round(a)) + ' $';
  else if (a < 1e6) str = fmtNum(a / 1e3, 1) + ' k$';
  else if (a < 1e9) str = fmtNum(a / 1e6, 2) + ' M$';
  else if (a < 1e12) str = fmtNum(a / 1e9, 2) + ' Md$';
  else str = fmtNum(a / 1e12, 2) + ' T$';
  return s + str;
}
function fmtShort(x) { // pour axes de graphique
  const a = Math.abs(x);
  if (a >= 1e12) return fmtNum(x / 1e12, 1) + ' T';
  if (a >= 1e9) return fmtNum(x / 1e9, 1) + ' Md';
  if (a >= 1e6) return fmtNum(x / 1e6, 1) + ' M';
  if (a >= 1e3) return fmtNum(x / 1e3, 0) + ' k';
  return fmtNum(x, 0);
}
function fmtPct(x, d = 1, sign = false) {
  if (!isFinite(x)) return '—';
  const v = x * 100;
  const s = sign && v > 0 ? '+' : (v < 0 ? '−' : '');
  return s + fmtNum(Math.abs(v), d) + ' %';
}
function fmtSigned(x, d = 0) { return (x > 0 ? '+' : x < 0 ? '−' : '') + fmtNum(Math.abs(x), d); }
function cls(x) { return x > 0 ? 'green' : x < 0 ? 'red' : 'muted'; }

/* Cholesky (matrice de corrélation -> facteur triangulaire) avec garde-fou */
function cholesky(A) {
  const n = A.length;
  const L = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let sum = A[i][j];
      for (let k = 0; k < j; k++) sum -= L[i][k] * L[j][k];
      if (i === j) L[i][j] = Math.sqrt(Math.max(sum, 1e-6));
      else L[i][j] = sum / L[j][j];
    }
  }
  return L;
}

/* =============================================================================
   4. MARKET — prix, régimes, corrélations
   ============================================================================= */
const Market = {
  _cholCache: {},

  /* Matrice de corrélation d'un régime : mélange matrice normale / stress */
  corrMatrix(regime) {
    const stress = CONFIG.REGIMES[regime].corrStress;
    const n = RISKY.length;
    const M = Array.from({ length: n }, () => new Array(n).fill(0));
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (i === j) { M[i][j] = 1; continue; }
        const a = RISKY[i], b = RISKY[j];
        const base = CONFIG.BASE_CORR[a + '|' + b] ?? CONFIG.BASE_CORR[b + '|' + a] ?? 0;
        let st;
        const sc = CONFIG.STRESS_CORR;
        const isB = x => x === 'bonds', isF = x => x === 'fx';
        if ((isB(a) && isF(b)) || (isF(a) && isB(b))) st = sc.bondsFx;
        else if (isB(a) || isB(b)) st = sc.bondsRisky;
        else if (isF(a) || isF(b)) st = sc.fx;
        else st = sc.risky;
        M[i][j] = base + (st - base) * stress;
      }
    }
    return M;
  },
  chol(regime) {
    if (!this._cholCache[regime]) this._cholCache[regime] = cholesky(this.corrMatrix(regime));
    return this._cholCache[regime];
  },

  /* Rendement annuel espéré d'un actif dans le régime courant (+ modificateurs) */
  expectedMu(k, regime) {
    const m = S.market;
    const mode = CONFIG.MODES[S.difficulty];
    let mu = CONFIG.REGIMES[regime || m.regime].mu[k];
    if (mu < 0) mu *= mode.negDriftMult;
    for (const md of m.mods) if (md.k === k || md.k === 'all') mu += md.mu;
    return mu;
  },
  effVol(k, regime) {
    const mode = CONFIG.MODES[S.difficulty];
    return CONFIG.ASSETS[k].vol * CONFIG.REGIMES[regime || S.market.regime].volMult * mode.volMult;
  },

  /* Transition markovienne du régime */
  stepRegime(silent) {
    const m = S.market;
    const prev = m.regime;
    if (m.forced && m.forced.weeks > 0) {
      m.forced.weeks--;
      m.regime = m.forced.regime;
      if (m.forced.weeks <= 0) {
        const after = m.forced.after;
        m.forced = null;
        if (after && rng() < after.p) m.regime = after.regime;
      }
    } else {
      m.regime = pickWeighted(CONFIG.REGIME_TRANSITIONS[m.regime]) || m.regime;
    }
    if (m.regime !== prev) {
      m.regimeWeeks = 0;
      if (!silent) {
        const r = CONFIG.REGIMES[m.regime];
        const type = m.regime === 'crisis' ? 'bad' : (m.regime === 'bull' ? 'good' : 'warn');
        Game.log(`Changement de régime de marché : ${r.icon} ${r.name}.`, type);
      }
      return prev;
    }
    m.regimeWeeks++;
    return null;
  },

  /* Une semaine de marché. Retourne les rendements dans m.lastReturns. */
  step(silent) {
    const m = S.market;
    const prev = this.stepRegime(silent);
    // Chocs de transition : éclatement de bulle / entrée en crise
    const jump = {};
    if (prev && m.regime === 'crisis') {
      const sev = CONFIG.MODES[S.difficulty].eventSeverity;
      if (prev === 'bubble') {
        Object.assign(jump, { crypto: -0.25, equities: -0.08, emerging: -0.10, commodities: -0.06, derivatives: -0.10 });
        if (!silent) { Game.log('💥 La bulle éclate ! Krach sur les actifs risqués.', 'bad'); UI.toast('💥 La bulle éclate !', 'bad'); }
      } else {
        Object.assign(jump, { equities: -0.05, emerging: -0.07, crypto: -0.10, derivatives: -0.08, commodities: -0.04 });
        if (!silent) UI.toast('🔥 Le marché entre en crise.', 'bad');
      }
      for (const k in jump) jump[k] *= sev;
      if (!silent) S.stats.crises++;
    }
    const mode = CONFIG.MODES[S.difficulty];
    const L = this.chol(m.regime);
    const z = RISKY.map(() => gauss());
    RISKY.forEach((k, i) => {
      let e = 0;
      for (let j = 0; j <= i; j++) e += L[i][j] * z[j];
      if (rng() < CONFIG.JUMP_PROB) e *= CONFIG.JUMP_MULT;
      const mu = this.expectedMu(k);
      const vol = this.effVol(k);
      let r = mu / 52 + vol * e / Math.sqrt(52);
      if (jump[k]) r = (1 + r) * (1 + jump[k]) - 1;
      r = clamp(r, -0.6, 1.5);
      m.lastMeans[k] = mu / 52;
      m.lastReturns[k] = r;
      m.prices[k] *= 1 + r;
      m.hist[k].push(m.prices[k]);
      if (m.hist[k].length > 52) m.hist[k].shift();
    });
    // Décrément des modificateurs temporaires (événements)
    m.mods.forEach(md => md.weeks--);
    m.mods = m.mods.filter(md => md.weeks > 0);
    if (!silent) this.updatePerception();
  },

  /* L'information visible dépend de la qualité d'information (analystes, quants) */
  updatePerception() {
    const m = S.market;
    const q = Team.infoQuality();
    m.perceived = rng() < 0.45 + 0.55 * q ? m.regime : pick(Object.keys(CONFIG.REGIMES).filter(r => r !== m.regime));
    m.perceivedConf = 0.45 + 0.55 * q;
    RISKY.forEach(k => {
      const noise = gauss() * 0.30 * (1 - q) * (0.5 + CONFIG.ASSETS[k].vol);
      m.forecasts[k] = this.expectedMu(k) + noise;
    });
  },

  addModifier(k, mu, weeks) { S.market.mods.push({ k, mu, weeks }); },
  forceRegime(regime, weeks, after) { S.market.forced = { regime, weeks, after }; S.market.regime = regime; S.market.regimeWeeks = 0; },

  /* Choc instantané (événements) : prix + positions du fonds */
  shock(map) {
    for (const k in map) {
      const pct = map[k];
      S.market.prices[k] *= 1 + pct;
      const h = S.market.hist[k]; if (h.length) h[h.length - 1] = S.market.prices[k];
      S.fund.positions[k] *= 1 + pct;
    }
    Portfolio.syncNavps();
  },

  isUnlocked(k) {
    if (k === 'cash') return true;
    return S.tier >= CONFIG.ASSETS[k].tier;
  },

  /* Génère un historique de départ (pour les sparklines) */
  warmup(weeks) { for (let i = 0; i < weeks; i++) this.step(true); this.updatePerception(); }
};

/* =============================================================================
   5. PORTFOLIO — positions, allocation cible, frais, stop-loss, levier
   ============================================================================= */
const Portfolio = {
  aum() { let v = S.fund.cash; for (const k of RISKY) v += S.fund.positions[k]; return v; },
  totalShares() { let s = 0; for (const inv of S.investors.list) s += inv.shares; return s; },
  gross() { const A = this.aum(); if (A <= 0) return 0; let g = 0; for (const k of RISKY) g += Math.abs(S.fund.positions[k]); return g / A; },
  weights() {
    const A = this.aum(); const w = {};
    for (const k of RISKY) w[k] = A > 0 ? S.fund.positions[k] / A : S.fund.target[k] / 100;
    w.cash = A > 0 ? S.fund.cash / A : this.targetCash() / 100;
    return w;
  },
  targetCash() { let s = 0; for (const k of RISKY) s += S.fund.target[k]; return 100 - s; },
  targetGross() { let s = 0; for (const k of RISKY) s += Math.abs(S.fund.target[k]); return s; },
  isCasual() { return S.difficulty === 'casual'; },
  maxLeverage() { if (this.isCasual()) return 1; if (S.tier >= 7) return 5; if (S.tier >= 5) return 2; return 1; },
  shortAllowed() { return !this.isCasual() && S.tier >= 5; },
  autoAvailable() { return this.isCasual() || Team.hasRole('trader') || Progression.upg('autostrat') > 0; },
  minWeight(k) { return this.shortAllowed() && CONFIG.ASSETS[k].shortable ? -50 : 0; },

  /* Recalcule la NAV/part à partir de l'AUM et du nombre de parts */
  syncNavps() {
    const sh = this.totalShares();
    if (sh > 1e-12) S.fund.navps = this.aum() / sh;
  },

  /* Normalise l'allocation cible : actifs verrouillés à 0, bornes, levier max */
  normalizeTarget() {
    const f = S.fund;
    f.leverage = clamp(f.leverage, 1, this.maxLeverage());
    if (![1, 2, 5].includes(f.leverage)) f.leverage = 1;
    for (const k of RISKY) {
      if (!Market.isUnlocked(k)) { f.target[k] = 0; continue; }
      f.target[k] = clamp(Math.round(f.target[k]), this.minWeight(k), f.leverage * 100);
    }
    const g = this.targetGross(), cap = f.leverage * 100;
    if (g > cap) for (const k of RISKY) f.target[k] = Math.trunc(f.target[k] * cap / g);
  },

  feeReduction() {
    const e = Team.effects();
    return clamp(e.fee + Progression.upg('software') * 0.15 + Progression.tierBonus('trading'), 0, 0.75);
  },
  feeRate(k) { return CONFIG.ASSETS[k].fee * (1 - this.feeReduction()); },

  /* Coût estimé d'un rééquilibrage vers la cible */
  estimateRebalance() {
    const A = this.aum(); if (A <= 0) return 0;
    let fee = 0;
    for (const k of RISKY) fee += Math.abs(S.fund.target[k] / 100 * A - S.fund.positions[k]) * this.feeRate(k);
    return fee;
  },
  drift() {
    const A = this.aum(); if (A <= 0) return 0;
    let d = 0;
    for (const k of RISKY) d = Math.max(d, Math.abs(S.fund.positions[k] / A * 100 - S.fund.target[k]));
    return d;
  },

  /* Exécute le rééquilibrage vers l'allocation cible (frais selon liquidité) */
  rebalance(manual = false) {
    this.normalizeTarget();
    const f = S.fund, A = this.aum();
    if (A <= 0) return 0;
    let fee = 0, invested = 0;
    for (const k of RISKY) {
      const desired = f.target[k] / 100 * A;
      const trade = desired - f.positions[k];
      fee += Math.abs(trade) * this.feeRate(k);
      // Prix de référence du stop-loss : ouverture, retournement ou rééquilibrage manuel
      const opening = Math.abs(f.positions[k]) < 0.005 * A || Math.sign(desired) !== Math.sign(f.positions[k]);
      if ((manual && Math.abs(trade) > 0.005 * A) || opening) f.refPrice[k] = S.market.prices[k];
      f.positions[k] = desired;
      invested += desired;
    }
    f.cash = A - invested - fee;
    S.last.txFees += fee;
    this.syncNavps();
    return fee;
  },

  /* Multiplie toutes les lignes (flux proportionnels, frais) */
  scale(factor) {
    const f = S.fund;
    for (const k of RISKY) f.positions[k] *= factor;
    f.cash *= factor;
  },
  deposit(amount) {
    if (amount <= 0) return;
    const A = this.aum();
    if (A < 1e-6) {
      for (const k of RISKY) S.fund.positions[k] = 0;
      S.fund.cash = amount;
      this.rebalance();
    } else this.scale((A + amount) / A);
  },
  withdraw(amount) {
    const A = this.aum();
    if (A <= 0 || amount <= 0) return 0;
    amount = Math.min(amount, A);
    this.scale((A - amount) / A);
    return amount;
  },

  /* Étape 2 du tick : applique les rendements du marché au portefeuille */
  applyReturns() {
    const f = S.fund, m = S.market;
    const A0 = this.aum();
    const highRisk = S.risk > CONFIG.RISK_ALERT;
    let modelRet = 0, shortVal = 0;
    for (const k of RISKY) {
      let r = m.lastReturns[k];
      // Risque > 70 : volatilité effective accrue (écarts amplifiés de 20 %)
      if (highRisk) r = m.lastMeans[k] + (r - m.lastMeans[k]) * 1.2;
      const a = this.alpha(k) / 52;
      const pos = f.positions[k];
      f.positions[k] = pos + pos * r + Math.abs(pos) * a;
      if (pos < 0) shortVal += -pos;
      modelRet += f.target[k] / 100 * (r + a);
    }
    // Cash du fonds : rémunéré (0 %) ou emprunté (levier)
    if (f.cash >= 0) f.cash *= 1 + CONFIG.CASH_RATE / 52;
    else f.cash *= 1 + CONFIG.BORROW_RATE / 52;
    f.cash -= shortVal * CONFIG.SHORT_COST / 52;
    const tc = this.targetCash();
    if (tc < 0) modelRet -= -tc / 100 * CONFIG.BORROW_RATE / 52;

    const A1 = this.aum();
    if (A0 > 0 && A1 <= 0) { this.liquidate(); return; }
    if (this.totalShares() > 1e-12) this.syncNavps();
    else f.navps *= 1 + modelRet;
    S.last.fundReturn = A0 > 0 ? A1 / A0 - 1 : modelRet;
  },

  /* Alpha annuel : qualité d'information, quants, spécialités, stratégies auto */
  alpha(k) {
    const e = Team.effects();
    let a = 0;
    if (CONFIG.ASSETS[k].alphaInfo) a += Team.infoQuality() * 0.025;
    a += e.quantAlpha + (e.spec[k] || 0);
    if (Progression.upg('autostrat') > 0) a += 0.01;
    return a;
  },

  /* Fonds liquidé (levier excessif) : tous les investisseurs perdent tout */
  liquidate() {
    const f = S.fund;
    for (const k of RISKY) f.positions[k] = 0;
    f.cash = 0;
    S.investors.list = [];
    f.navps = CONFIG.START_NAVPS; f.hwm = f.navps; f.peakNavps = f.navps;
    S.reputation = Math.max(0, S.reputation - 30);
    Game.log('☠️ Le fonds a été entièrement liquidé (valeur nette négative).', 'bad');
    UI.toast('☠️ Fonds liquidé !', 'bad');
  },

  /* Étape 3 du tick : stop-loss, alertes de drawdown, rééquilibrage auto */
  weeklyTrading() {
    const f = S.fund, A = this.aum();
    if (A > 0 && !this.isCasual()) {
      for (const k of RISKY) {
        const sl = f.stopLoss[k], pos = f.positions[k];
        if (!sl || Math.abs(pos) < 1e-9 || !f.refPrice[k]) continue;
        const ch = S.market.prices[k] / f.refPrice[k] - 1;
        if ((pos > 0 && ch <= -sl) || (pos < 0 && ch >= sl)) {
          const fee = Math.abs(pos) * this.feeRate(k);
          f.cash += pos - fee;
          f.positions[k] = 0;
          f.target[k] = 0;
          S.last.txFees += fee;
          Game.log(`Stop-loss déclenché sur ${CONFIG.ASSETS[k].name} (${fmtPct(ch, 1, true)}). Position clôturée.`, 'warn');
          UI.toast(`🛑 Stop-loss : ${CONFIG.ASSETS[k].name}`, 'warn');
        }
      }
      this.syncNavps();
    }
    // Alerte de drawdown
    f.peakNavps = Math.max(f.peakNavps, f.navps);
    const dd = 1 - f.navps / f.peakNavps;
    if (dd >= f.ddAlert && !f.ddAlerted) {
      f.ddAlerted = true;
      Game.log(`⚠️ Alerte drawdown : la NAV est ${fmtPct(dd)} sous son plus haut.`, 'warn');
      UI.toast(`⚠️ Drawdown de ${fmtPct(dd)}`, 'warn');
    } else if (dd < f.ddAlert * 0.5) f.ddAlerted = false;
    // Rééquilibrage automatique (casual, ou trader embauché)
    if (A > 0 && f.autoRebalance && this.autoAvailable() && this.drift() > 2) this.rebalance();
  },

  drawdown() { return 1 - S.fund.navps / S.fund.peakNavps; },

  /* Déplace pct de la NAV vers un actif (utilisé par les événements) */
  shiftInto(k, pct) {
    if (!Market.isUnlocked(k)) k = 'equities';
    const f = S.fund;
    const room = f.leverage * 100 - this.targetGross();
    let add = Math.min(pct * 100, Math.max(0, room));
    // si plus de place, on prend sur les obligations
    if (add < pct * 100 && f.target.bonds > 0) {
      const take = Math.min(f.target.bonds, pct * 100 - add);
      f.target.bonds -= take; add += take;
    }
    f.target[k] += add;
    this.rebalance();
    return add;
  },
  /* Réduit toutes les lignes risquées d'une fraction (vente vers le cash) */
  derisk(frac, feeMult = 1) {
    const f = S.fund;
    for (const k of RISKY) f.target[k] = Math.trunc(f.target[k] * (1 - frac));
    let fee = 0;
    for (const k of RISKY) {
      const sell = f.positions[k] * frac;
      fee += Math.abs(sell) * this.feeRate(k) * feeMult;
      f.positions[k] -= sell;
      f.cash += sell;
    }
    f.cash -= fee;
    S.last.txFees += fee;
    this.syncNavps();
    return fee;
  },

  /* Préréglages d'allocation (adaptés aux actifs débloqués) */
  presets() {
    const u = k => Market.isUnlocked(k);
    return {
      prudent:   { label: '🛡️ Prudent',   t: { equities: 20, bonds: 60 } },
      equilibre: { label: '⚖️ Équilibré', t: Object.assign({ equities: 50, bonds: 35 }, u('commodities') ? { commodities: 5, bonds: 30 } : {}) },
      dynamique: { label: '🚀 Dynamique', t: Object.assign({ equities: 75, bonds: 15 }, u('commodities') ? { equities: 65, commodities: 10 } : {}, u('crypto') ? { equities: 60, crypto: 5 } : {}) }
    };
  },
  applyPreset(id) {
    const p = this.presets()[id]; if (!p) return;
    for (const k of RISKY) S.fund.target[k] = 0;
    Object.assign(S.fund.target, p.t);
    S.fund.preset = id;
    this.normalizeTarget();
  }
};

/* =============================================================================
   6. TEAM — employés, recrutement, formation, promotions, effets
   ============================================================================= */
const FIRST_NAMES = ['Camille', 'Léa', 'Hugo', 'Lucas', 'Chloé', 'Manon', 'Nathan', 'Inès', 'Jules', 'Sarah', 'Yanis', 'Emma', 'Louis', 'Jade', 'Adam', 'Zoé', 'Maxime', 'Alice', 'Karim', 'Sofia', 'Thomas', 'Mei', 'Ibrahima', 'Elena', 'Noah', 'Lina', 'Rayan', 'Clara'];
const LAST_NAMES = ['Martin', 'Bernard', 'Dubois', 'Lefèvre', 'Moreau', 'Laurent', 'Garcia', 'Nguyen', 'Rousseau', 'Fontaine', 'Benali', 'Mercier', 'Chevalier', 'Kowalski', 'Diallo', 'Rossi', 'Schmidt', 'Okafor', 'Tanaka', 'Leroy', 'Haddad', 'Silva'];

const Team = {
  _cache: null, _cacheKey: '',

  wageIndex() { return CONFIG.WAGE_INDEX[S.tier - 1]; },
  capacity() { return TIERS[S.tier - 1].cap; },
  roleUnlocked(r) { return S.tier >= ROLES[r].tier; },
  hasRole(r) { return S.team.employees.some(e => e.role === r); },
  power(e) { return e.level * CONFIG.RANK_POWER[e.rank]; },
  title(e) { return ROLES[e.role].titles[e.rank]; },
  salary(e) {
    let s = ROLES[e.role].salary * (1 + 0.12 * (e.level - 1)) * CONFIG.RANK_SALARY[e.rank] * this.wageIndex() * (e.salaryMult || 1);
    if (e.traits.includes('genie')) s *= 1.3;
    return s;
  },
  payroll() { return S.team.employees.reduce((a, e) => a + this.salary(e), 0); },
  invalidate() { this._cacheKey = ''; },

  /* Agrégation des effets de l'équipe (recalculée à la demande) */
  effects() {
    const key = S.week + '|' + S.tier + '|' + S.team.employees.map(e => e.id + ':' + e.level + ':' + e.rank).join(',');
    if (this._cache && key === this._cacheKey) return this._cache;
    const e = { info: 0, fee: 0, volRed: 0, riskPts: 0, compliance: 0, inflow: 0, rp: 0, recruit: 0, trainDisc: 0, quantAlpha: 0, conf: 0, spec: {} };
    for (const emp of S.team.employees) {
      const p = this.power(emp);
      const has = t => emp.traits.includes(t);
      const m = has('methodique') ? 1.1 : 1;
      switch (emp.role) {
        case 'analyst':
          e.info += p * m; e.rp += p * 0.35;
          if (emp.spec) e.spec[emp.spec] = (e.spec[emp.spec] || 0) + emp.level * 0.002;
          break;
        case 'trader':
          e.fee += p * 0.045 * (has('impulsif') ? 1.3 : 1) * (has('prudent') ? 0.85 : 1) * m;
          if (has('impulsif')) e.riskPts -= 2;
          break;
        case 'risk':
          e.volRed += p * 0.022 * (has('prudent') ? 1.3 : 1) * m;
          e.riskPts += p * 0.7 * m; e.compliance += p * 0.4;
          break;
        case 'sales':
          e.inflow += p * 0.05 * (has('charismatique') ? 1.5 : 1) * m;
          break;
        case 'hr':
          e.trainDisc += p * 0.03; e.recruit += p * 0.12;
          break;
        case 'compliance':
          e.compliance += p * 2.5 * (has('methodique') ? 1.3 : 1);
          break;
        case 'quant':
          e.info += p * 1.6 * m; e.rp += p * 0.7; e.quantAlpha += p * 0.0015;
          break;
      }
      if (has('genie')) e.rp += p * 0.3;
      if (has('charismatique')) e.conf += 0.15;
    }
    e.fee = Math.min(0.6, e.fee);
    e.volRed = Math.min(0.35, e.volRed + Progression.upg('riskengine') * 0.05);
    e.inflow = Math.min(2, e.inflow);
    e.trainDisc = Math.min(0.5, e.trainDisc);
    e.quantAlpha = Math.min(0.03, e.quantAlpha);
    this._cache = e; this._cacheKey = key;
    return e;
  },
  infoQuality() {
    const e = this.effects();
    return 1 - Math.exp(-(e.info + Progression.upg('data') * 3) / 12);
  },
  rpPerWeek() {
    const e = this.effects();
    return (1 + e.rp) * (1 + Progression.upg('training') * 0.1) * (1 + Progression.tierBonus('rp'));
  },

  /* Candidats */
  makeCandidate() {
    const roles = Object.keys(ROLES).filter(r => this.roleUnlocked(r));
    if (!roles.length) return null;
    const role = pick(roles);
    const e = this.effects();
    const lvl = clamp(Math.round(1 + rng() * (S.tier / 2.2) + e.recruit + Progression.tierBonus('recruit') * 5 + (rng() < 0.15 ? 1 : 0)), 1, 7);
    const traitKeys = Object.keys(TRAITS);
    const traits = [pick(traitKeys)];
    if (rng() < 0.35) { const t2 = pick(traitKeys); if (!traits.includes(t2)) traits.push(t2); }
    const specs = RISKY.filter(k => Market.isUnlocked(k) && CONFIG.ASSETS[k].alphaInfo);
    return {
      id: S.team.nextId++, name: pick(FIRST_NAMES) + ' ' + pick(LAST_NAMES), role, rank: 0, level: lvl, traits,
      spec: role === 'analyst' && specs.length ? pick(specs) : null, hiredWeek: null, salaryMult: 1
    };
  },
  refreshCandidates(force) {
    if (!force && S.week < S.team.nextRefresh) return;
    S.team.candidates = [];
    for (let i = 0; i < 3; i++) { const c = this.makeCandidate(); if (c) S.team.candidates.push(c); }
    S.team.nextRefresh = S.week + CONFIG.CANDIDATE_REFRESH;
  },
  headhunterCost() { return 3 * this.wageIndex(); },
  headhunt() {
    const c = this.headhunterCost();
    if (S.cash < c) return UI.toast('Cash insuffisant.', 'bad');
    S.cash -= c;
    this.refreshCandidates(true);
    UI.renderAll();
  },
  signingCost(c) { return this.salary(c) * CONFIG.SIGNING_WEEKS; },
  hire(id) {
    const c = S.team.candidates.find(x => x.id === id);
    if (!c) return;
    if (S.team.employees.length >= this.capacity()) return UI.toast('Capacité du local atteinte : déménagez pour recruter plus.', 'warn');
    const cost = this.signingCost(c);
    if (S.cash < cost) return UI.toast('Cash insuffisant pour la prime de signature.', 'bad');
    S.cash -= cost;
    c.hiredWeek = S.week;
    S.team.employees.push(c);
    S.team.candidates = S.team.candidates.filter(x => x.id !== id);
    this.invalidate();
    Game.log(`Recrutement : ${c.name}, ${this.title(c)} (niv. ${c.level}).`, 'good');
    UI.renderAll();
  },
  fire(id, free) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e) return;
    const sev = free ? 0 : this.salary(e) * CONFIG.SEVERANCE_WEEKS;
    S.cash -= sev;
    S.team.employees = S.team.employees.filter(x => x.id !== id);
    this.invalidate();
    Game.log(`Départ de ${e.name} (${this.title(e)})${sev ? ', indemnité ' + fmtMoney(sev) : ''}.`, 'warn');
    if (UI.enabled) UI.renderAll();
  },
  trainCost(e) {
    const disc = (1 - this.effects().trainDisc) * (1 - Progression.upg('training') * 0.2);
    return { rp: Math.round(4 * Math.pow(e.level, 1.4) * disc), cash: this.salary(e) * 3 * disc };
  },
  train(id) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e || e.level >= 10) return;
    const c = this.trainCost(e);
    if (S.rp < c.rp || S.cash < c.cash) return UI.toast('Ressources insuffisantes (recherche ou cash).', 'bad');
    S.rp -= c.rp; S.cash -= c.cash;
    e.level++;
    this.invalidate();
    Game.log(`Formation : ${e.name} passe niveau ${e.level}.`, 'good');
    UI.renderAll();
  },
  promoReq(e) {
    const n = ROLES[e.role].titles.length;
    return n === 3 ? [4, 7][e.rank] : 6;
  },
  /* null = promotion possible ; sinon raison du blocage */
  promoBlock(e) {
    const titles = ROLES[e.role].titles;
    if (e.rank >= titles.length - 1) return 'Rang maximal';
    if (e.level < this.promoReq(e)) return `Niveau ${this.promoReq(e)} requis`;
    if (e.rank + 1 === titles.length - 1 && S.team.employees.some(o => o.role === e.role && o.rank === titles.length - 1)) return 'Poste de direction déjà occupé';
    return null;
  },
  promoCost(e) { return this.salary(Object.assign({}, e, { rank: e.rank + 1 })) * 4; },
  promote(id) {
    const e = S.team.employees.find(x => x.id === id);
    if (!e || this.promoBlock(e)) return;
    const c = this.promoCost(e);
    if (S.cash < c) return UI.toast('Cash insuffisant pour la promotion.', 'bad');
    S.cash -= c;
    e.rank++;
    this.invalidate();
    Game.log(`Promotion : ${e.name} devient ${this.title(e)}.`, 'good');
    UI.toast(`🎉 ${e.name} devient ${this.title(e)}`, 'good');
    UI.renderAll();
  },

  /* Étape 4 du tick : salaires */
  paySalaries() {
    const p = this.payroll();
    S.cash -= p;
    S.last.salaries = p;
    if (S.cash < 0) {
      S.cash *= 1 + CONFIG.OVERDRAFT_RATE / 52;
      S.counters.cashNegWeeks++;
      // Salaires impayés trop longtemps : démissions
      if (S.counters.cashNegWeeks > 12 && S.counters.cashNegWeeks % 4 === 0 && S.team.employees.length) {
        const e = pick(S.team.employees);
        Game.log(`${e.name} démissionne : salaires payés sur découvert depuis trop longtemps.`, 'bad');
        this.fire(e.id, true);
      }
    } else S.counters.cashNegWeeks = 0;
  }
};

/* =============================================================================
   7. INVESTORS — clients, confiance, flux, frais
   ============================================================================= */
const INV_NAMES = {
  retail: () => (rng() < 0.5 ? 'M. ' : 'Mme ') + pick(LAST_NAMES),
  hnwi: () => 'Famille ' + pick(LAST_NAMES),
  uhnwi: () => 'Family office ' + pick(LAST_NAMES),
  institutional: () => pick(['Assurances ', 'Banque ', 'Mutuelle ', 'Fondation ']) + pick(LAST_NAMES),
  pension: () => 'Caisse de retraite ' + pick(['des enseignants', 'des ingénieurs', 'nationale', 'des cheminots', 'du Nord', 'des médecins']),
  sovereign: () => 'Fonds souverain de ' + pick(['Valoria', 'Norvalie', 'Qastar', 'Singara', 'Emirania'])
};

const Investors = {
  typeUnlocked(t) { return S.tier >= INVESTOR_TYPES[t].tier; },
  capital(inv) { return inv.shares * S.fund.navps; },
  clients() { return S.investors.list.filter(i => i.type !== 'founder'); },
  founder() { return S.investors.list.find(i => i.type === 'founder'); },

  /* Confiance globale = moyenne pondérée par le capital */
  globalConfidence() {
    let w = 0, s = 0;
    for (const i of this.clients()) { w += i.shares; s += i.shares * i.conf; }
    return w > 0 ? s / w : 55;
  },

  /* Performance annualisée glissante sur n semaines (approx. linéaire) */
  perfAnnual(n = 26) {
    const h = S.fund.navHist;
    if (h.length < 5) return 0.06;
    const weeks = Math.min(n, h.length - 1);
    const past = h[h.length - 1 - weeks];
    return clamp((h[h.length - 1] / past - 1) * 52 / weeks, -0.8, 1.5);
  },

  founderBonus() {
    const f = this.founder(), A = Portfolio.aum();
    if (!f || A <= 0) return 0;
    return Math.min(8, this.capital(f) / A * 40);
  },

  /* Multiplicateur d'attractivité : réputation, confiance, perf, ventes */
  attractiveness() {
    // Chaque levier est borné : réputation 0,5–2 ; confiance 0,6–1,4 ;
    // performance 0,5–1,6 ; ventes/CRM/paliers 1–~4,5.
    const repF = 0.5 + 1.5 * Math.pow(S.reputation / 100, 1.2);
    const confF = 0.6 + 0.8 * this.globalConfidence() / 100;
    const perfF = this.perfFactor();
    const salesF = 1 + Team.effects().inflow + Progression.upg('crm') * 0.12 + Progression.tierBonus('reach');
    const complF = S.compliance < 50 ? 0.6 : 1;
    return repF * confF * perfF * salesF * complF * CONFIG.MODES[S.difficulty].investorDemand;
  },
  perfFactor() { return clamp(1 + (this.perfAnnual(26) - 0.06) * 3, 0.5, 1.6); },
  /* Saturation : plus le fonds est gros, plus il est difficile de croître en % */
  saturation(A) { return Math.pow(1e6 / Math.max(A, 1e6), 0.15); },
  typeBonus(t) {
    if (t === 'retail') return 1 + Progression.tierBonus('retail');
    if (t === 'institutional' || t === 'pension' || t === 'sovereign') return 1 + Progression.tierBonus('institutional');
    return 1;
  },

  newInvestor(type, amount) {
    const T = INVESTOR_TYPES[type];
    const inv = {
      id: S.investors.nextId++, type, name: INV_NAMES[type](), shares: amount / S.fund.navps,
      conf: clamp(50 + rand(-8, 10) + Progression.tierBonus('clientConf') * 30, 0, 100),
      objective: T.objective + rand(-0.01, 0.02), tolerance: T.tolerance + randInt(-10, 10),
      lockupUntil: S.week + T.lockup, joined: S.week, count: 1, invested: amount
    };
    S.investors.list.push(inv);
    return inv;
  },

  /* Apport du fondateur (cash de la société -> fonds) */
  founderInvest(amount) {
    amount = Math.min(amount, S.cash);
    if (amount <= 0) return;
    S.cash -= amount;
    let f = this.founder();
    if (!f) {
      f = { id: S.investors.nextId++, type: 'founder', name: 'Vous (fondateur)', shares: 0, conf: 100, objective: 0, tolerance: 100, lockupUntil: 0, joined: S.week, count: 1, invested: 0 };
      S.investors.list.push(f);
    }
    f.shares += amount / S.fund.navps;
    f.invested += amount;
    Portfolio.deposit(amount);
    Portfolio.syncNavps();
    Game.log(`Apport du fondateur : ${fmtMoney(amount)} investis dans le fonds.`, 'good');
    UI.renderAll();
  },
  founderWithdraw(amount) {
    const f = this.founder(); if (!f) return;
    amount = Math.min(amount, this.capital(f));
    if (amount <= 0) return;
    f.shares -= amount / S.fund.navps;
    Portfolio.withdraw(amount);
    S.cash += amount;
    if (f.shares <= 1e-9) S.investors.list = S.investors.list.filter(i => i !== f);
    Portfolio.syncNavps();
    confAll(-2);
    Game.log(`Retrait du fondateur : ${fmtMoney(amount)} rapatriés dans la société (les clients le remarquent).`, 'warn');
    UI.renderAll();
  },

  /* Étape 5 du tick : frais de gestion (hebdo) et de performance (trimestriels) */
  collectFees() {
    const f = S.fund;
    const A = Portfolio.aum();
    S.last.mgmt = 0; S.last.perf = 0;
    if (A > 0) {
      const mg = A * CONFIG.MGMT_FEE / 52;
      Portfolio.withdraw(mg);
      S.cash += mg;
      S.last.mgmt = mg;
      S.stats.totalFees += mg;
      Portfolio.syncNavps();
    }
    if (S.week - f.lastPerfFeeWeek >= CONFIG.PERF_FEE_PERIOD) {
      f.lastPerfFeeWeek = S.week;
      const sh = this.totalClientShares();
      if (f.navps > f.hwm && sh > 0) {
        const rate = CONFIG.PERF_FEE * (1 + Progression.tierBonus('perfFee'));
        const fee = (f.navps - f.hwm) * sh * rate;
        Portfolio.withdraw(fee);
        Portfolio.syncNavps();
        const carry = fee * f.carry;
        S.cash += fee - carry;
        S.last.perf = fee - carry;
        S.stats.totalFees += fee - carry;
        Game.log(`Commission de performance cristallisée : ${fmtMoney(fee - carry)}${carry ? ' (carried interest versé : ' + fmtMoney(carry) + ')' : ''}.`, 'good');
      }
      f.hwm = Math.max(f.hwm, f.navps);
    }
  },
  totalClientShares() { return this.clients().reduce((a, i) => a + i.shares, 0); },

  /* Étape 6 du tick : confiance, apports, retraits, nouveaux clients */
  step() {
    const f = S.fund;
    const navps = f.navps;
    const A = Portfolio.aum();
    const att = this.attractiveness();
    const perf = this.perfAnnual(26);
    const perfF = this.perfFactor();
    const sat = this.saturation(A);
    const e = Team.effects();
    const retention = Progression.tierBonus('retention');
    const confTarget = 55 + Progression.tierBonus('clientConf') * 50 + this.founderBonus() + e.conf * 10;
    let subs = 0, reds = 0;

    // 1) Clients existants : confiance, apports et retraits
    for (const inv of this.clients()) {
      const T = INVESTOR_TYPES[inv.type];
      let d = clamp((perf - inv.objective) * 8, -1.5, 1.5);
      d += (S.reputation - 30) / 50 * 0.4;
      if (S.risk > inv.tolerance) d -= (S.risk - inv.tolerance) / 12;
      if (S.compliance < 50) d -= (50 - S.compliance) / 12;
      if (S.last.fundReturn < -0.05) d -= Math.abs(S.last.fundReturn) * 40;
      d += (confTarget - inv.conf) * 0.05;
      d *= T.fickle;
      inv.conf = clamp(inv.conf + d + gauss() * 0.8, 0, 100);

      const cap = inv.shares * navps;
      if (S.week >= inv.lockupUntil) {
        let fr = 0;
        if (inv.conf < 15) fr = 1;
        else if (inv.conf < 40) fr = (40 - inv.conf) / 40 * 0.15 * T.fickle;
        if (inv.type === 'retail') fr += 0.002;
        fr *= 1 - retention / 2;
        if (fr > 0) {
          const amt = cap * Math.min(1, fr);
          inv.shares -= amt / navps;
          reds += amt;
        }
      }
      if (inv.conf > 65 && inv.shares > 0) {
        const top = cap * (inv.conf - 65) / 35 * 0.008 * perfF * sat;
        inv.shares += top / navps;
        inv.invested += top;
        subs += top;
      }
    }
    S.investors.list = S.investors.list.filter(i => i.shares > 1e-9);

    // 2) Nouveaux clients (processus de Poisson par type)
    for (const t of Object.keys(INVESTOR_TYPES)) {
      const T = INVESTOR_TYPES[t];
      if (!this.typeUnlocked(t) || S.compliance < T.minCompliance) continue;
      const n = poisson(Math.min(20, T.rate * att * this.typeBonus(t)));
      for (let i = 0; i < n; i++) {
        let ticket = rand(T.ticket[0], T.ticket[1]) + A * T.frac * sat * rand(0.5, 1.5);
        if (A > 50000) ticket = Math.min(ticket, A * 0.3);
        this.newInvestor(t, ticket);
        subs += ticket;
      }
    }

    // 3) Application des flux au portefeuille
    if (reds > 0) Portfolio.withdraw(reds);
    if (subs > 0) Portfolio.deposit(subs);
    Portfolio.syncNavps();
    S.last.subs = subs; S.last.reds = reds;
    this.mergeSmall();
  },

  /* Regroupe les petits comptes en cohortes pour garder une liste légère */
  mergeSmall() {
    const list = S.investors.list;
    if (list.length <= 120) return;
    for (const t of Object.keys(INVESTOR_TYPES)) {
      const group = list.filter(i => i.type === t).sort((a, b) => a.shares - b.shares);
      while (group.length > 18) {
        const a = group.shift(), b = group.shift();
        const tot = a.shares + b.shares;
        const c = {
          id: S.investors.nextId++, type: t, shares: tot,
          conf: (a.conf * a.shares + b.conf * b.shares) / tot,
          objective: (a.objective + b.objective) / 2, tolerance: Math.round((a.tolerance + b.tolerance) / 2),
          lockupUntil: Math.max(a.lockupUntil, b.lockupUntil), joined: Math.min(a.joined, b.joined),
          count: a.count + b.count, invested: a.invested + b.invested, name: ''
        };
        c.name = `Cohorte ${INVESTOR_TYPES[t].short} (${c.count} clients)`;
        S.investors.list = S.investors.list.filter(i => i !== a && i !== b);
        S.investors.list.push(c);
        // réinsertion triée
        let idx = group.findIndex(g => g.shares > c.shares);
        if (idx < 0) idx = group.length;
        group.splice(idx, 0, c);
      }
    }
  }
};

/* Helpers d'effets (utilisés par les événements) */
function confAll(d) { for (const i of Investors.clients()) i.conf = clamp(i.conf + d, 0, 100); }
function addRep(d) { S.reputation = clamp(S.reputation + d, 0, 100); }
function addCompliance(d) { S.compliance = clamp(S.compliance + d, 0, 100); }
function riskShock(d) { S.riskShock += d; S.risk = clamp(S.risk + d, 0, 100); }
function payCash(x) { S.cash -= x; }
function U() { return Team.wageIndex(); } // unité de coût proportionnelle au palier
function sev() { return CONFIG.MODES[S.difficulty].eventSeverity; }
function lossAUM(pct) { const A = Portfolio.aum(); Portfolio.withdraw(A * pct); Portfolio.syncNavps(); return A * pct; }

/* =============================================================================
   8. RISK — risque, conformité, réputation, margin call, amendes
   ============================================================================= */
const Risk = {
  /* Volatilité annuelle du portefeuille (matrice de covariance du régime) */
  portfolioVol(useTarget) {
    const w = useTarget ? Object.fromEntries(RISKY.map(k => [k, S.fund.target[k] / 100])) : Portfolio.weights();
    const C = Market.corrMatrix(S.market.regime);
    const red = Team.effects().volRed;
    const sig = RISKY.map(k => Market.effVol(k) * (1 - red));
    let v = 0;
    for (let i = 0; i < RISKY.length; i++)
      for (let j = 0; j < RISKY.length; j++)
        v += w[RISKY[i]] * w[RISKY[j]] * sig[i] * sig[j] * C[i][j];
    return Math.sqrt(Math.max(0, v));
  },
  targetScore() {
    const useTarget = Portfolio.aum() <= 0;
    const vol = this.portfolioVol(useTarget);
    let r = 100 * (1 - Math.exp(-vol / CONFIG.RISK_VOL_SCALE));
    r += Portfolio.drawdown() * CONFIG.RISK_DD_WEIGHT;
    r += Math.max(0, (useTarget ? Portfolio.targetGross() / 100 : Portfolio.gross()) - 1) * CONFIG.RISK_LEVERAGE_PTS;
    if (S.cash < 0) r += 12;
    r -= Team.effects().riskPts;
    r += S.riskShock;
    return clamp(r, 0, 100);
  },
  complianceTarget() {
    const mode = CONFIG.MODES[S.difficulty];
    let c = CONFIG.COMPLIANCE_BASE - (S.tier - 1) * mode.complexityPerTier;
    c -= Math.max(0, Portfolio.gross() - 1) * 6;
    if (RISKY.some(k => S.fund.positions[k] < 0)) c -= 3;
    c += Team.effects().compliance + Progression.upg('audit') * 6 + Progression.tierBonus('compliance') * 25;
    if (S.events.flags.cyberPlan) c += 2;
    return clamp(c, 0, 100);
  },
  reputationTarget() {
    const A = Math.max(Portfolio.aum(), 1000);
    const perf = Investors.perfAnnual(52);
    let t = 15 + 7 * Math.log10(A / 1000);
    t += clamp((perf - 0.05) * 80, -15, 20);
    t += clamp((S.compliance - 60) / 4, -15, 10);
    t += S.repBonus + Progression.upg('pr') * 4;
    t *= 1 + Progression.tierBonus('rep');
    return clamp(t, 0, 100);
  },

  /* Étape 7 du tick */
  step() {
    // Risque
    S.riskShock *= 0.85;
    const tgt = this.targetScore();
    S.risk = clamp(S.risk + (tgt - S.risk) * 0.5, 0, 100);
    if (S.risk > CONFIG.RISK_MARGIN && Portfolio.aum() > 0) this.marginCall();
    else if (S.risk > CONFIG.RISK_ALERT && S.week % 4 === 0) {
      Game.log(`⚠️ Risque élevé (${Math.round(S.risk)}/100) : volatilité effective accrue.`, 'warn');
      UI.toast(`⚠️ Risque élevé : ${Math.round(S.risk)}/100`, 'warn');
    }

    // Conformité
    const ct = this.complianceTarget();
    S.compliance = clamp(S.compliance + (ct - S.compliance) * CONFIG.COMPLIANCE_SPEED, 0, 100);
    S.last.fines = 0;
    const mode = CONFIG.MODES[S.difficulty];
    if (S.compliance < 50 && S.tier >= 2 && rng() < mode.fineProb) {
      const fine = Math.max(5 * U(), Portfolio.aum() * CONFIG.FINE_RATE * (50 - S.compliance) / 10);
      S.cash -= fine;
      S.last.fines = fine;
      addRep(-2);
      Game.log(`⚖️ Amende du régulateur : ${fmtMoney(fine)} (conformité ${Math.round(S.compliance)}/100).`, 'bad');
      UI.toast(`⚖️ Amende : ${fmtMoney(fine)}`, 'bad');
    }

    // Réputation
    const rt = this.reputationTarget();
    if (rt > S.reputation) S.reputation += (rt - S.reputation) * CONFIG.REP_UP_SPEED * (1 + Progression.tierBonus('repGain'));
    else S.reputation -= (S.reputation - rt) * CONFIG.REP_DOWN_SPEED;
    S.reputation = clamp(S.reputation, 0, 100);

    // Recherche
    const g = Team.rpPerWeek();
    S.rp += g;
    S.last.rpGain = g;
  },

  /* Risque > 90 : vente forcée d'une partie des positions avec frais majorés */
  marginCall() {
    S.counters.marginCalls++;
    const fee = Portfolio.derisk(CONFIG.MARGIN_CALL_SELL, 2);
    if (S.fund.leverage > 1) S.fund.leverage = 1;
    Portfolio.normalizeTarget();
    S.riskShock = Math.min(S.riskShock, 0);
    addRep(-3); confAll(-5);
    S.risk = clamp(this.targetScore(), 0, 100);
    Game.log(`🚨 MARGIN CALL : ${fmtPct(CONFIG.MARGIN_CALL_SELL, 0)} des positions vendues de force (frais ${fmtMoney(fee)}). Levier ramené à 1x.`, 'bad');
    UI.toast('🚨 Margin call ! Ventes forcées.', 'bad');
  }
};

/* =============================================================================
   9. EVENTS — cartes à choix multiples
   -----------------------------------------------------------------------------
   prepare(s) applique les effets immédiats et renvoie des paramètres
   sérialisables (pour qu'un événement en attente survive à une sauvegarde).
   Chaque option a un coût : pas de choix dominant.
   ============================================================================= */
const EVENTS = [
  {
    id: 'flash_crash', icon: '⚡', title: 'Krach éclair',
    cond: s => s.week > 6, cooldown: 12,
    weight: s => ({ bull: 1, range: 1, bear: 2, crisis: 1.5, bubble: 2 })[s.market.regime],
    prepare(s) {
      const drop = -(0.06 + rng() * 0.04) * sev();
      Market.shock({ equities: drop, emerging: drop * 1.3, crypto: drop * 1.8, commodities: drop * 0.6, derivatives: drop * 1.5 });
      const p = { bull: 0.75, range: 0.65, bear: 0.4, crisis: 0.25, bubble: 0.5 }[s.market.regime];
      // Rebond rapide (5 sem., ~90 % de la baisse) avec probabilité p, sinon lent (15 sem., ~70 %)
      const fast = rng() < p, wk = fast ? 5 : 15, rec = fast ? 0.9 : 0.7;
      for (const [k, m] of [['equities', 1], ['emerging', 1.3], ['crypto', 1.8], ['derivatives', 1.5]]) Market.addModifier(k, -drop * m * rec * 52 / wk, wk);
      const est = clamp(p + gauss() * 0.25 * (1 - Team.infoQuality()), 0.05, 0.95);
      return { drop, est, cost: 3 * U() };
    },
    text: p => `Les marchés actions ont décroché de ${fmtPct(-p.drop)} en une séance. Vos analystes estiment la probabilité d'un rebond rapide à ${Math.round(p.est * 100)} %.`,
    options: [
      { label: 'Acheter le creux', hint: () => '+10 % d’exposition actions · risque +8', apply() { Portfolio.shiftInto('equities', 0.10); riskShock(8); } },
      { label: 'Rester investi et rassurer les clients', hint: p => `💰 −${fmtMoney(p.cost)} · 🤝 confiance +3`, apply(p) { payCash(p.cost); confAll(3); } },
      { label: 'Vendre pour protéger le capital', hint: () => '30 % des actifs risqués vendus (frais) · risque −10 · ⭐ −2 · 🤝 −2', apply() { Portfolio.derisk(0.3); riskShock(-10); addRep(-2); confAll(-2); } }
    ]
  },
  {
    id: 'crypto_bubble', icon: '🫧', title: 'Bulle crypto',
    cond: s => s.tier >= 4 && s.market.regime !== 'crisis' && s.market.regime !== 'bubble', cooldown: 60,
    weight: s => s.market.regime === 'bull' ? 2 : 0.7,
    prepare(s) {
      Market.forceRegime('bubble', randInt(8, 14), { regime: 'crisis', p: 0.55 });
      return { cost: 4 * U(), unlocked: Market.isUnlocked('crypto') };
    },
    text: p => `Les cryptomonnaies s'envolent, les actifs risqués suivent. Tout le monde parle de « nouveau paradigme ». Vos clients vous demandent pourquoi vous n'êtes pas exposé. ${p.unlocked ? '' : '(La crypto n’est pas encore débloquée : le pari se fera sur les actions.)'}`,
    options: [
      { label: 'Surfer la vague', hint: () => '+10 % d’exposition crypto/actions · risque +12 · ⭐ +2 · 🛡️ −3', apply(p) { Portfolio.shiftInto(p.unlocked ? 'crypto' : 'equities', 0.10); riskShock(12); addRep(2); addCompliance(-3); } },
      { label: 'Rester discipliné', hint: () => '🤝 confiance −4 (FOMO des clients) · ⭐ +1', apply() { confAll(-4); addRep(1); } },
      { label: 'Publier une note de recherche prudente', hint: p => `💰 −${fmtMoney(p.cost)} · 🔬 +5 · ⭐ +3 · 🛡️ +2`, apply(p) { payCash(p.cost); S.rp += 5; addRep(3); addCompliance(2); S.events.flags.cautiousNote = true; } }
    ]
  },
  {
    id: 'rate_hike', icon: '📉', title: 'Hausse surprise des taux',
    cond: s => s.week > 10, cooldown: 26,
    weight: s => s.market.regime === 'bubble' || s.market.regime === 'bull' ? 1.5 : 0.8,
    prepare(s) {
      const k = sev();
      Market.shock({ bonds: -0.03 * k, equities: -0.025 * k, emerging: -0.04 * k, crypto: -0.06 * k });
      Market.addModifier('bonds', 0.04, 26);
      Market.addModifier('equities', -0.03, 12);
      return { cost: 8 * U(), bondsW: Portfolio.weights().bonds };
    },
    text: p => `La banque centrale relève ses taux de 75 points de base. Les obligations décrochent (−3 %), les actions tanguent. Vos obligations pèsent ${fmtPct(p.bondsW, 0)} du fonds.`,
    options: [
      { label: 'Réduire la duration', hint: () => 'La moitié des obligations passe en cash (frais) · risque −3', apply() { const f = S.fund; const b = f.target.bonds; f.target.bonds = Math.round(b / 2); Portfolio.rebalance(); riskShock(-3); } },
      { label: 'Ne rien changer', hint: () => '🤝 confiance −2 (clients inquiets)', apply() { confAll(-2); } },
      { label: 'Acheter une couverture de taux', hint: p => `💰 −${fmtMoney(p.cost)} · récupère une partie de la perte · 🛡️ +1`, apply(p) { payCash(p.cost); Portfolio.deposit(Portfolio.aum() * p.bondsW * 0.03); Portfolio.syncNavps(); addCompliance(1); } }
    ]
  },
  {
    id: 'reg_probe', icon: '🔎', title: 'Enquête réglementaire',
    cond: s => s.tier >= 2, cooldown: 20,

    prepare() { return { c1: 10 * U(), c2: 20 * U(), fine: Math.max(10 * U(), Portfolio.aum() * 0.005) }; },
    text: () => `Le régulateur ouvre une enquête sur vos pratiques de valorisation et de communication commerciale.`,
    options: [
      { label: 'Coopérer pleinement', hint: p => `💰 −${fmtMoney(p.c1)} · 🛡️ +12 · ⭐ −3`, apply(p) { payCash(p.c1); addCompliance(12); addRep(-3); S.events.flags.insider = false; } },
      { label: 'Engager un cabinet d’avocats', hint: p => `💰 −${fmtMoney(p.c2)} · 60 % classement sans suite (⭐ +1), sinon amende ${fmtMoney(p.fine)} · 🛡️ −5`,
        apply(p) { payCash(p.c2); if (rng() < 0.6 + Team.effects().compliance / 100) { addRep(1); Game.log('Enquête classée sans suite.', 'good'); } else { payCash(p.fine); addCompliance(-5); Game.log(`Enquête perdue : amende de ${fmtMoney(p.fine)}.`, 'bad'); } } },
      { label: 'Minimiser l’affaire', hint: () => '🛡️ −15 · ⭐ −1 · risque de scandale ultérieur', apply() { addCompliance(-15); addRep(-1); if (rng() < 0.4) S.events.flags.insider = true; } }
    ]
  },
  {
    id: 'mass_withdrawal', icon: '🏃', title: 'Retrait massif',
    cond: s => Investors.clients().length >= 5, cooldown: 20,
    weight: s => 1 + (Investors.globalConfidence() < 45 ? 1.5 : 0),
    prepare() {
      const inv = Investors.clients().slice().sort((a, b) => b.shares - a.shares)[0];
      return { id: inv.id, name: inv.name, amount: Investors.capital(inv), cost: 5 * U() };
    },
