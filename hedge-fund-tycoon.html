          <button class="btn small danger" data-act="fire" data-id="${emp.id}">Licencier</button>
        </div>
        ${pb && pb !== 'Rang maximal' ? `<div class="small muted">Promotion : ${pb}</div>` : ''}
      </div>`;
    }).join('') || '<div class="muted">Aucun employé pour l’instant. Vous tradez seul depuis votre desk de prop firm.</div>';
    const full = S.team.employees.length >= cap;
    const cands = S.team.candidates.map(c => {
      const cost = Team.signingCost(c);
      return `<div class="card emp">
        <div class="row between"><span class="title">${ROLES[c.role].icon} ${esc(c.name)}</span><span class="pill">niv. ${c.level}</span></div>
        <div class="small accent">${Team.title(c)}</div>
        <div class="traits">${c.traits.map(t => `<span class="pill" title="${TRAITS[t].desc}">${TRAITS[t].label}</span>`).join('')}${c.spec ? `<span class="pill b">${CONFIG.ASSETS[c.spec].name}</span>` : ''}</div>
        <div class="small muted">${ROLES[c.role].effect}</div>
        <div class="kv small"><span class="muted">Salaire</span><span class="num">${fmtMoney(Team.salary(c) * 52)}/an</span></div>
        <div class="row mt"><button class="btn small primary" data-act="hire" data-id="${c.id}" ${full || S.cash < cost ? 'disabled' : ''}>Recruter (prime ${fmtMoney(cost)})</button>
        <button class="btn small" data-act="hire-eq" data-id="${c.id}" ${full || S.cash < cost / 2 ? 'disabled' : ''} title="Salaire −50 % ; en échange, 2 % des futures commissions de performance">Payer moitié en parts (prime ${fmtMoney(cost / 2)})</button></div>
      </div>`;
    }).join('') || `<div class="muted">${S.tier < 2 ? 'Personne ne rejoint un trader de prop firm : lancez votre fonds et atteignez le palier 2 (Coworking, 5 M$ d’AUM).' : 'Aucun candidat.'}</div>`;
    const roles = Object.entries(ROLES).map(([id, r]) => `<span class="pill ${Team.roleUnlocked(id) ? 'g' : ''}">${r.icon} ${r.titles[0]}${Team.roleUnlocked(id) ? '' : ' 🔒' + r.tier}</span>`).join(' ');
    return `
      <div class="grid g3">
        <div class="card"><h4>Effectif</h4>
          <div class="kv"><span class="muted">Employés</span><b>${S.team.employees.length} / ${cap === Infinity ? '∞' : cap}</b></div>
          <div class="kv"><span class="muted">Masse salariale</span><span class="num">${fmtMoney(Team.payroll())}/sem</span></div>
          <div class="kv"><span class="muted">Frais de gestion encaissés</span><span class="num">${fmtMoney(S.last.mgmt)}/sem</span></div>
          <div class="small muted mt">Salaires réels chargés : un junior coûte environ ${fmtMoney(Team.wageIndex() * 52)}/an ici. Payer « moitié en parts » divise le salaire par deux contre 2 % des commissions de performance.</div></div>
        <div class="card"><h4>Effets de l'équipe</h4>
          <div class="kv small"><span class="muted">Qualité d'information</span><span>${fmtPct(Team.infoQuality(), 0)}</span></div>
          <div class="kv small"><span class="muted">Réduction des frais</span><span>${fmtPct(Portfolio.feeReduction(), 0)}</span></div>
          <div class="kv small"><span class="muted">Réduction de volatilité</span><span>${fmtPct(e.volRed, 0)}</span></div>
          <div class="kv small"><span class="muted">Points de risque en moins</span><span>${fmtNum(e.riskPts, 1)}</span></div>
          <div class="kv small"><span class="muted">Bonus conformité</span><span>+${fmtNum(e.compliance, 1)}</span></div>
          <div class="kv small"><span class="muted">Attractivité (ventes)</span><span>+${fmtPct(e.inflow, 0)}</span></div>
          <div class="kv small"><span class="muted">Recherche</span><span>${fmtNum(Team.rpPerWeek(), 1)} 🔬/sem</span></div></div>
        <div class="card"><h4>Rôles</h4><div class="row">${roles}</div>
          <div class="small muted mt">Évolution : niveau 4 → Senior, niveau 7 → Head/Chief (un seul par entreprise). Les rôles à 2 titres passent Chief au niveau 6. Moral : un employé jamais promu, formé ou récompensé se démotive (efficacité réduite sous 50) et peut démissionner sous 30.</div></div>
      </div>
      <h3 class="mt">Votre équipe</h3>
      <div class="grid g3">${emps}</div>
      <div class="row between mt"><h3 style="margin:0">Candidats</h3><div class="row"><span class="small muted">Nouveaux profils dans ${Math.max(0, S.team.nextRefresh - S.week)} sem.</span><button class="btn small" data-act="headhunt" ${S.tier < 2 || S.cash < Team.headhunterCost() ? 'disabled' : ''}>Chasseur de têtes (${fmtMoney(Team.headhunterCost())})</button></div></div>
      ${full ? '<div class="small amber">Capacité du local atteinte : grandissez pour déménager.</div>' : ''}
      <div class="grid g3 mt">${cands}</div>`;
  },

  /* ---------- Onglet Investisseurs ---------- */
  tabInvestors() {
    const clients = Investors.clients();
    const navps = S.fund.navps;
    const byType = Object.entries(INVESTOR_TYPES).map(([id, T]) => {
      const g = clients.filter(i => i.type === id);
      const cap = g.reduce((a, i) => a + i.shares * navps, 0);
      const n = g.reduce((a, i) => a + i.count, 0);
      const conf = cap > 0 ? g.reduce((a, i) => a + i.conf * i.shares * navps, 0) / cap : 0;
      const unlocked = Investors.typeUnlocked(id);
      return `<tr class="${unlocked ? '' : 'locked'}"><td>${T.icon} ${T.name}${unlocked ? '' : ` <span class="pill a">🔒 ${T.tier}</span>`}${unlocked && S.compliance < T.minCompliance ? ' <span class="pill r">conformité ≥ ' + T.minCompliance + ' requise</span>' : ''}</td>
        <td class="num">${n}</td><td class="num">${fmtMoney(cap)}</td><td class="num">${n ? Math.round(conf) : '—'}</td>
        <td class="num">${fmtPct(T.objective, 0)}</td><td class="num">${T.tolerance}</td><td class="num">${T.lockup} sem.</td></tr>`;
    }).join('');
    const top = clients.slice().sort((a, b) => b.shares - a.shares).slice(0, 15).map(i => {
      const lock = Math.max(0, i.lockupUntil - S.week);
      const col = i.conf < 40 ? 'var(--red)' : i.conf < 60 ? 'var(--amber)' : 'var(--green)';
      return `<tr><td>${INVESTOR_TYPES[i.type].icon} ${esc(i.name)}</td><td class="num">${fmtMoney(i.shares * navps)}</td>
        <td style="min-width:90px"><div class="gauge"><div style="width:${i.conf}%;background:${col}"></div></div><span class="small num">${Math.round(i.conf)}</span></td>
        <td class="num">${fmtPct(i.objective, 1)}</td><td class="num">${i.tolerance}</td><td class="num">${lock ? lock + ' sem.' : '<span class="muted">libre</span>'}</td></tr>`;
    }).join('');
    const nextPerf = CONFIG.PERF_FEE_PERIOD - (S.week - S.fund.lastPerfFeeWeek);
    return `
      <div class="grid g3">
        <div class="card"><h4>Flux de la semaine</h4>
          <div class="kv"><span class="muted">Souscriptions</span><span class="num green">+${fmtMoney(S.last.subs)}</span></div>
          <div class="kv"><span class="muted">Rachats</span><span class="num red">−${fmtMoney(S.last.reds)}</span></div>
          <div class="kv"><span class="muted">Attractivité</span><span class="num">×${fmtNum(Investors.attractiveness(), 2)}</span></div>
          <div class="kv"><span class="muted">Confiance globale</span><span class="num">${Math.round(Investors.globalConfidence())}/100</span></div></div>
        <div class="card"><h4>Frais</h4>
          <div class="kv"><span class="muted">Frais de gestion (2 %/an)</span><span class="num">${fmtMoney(S.last.mgmt)}/sem</span></div>
          <div class="kv"><span class="muted">Commission de performance</span><span class="num">${fmtPct(CONFIG.PERF_FEE * (1 + Progression.tierBonus('perfFee')), 0)} au-delà du HWM</span></div>
          <div class="kv"><span class="muted">Prochaine cristallisation</span><span class="num">${nextPerf} sem.</span></div>
          <div class="kv"><span class="muted">NAV / HWM</span><span class="num ${S.fund.navps >= S.fund.hwm ? 'green' : 'red'}">${fmtNum(S.fund.navps, 2)} / ${fmtNum(S.fund.hwm, 2)}</span></div>
          ${S.fund.carry ? `<div class="kv"><span class="muted">Carried interest employés</span><span>${fmtPct(S.fund.carry, 0)}</span></div>` : ''}</div>
        <div class="card"><h4>Comment attirer des clients ?</h4><div class="small muted">Les apports dépendent de la réputation, de la confiance, de la performance sur 26 semaines (vs. objectifs), des Sales et du CRM. Les clients sous-performés ou exposés à un risque supérieur à leur tolérance retirent leurs fonds une fois le lock-up passé. Une conformité &lt; 50 fait fuir tout le monde.</div></div>
      </div>
      ${this.clientSection()}
      ${this.rivalSection()}
      ${this.satSection()}
      <h3 class="mt">Par type de client</h3>
      <div class="tablewrap"><table class="t"><thead><tr><th>Type</th><th>Clients</th><th>Capital</th><th>Confiance</th><th>Objectif</th><th>Tolérance risque</th><th>Lock-up</th></tr></thead><tbody>${byType}</tbody></table></div>
      <h3 class="mt">Principaux comptes</h3>
      <div class="tablewrap"><table class="t"><thead><tr><th>Client</th><th>Capital</th><th>Confiance</th><th>Objectif</th><th>Tolérance</th><th>Lock-up</th></tr></thead><tbody>${top || '<tr><td colspan="6" class="muted">Aucun client pour le moment.</td></tr>'}</tbody></table></div>`;
  },

  clientSection() {
    if (!S.prop.launched) return '';
    const big = Investors.bigClients();
    const notices = Investors.clients().filter(i => i.notice);
    const rows = notices.concat(big.filter(b => !b.notice)).map(i => `<tr><td>${INVESTOR_TYPES[i.type].icon} ${esc(i.name)}</td><td class="num">${fmtMoney(Investors.capital(i))}</td>
      <td class="num ${i.conf < 30 ? 'red' : i.conf < 50 ? 'amber' : 'green'}">${Math.round(i.conf)}</td>
      <td>${i.notice ? `<span class="pill r">${gl('Préavis de retrait', 'préavis')} : ${Math.max(0, i.notice - S.week)} sem.</span> <button class="btn small" data-act="retain" data-id="${i.id}">Retenir (${fmtMoney(Investors.capital(i) * 0.01)})</button>` : `<span class="muted small">${S.week < i.lockupUntil ? gl('Lock-up', 'lock-up') + ' ' + (i.lockupUntil - S.week) + ' sem.' : 'libre'}</span>`}</td></tr>`).join('');
    return `<h3 class="mt">🤝 Relation client (grands comptes)</h3>
      <div class="tablewrap"><table class="t"><thead><tr><th>Client</th><th>Capital</th><th>Confiance</th><th>Statut</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">Pas encore de grand compte (HNWI et au-delà).</td></tr>'}</tbody></table></div>
      <div class="small muted">Sous 15 de confiance, un grand client envoie un préavis de 4 semaines avant de tout retirer : un geste commercial (1 % de son capital) peut le retenir.</div>`;
  },
  rivalSection() {
    if (!S.rivals.length) return '';
    const t = Rivals.table(), rk = Rivals.rank();
    return `<h3 class="mt">🏆 Classement des fonds (performance sur 1 an)</h3>
      <div class="tablewrap"><table class="t"><thead><tr><th>#</th><th>Fonds</th><th>Style</th><th>Perf. 1 an</th></tr></thead><tbody>
      ${t.map((r, i) => `<tr class="${r.me ? 'cur' : ''}"><td>${i + 1}</td><td>${r.icon} ${esc(r.name)}</td><td>${r.style}</td><td class="num ${cls(r.perf)}">${fmtPct(r.perf, 1, true)}</td></tr>`).join('')}</tbody></table></div>
      <div class="small muted">${rk ? `Vous êtes ${rk}${rk === 1 ? 'er' : 'e'}. ` : ''}Top 3 : +15 % d'attractivité auprès des clients ; dernier : −10 % (après 6 mois d'historique).</div>`;
  },
  satSection() {
    if (!S.prop.launched) return '';
    const rows = S.satellites.map(x => { const T = SAT_TYPES[x.type]; return `<tr><td>${T.icon} ${T.name}</td><td class="num">${fmtMoney(x.aum)}</td><td class="num ${cls(Satellites.perf(x))}">${fmtPct(Satellites.perf(x), 1, true)}</td><td class="num">${Math.round(x.conf)}</td><td class="num">${fmtPct(T.objective, 0)}</td><td class="num ${cls(x.lastFlow)}">${fmtMoney(x.lastFlow)}</td><td><button class="btn small danger" data-act="sat-close" data-id="${x.id}">Fermer</button></td></tr>`; }).join('');
    const max = Satellites.maxCount();
    const launch = Object.entries(SAT_TYPES).filter(([id]) => !S.satellites.some(x => x.type === id)).map(([id, T]) =>
      `<div class="card"><b>${T.icon} ${T.name}</b><div class="small muted">${T.clients} · objectif ${fmtPct(T.objective, 0)}/an · allocation fixe ${Object.entries(T.w).map(([k, w]) => CONFIG.ASSETS[k].name + ' ' + fmtPct(w, 0)).join(', ')}</div>
       ${max === 0 ? '<span class="pill a">🔒 Palier 7</span>' : S.satellites.length >= max ? '<span class="pill a">🔒 2e fonds au palier 9</span>' : `<button class="btn small primary mt" data-act="sat-launch" data-k="${id}" ${S.cash < Satellites.cost() ? 'disabled' : ''}>Lancer (${fmtMoney(Satellites.cost())})</button>`}</div>`).join('');
    return `<h3 class="mt">🧩 Fonds de la société</h3>
      <div class="tablewrap"><table class="t"><thead><tr><th>Fonds</th><th>AUM</th><th>Perf. 26 sem.</th><th>Confiance</th><th>Objectif</th><th>Flux/sem</th><th></th></tr></thead>
      <tbody><tr><td>⭐ ${esc(S.fundName)} (principal)${S.strategy ? ' · ' + STRATEGIES[S.strategy].icon : ''}</td><td class="num">${fmtMoney(Portfolio.aum())}</td><td class="num ${cls(Investors.perfAnnual(26))}">${fmtPct(Investors.perfAnnual(26), 1, true)}</td><td class="num">${Math.round(Investors.globalConfidence())}</td><td>—</td><td class="num ${cls(S.last.subs - S.last.reds)}">${fmtMoney(S.last.subs - S.last.reds)}</td><td></td></tr>${rows}</tbody></table></div>
      ${launch ? `<div class="grid g2 mt">${launch}</div>` : ''}
      <div class="small muted mt">Les fonds satellites ont leur propre clientèle et leur allocation fixe ; leurs frais reviennent à la société et leur AUM compte pour les paliers et la victoire.</div>`;
  },

  /* ---------- Onglet Améliorations (+ feuille de route des locaux) ---------- */
  tabUpgrades() {
    const cards = UPGRADES.map(u => {
      const lvl = Progression.upg(u.id), c = Progression.upgradeCost(u);
      const locked = S.tier < u.tier;
      const can = c && !locked && S.cash >= c.cash && S.rp >= c.rp;
      return `<div class="card ${locked ? 'locked' : ''}">
        <div class="row between"><b>${u.icon} ${u.name}</b><span class="pill">${lvl}/${u.cost.length}</span></div>
        <div class="small muted" style="margin:6px 0">${u.desc}</div>
        ${locked ? `<span class="pill a">🔒 Palier ${u.tier}</span>` : c ? `<button class="btn small ${can ? 'primary' : ''}" data-act="upgrade" data-u="${u.id}" ${can ? '' : 'disabled'}>Acheter : ${fmtMoney(c.cash)}${c.rp ? ' + ' + c.rp + ' 🔬' : ''}</button>` : '<span class="pill g">Niveau maximal</span>'}
      </div>`;
    }).join('');
    const rows = TIERS.map((T, i) => {
      const n = i + 1, next = TIERS[i + 1];
      return `<tr class="${n === S.tier ? 'cur' : ''}"><td>${n}</td><td>${T.icon} ${T.name}</td><td class="num">${fmtMoney(T.min)}${next ? ' – ' + fmtMoney(next.min) : ' +'}</td><td>${T.local}</td><td class="num">${T.cap === Infinity ? '∞' : fmtNum(T.cap)}</td><td>${T.bonusTxt}</td><td>${T.unlocks}</td></tr>`;
    }).join('');
    const bank = `<div class="card ${Bank.available() ? '' : 'locked'}"><b>🏦 Activité bancaire</b>
      <div class="small muted" style="margin:6px 0">Placez la trésorerie de la société dans une banque : ~8 %/an en temps normal, mais des pertes sur crédits en crise (−20 %/an). Exige une conformité ≥ 70.</div>
      ${Bank.available() ? `<div class="kv small"><span class="muted">Capital</span><b class="num">${fmtMoney(S.bank.capital)}</b></div><div class="kv small"><span class="muted">Résultat/sem</span><span class="num ${cls(S.bank.lastPnl)}">${fmtMoney(S.bank.lastPnl)}</span></div>
        <div class="row mt"><button class="btn small" data-act="bank-in" data-f="0.25">Apporter 25 % du cash</button><button class="btn small" data-act="bank-out" data-f="0.5" ${S.bank.capital > 0 ? '' : 'disabled'}>Retirer 50 %</button></div>` : '<span class="pill a">🔒 Palier 12</span>'}</div>`;
    const prest = `<div class="card ${S.tier >= 15 ? '' : 'locked'}"><b>🌌 Prestige</b>
      <div class="small muted" style="margin:6px 0">Recommencez une partie avec des bonus permanents : réputation de départ +5 et clients +10 % par niveau (jusqu'à 3). Prestige actuel : ${S.prestige || 0}.</div>
      ${S.tier >= 15 ? '<button class="btn small primary" data-act="prestige">Passer au prestige</button>' : '<span class="pill a">🔒 Palier 15</span>'}</div>`;
    return `<div class="grid g4">${cards}${bank}${prest}</div>
      <h3 class="mt">Feuille de route des locaux</h3>
      <div class="small muted">Le fonds déménage automatiquement dès que l'AUM atteint le seuil du palier suivant. Pas de retour en arrière (sauf en hard mode).</div>
      <div class="tablewrap mt"><table class="t"><thead><tr><th>#</th><th>Palier</th><th>Seuil AUM</th><th>Local</th><th>Capacité</th><th>Bonus</th><th>Déblocages</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  },

  /* ---------- Onglet Analyse ---------- */
  tabAnalysis() {
    const lv = Analysis.level(), keys = Analysis.keys(), A = CONFIG.ASSETS;
    const pc = v => v === null || v === undefined ? '<span class="muted">—</span>' : `<span class="${cls(v)}">${fmtPct(v, 1, true)}</span>`;
    const sensBar = v => { const w = Math.abs(v) * 50; return `<span class="sens"><i style="left:${v >= 0 ? 50 : 50 - w}%;width:${w}%;background:${v >= 0 ? 'var(--green)' : 'var(--red)'}"></i></span>`; };
    const lock = (title, how) => `<div class="lockbox">🔒 <b>${title}</b><br><span class="small">${how}</span></div>`;

    // 1. Statistiques par actif
    const statRows = keys.map(k => {
      const st = Analysis.stats(k), L = Object.assign({ M: 0, R: 0, O: 0, S: 0 }, A[k].L);
      return `<tr><td>${A[k].icon} ${A[k].short}</td><td class="num">${pc(st.c4)}</td><td class="num">${pc(st.c13)}</td><td class="num">${pc(st.c52)}</td>
        <td class="num">${fmtPct(st.vol, 0)}</td><td class="num red">${fmtPct(-st.mdd, 0)}</td>
        <td class="num">${lv.data ? fmtNum(st.sharpe, 2) : '🔒'}</td><td class="num">${lv.data ? fmtNum(st.beta, 2) : '🔒'}</td>
        <td>${sensBar(L.M)} ${sensBar(L.R)} ${sensBar(L.O)} ${sensBar(L.S)}</td></tr>`;
    }).join('');
    // 2. Performance par régime
    const regs = Object.keys(CONFIG.REGIMES);
    const regRows = keys.map(k => `<tr><td>${A[k].icon} ${A[k].short}</td>${regs.map(r => { const p = Analysis.regimePerf(k, r); return `<td class="num">${p ? pc(p.v) : '<span class="muted">—</span>'}</td>`; }).join('')}</tr>`).join('');
    const regN = regs.map(r => { const c = S.market.regStats.equities && S.market.regStats.equities[r]; return `<th class="num">${CONFIG.REGIMES[r].icon} ${CONFIG.REGIMES[r].name}<br><span class="muted small">${c ? c.n : 0} sem.</span></th>`; }).join('');

    // 3. Carte des corrélations
    let heat;
    if (!lv.data) heat = lock('Carte des corrélations', "Débloquée par l'abonnement data premium (ou la stratégie Global macro).");
    else {
      const theo = this.corrMode === 'theo';
      const C = theo ? Market.corrMatrix(S.market.regime) : null;
      const r = {}; if (!theo) keys.forEach(k => { r[k] = Analysis.rets(k, 26); });
      const cell = (a, b) => { const v = a === b ? 1 : theo ? C[RISKY.indexOf(a)][RISKY.indexOf(b)] : Analysis.corr(r[a], r[b]);
        const bg = v >= 0 ? `rgba(248,113,113,${Math.abs(v) * 0.55})` : `rgba(96,165,250,${Math.abs(v) * 0.55})`;
        return `<td style="background:${bg};color:#fff" title="${A[a].name} / ${A[b].name} : ${fmtNum(v, 2)}">${a === b ? '' : fmtNum(v, 1)}</td>`; };
      heat = `<div class="row between"><span class="small muted">${theo ? 'Corrélations théoriques dans le régime actuel (' + CONFIG.REGIMES[S.market.regime].name + ')' : 'Corrélations observées sur les 26 dernières semaines'} · rouge = bougent ensemble, bleu = en sens inverse</span>
        <button class="btn small" data-act="corr-mode">${theo ? 'Voir les observées' : 'Voir les théoriques'}</button></div>
        <div class="tablewrap mt"><table class="heat"><tr><th></th>${keys.map(k => `<th class="v">${A[k].short}</th>`).join('')}</tr>
        ${keys.map(a => `<tr><th class="h">${A[a].icon} ${A[a].short}</th>${keys.map(b => cell(a, b)).join('')}</tr>`).join('')}</table></div>
        <div class="small muted mt">En crise, toutes les corrélations entre actifs risqués montent (la diversification disparaît), tandis que les obligations d'État deviennent un refuge.</div>`;
    }

    // 4. Contribution au risque + diversification
    let risk;
    if (!lv.risk) risk = lock('Contribution au risque & diversification', 'Débloquées par le Moteur de risque (Améliorations, palier 4).');
    else {
      const rc = Analysis.riskContrib(), dv = Analysis.diversification();
      risk = `<div class="kv"><span class="muted">Score de diversification</span><b>${Math.round(dv.score)}/100</b></div>
        <div class="kv"><span class="muted">Nombre de paris indépendants</span><span class="num">${fmtNum(dv.neff, 1)}</span></div>
        <div class="small muted">Un bon score attire davantage les clients institutionnels (jusqu'à +50 %).</div>
        <div class="tablewrap mt"><table class="t"><thead><tr><th>Ligne</th><th>Poids</th><th>Part du risque</th><th></th></tr></thead><tbody>
        ${rc.map(x => `<tr><td>${A[x.k].icon} ${A[x.k].short}</td><td class="num">${fmtPct(x.w, 0)}</td><td class="num ${x.c > x.w * 1.8 && x.c > 0.15 ? 'red' : ''}">${fmtPct(x.c, 0)}</td><td style="min-width:90px"><div class="gauge"><div style="width:${clamp(x.c, 0, 1) * 100}%;background:${A[x.k].color}"></div></div></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Portefeuille vide.</td></tr>'}
        </tbody></table></div>`;
    }

    // 5. Frontière efficiente
    let front;
    if (!lv.quant) front = lock('Frontière efficiente & allocation optimisée', 'Débloquées par un Quant dans l’équipe (palier 8) ou la stratégie Quantitatif.');
    else {
      const F = Analysis.frontier(), opt = Analysis.optimal();
      const W = 520, H = 240, pad = 34;
      const evalT = t => F.evalW(F.keys.map(k => (t[k] || 0) / 100));
      const presets = Portfolio.presets();
      const marks = [['Vous', evalT(Object.fromEntries(RISKY.map(k => [k, Portfolio.weights()[k] * 100]))), '#fff'], ['Prudent', evalT(presets.prudent.t), '#60a5fa'], ['Équilibré', evalT(presets.equilibre.t), '#34d399'], ['Dynamique', evalT(presets.dynamique.t), '#f59e0b']];
      if (opt.p) marks.push(['Optimisé', opt.p, '#e879f9']);
      const all = F.pts.concat(marks.map(m => m[1]));
      const vmax = Math.max(...all.map(p => p.vol)) * 1.05 || 0.1, rmin = Math.min(0, ...all.map(p => p.r)), rmax = Math.max(...all.map(p => p.r)) * 1.05 || 0.1;
      const X = v => pad + v / vmax * (W - pad - 10), Y = r => H - pad - (r - rmin) / (rmax - rmin || 1) * (H - pad - 10);
      front = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;background:rgba(0,0,0,.15);border-radius:8px">
        <line x1="${pad}" y1="${H - pad}" x2="${W}" y2="${H - pad}" stroke="#8b95a8" stroke-width=".5"/><line x1="${pad}" y1="0" x2="${pad}" y2="${H - pad}" stroke="#8b95a8" stroke-width=".5"/>
        <text x="${W / 2}" y="${H - 8}" fill="#8b95a8" font-size="10" text-anchor="middle">Volatilité (risque) →</text>
        <text x="10" y="${H / 2}" fill="#8b95a8" font-size="10" transform="rotate(-90 10 ${H / 2})" text-anchor="middle">Rendement prévu →</text>
        ${F.pts.map(p => `<circle cx="${X(p.vol).toFixed(1)}" cy="${Y(p.r).toFixed(1)}" r="1.6" fill="#8b95a8" opacity=".45"/>`).join('')}
        ${marks.map(([n, p, c]) => `<circle cx="${X(p.vol).toFixed(1)}" cy="${Y(p.r).toFixed(1)}" r="5" fill="${c}" stroke="#000"/><text x="${(X(p.vol) + 7).toFixed(1)}" y="${(Y(p.r) + 3).toFixed(1)}" fill="${c}" font-size="10">${n}</text>`).join('')}
      </svg>
      <div class="small muted">Chaque point gris est un portefeuille possible (prévisions actuelles de l'équipe). Les meilleurs sont en haut à gauche : plus de rendement pour moins de risque. Le préréglage « ⚙️ Optimisé » (onglet Portefeuille) reprend le meilleur rapport rendement/risque.</div>`;
    }

    return `<div class="card"><h4>Comment lire cet onglet ?</h4><div class="small muted">Chaque actif réagit à quatre <b>facteurs communs</b> : Marché, Taux, Pétrole/matières et Spéculation. Les barres de sensibilité montrent ces réactions (vert = monte avec le facteur, rouge = baisse quand il monte). Deux actifs sensibles aux mêmes facteurs sont corrélés. Les données avancées se débloquent avec la data premium, le moteur de risque et les quants.</div></div>

  onChartLoaded() {
    this.chartLoaded = true;

  updateChart() {
    if (!this.enabled || !S) return;
    this.$('navChart').setAttribute('aria-label', `${this.$('chartTitle').textContent}. NAV actuelle ${fmtNum(S.fund.navps, 2)}, AUM ${fmtMoney(Game.totalAUM())}${S.bench.def ? ', ' + Bench.name() + ' ' + fmtPct(Bench.idx(), 1, true) + ' depuis le lancement, fonds ' + fmtPct(Bench.you(), 1, true) : ''}.`);
    const h = S.history;
    // Après le lancement, l'axe repart de J0 (jour d'ouverture du fonds)
    const off = S.prop.launched ? (S.fund.launchWeek ?? h.week[0] ?? 0) : 0;
    const labels = h.week.map(w => 'J' + (w - off) * 7);
    if (this.chartLoaded && typeof window.Chart === 'function') {
      try {
        if (!this.chart) {
          const ctx = this.$('navChart').getContext('2d');
          this.chart = new window.Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [
              { label: 'NAV / part', data: h.navps.slice(), borderColor: this.accentColor(), borderWidth: 2, pointRadius: 0, tension: 0.15, yAxisID: 'y' },
              { label: 'AUM', data: h.aum.map(v => v > 0 ? v : null), borderColor: '#60a5fa', borderWidth: 1.5, borderDash: [4, 3], pointRadius: 0, tension: 0.15, yAxisID: 'y1', spanGaps: true },
              { label: 'Indice de référence', data: h.bench.slice(), borderColor: '#8b95a8', borderWidth: 1.2, pointRadius: 0, tension: 0.15, yAxisID: 'y', spanGaps: true }
            ] },
            options: {
              responsive: true, maintainAspectRatio: false, animation: false,
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { labels: { color: '#8b95a8', boxWidth: 12 } },
                tooltip: { callbacks: { label: c => c.dataset.yAxisID === 'y1' ? 'AUM : ' + fmtMoney(c.parsed.y) : c.dataset.label + ' : ' + fmtNum(c.parsed.y, 2) } }
              },
              scales: {
                x: { ticks: { color: '#8b95a8', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.04)' } },
                y: { position: 'left', ticks: { color: '#8b95a8' }, grid: { color: 'rgba(255,255,255,.05)' } },
                y1: { position: 'right', type: 'logarithmic', ticks: { color: '#60a5fa', callback: v => { const l = Math.log10(v); return Math.abs(l - Math.round(l)) < 1e-6 ? fmtShort(v) : ''; } }, grid: { drawOnChartArea: false } }
              }
            }
          });
        } else {
          this.chart.data.labels = labels;
          this.chart.data.datasets[0].data = h.navps.slice();
          this.chart.data.datasets[0].borderColor = this.accentColor();
          this.chart.data.datasets[1].data = h.aum.map(v => v > 0 ? v : null);
          this.chart.data.datasets[2].data = h.bench.slice();
          this.chart.update('none');
        }
        return;
      } catch (err) {
        this.chartLoaded = false; this.chartFailed = true;
        this.$('chartMsg').textContent = 'Graphique Chart.js désactivé suite à une erreur : repli simplifié.';
      }
    }
    if (this.chartFailed || !window.Chart) this.drawFallback();
  },
  /* Repli sans Chart.js : simple courbe sur canvas */
  drawFallback() {
    const cv = this.$('navChart');
    const wrap = cv.parentElement;
    const W = wrap.clientWidth || 600, H = wrap.clientHeight || 200;
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const d = S.history.navps, b = S.history.bench;
    if (d.length < 2) return;
    const all = b.length === d.length ? d.concat(b.filter(v => v !== null)) : d;
    const min = Math.min(...all), max = Math.max(...all), rg = max - min || 1;
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--border').trim() || 'rgba(255,255,255,.08)';
    for (let i = 0; i <= 4; i++) { const y = 10 + i * (H - 20) / 4; ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.fillStyle = '#8b95a8'; ctx.font = '11px sans-serif';
    ctx.fillText(fmtNum(max, 1), 2, 14); ctx.fillText(fmtNum(min, 1), 2, H - 6);
    if (b.length === d.length) {
      ctx.strokeStyle = '#8b95a8'; ctx.lineWidth = 1; ctx.beginPath();
      let started = false;
      b.forEach((v, i) => { if (v === null) return; const y = 10 + (1 - (v - min) / rg) * (H - 20); const x = 40 + i / (b.length - 1) * (W - 44); started ? ctx.lineTo(x, y) : ctx.moveTo(x, y); started = true; });
      ctx.stroke();
    }
    ctx.strokeStyle = this.accentColor(); ctx.lineWidth = 2; ctx.beginPath();
    d.forEach((v, i) => { const x = 40 + i / (d.length - 1) * (W - 44); const y = 10 + (1 - (v - min) / rg) * (H - 20); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  },

          const name = (this.$('fundNameIn')?.value || '').trim() || 'Phoenix Capital';
          const tut = !!this.$('tutChk')?.checked;
          const slot = Number(this.$('slotSel')?.value) || 1;
          const go = () => { this.closeModal(); Save.slot = slot; Game.newGame(d, name, tut); this.afterLoad(); Save.save(true); };
          if (Save.info(slot)) this.confirm('Nouvelle partie ?', `L'emplacement ${slot} sera écrasé.`, go); else go();
        }
      }, false);
  },
  afterLoad() {
    this.stopAuto();
    if (this.chart) { try { this.chart.destroy(); } catch (e) { /* ignore */ } this.chart = null; }
    this.applyDecor();
    this.renderAll();
    if (!S.events.pending && S.events.queue && S.events.queue.length) Events.trigger(S.events.queue.shift());
    if (S.events.pending) this.showEvent();
    else if (S.status === 'lost' || S.status === 'retired') this.showEnd(S.status === 'retired' ? 'Retraite dorée' : 'Partie terminée', 'Cette partie est terminée.', S.status === 'retired');
  },

  showSettings() {
    if (!S) return;
    const speeds = CONFIG.AUTO_SPEEDS;
    this.showModal(`<h2>⚙️ Paramètres</h2>
      <h4 class="mt">Difficulté</h4>
      <div class="diffopt">
        <label><input type="radio" name="sdiff" value="casual" ${S.difficulty === 'casual' ? 'checked' : ''}><b>Casual</b></label>
        <label><input type="radio" name="sdiff" value="intermediate" ${S.difficulty === 'intermediate' ? 'checked' : ''}><b>Intermédiaire</b></label>
      </div>
      <div class="small amber">⚠️ Changer de difficulté en cours de partie modifie la volatilité, les événements et la conformité. Passer en casual ferme levier et positions courtes.</div>
      <h4 class="mt">Apparence</h4>
      <div class="row"><label for="themeSel">Thème</label><select id="themeSel">${Object.entries(this.THEMES).map(([k, v]) => `<option value="${k}" ${this.theme() === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <h4 class="mt">Accessibilité</h4>
      <div class="row"><label for="sizeSel">Taille du texte</label><select id="sizeSel"><option value="normal" ${(this.a11y().size || 'normal') === 'normal' ? 'selected' : ''}>Normale</option><option value="large" ${this.a11y().size === 'large' ? 'selected' : ''}>Grande (+15 %)</option><option value="xlarge" ${this.a11y().size === 'xlarge' ? 'selected' : ''}>Très grande (+30 %)</option></select></div>
      <label class="row"><input type="checkbox" id="cbChk" ${this.a11y().cb ? 'checked' : ''}> Palette adaptée au daltonisme (bleu / orange au lieu de vert / rouge)</label>
      <h4 class="mt">Options</h4>
      <label class="row"><input type="checkbox" id="tutSet" ${S.tutorial && S.tutorial.on ? 'checked' : ''}> 🎓 Tutoriel guidé (phase prop firm)</label>
      <label class="row"><input type="checkbox" id="repChk" ${S.showReports ? 'checked' : ''}> Afficher automatiquement le rapport trimestriel</label>
      <label class="row"><input type="checkbox" id="hardChk" ${S.hardMode ? 'checked' : ''}> Hard mode : rétrogradation de palier si l'AUM tombe sous 50 % du seuil</label>
      <div class="row mt"><label for="speedSel">Vitesse de l'avance auto</label><select id="speedSel">${Object.keys(speeds).map(k => `<option value="${k}" ${(this.autoSpeed || 'normal') === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
      <h4 class="mt">Partie</h4>
      <div class="row"><button class="btn" data-modal="save">💾 Sauvegarder</button><button class="btn" data-modal="load">📂 Emplacements, export / import</button><button class="btn danger" data-modal="reset">🗑️ Recommencer (reset)</button></div>
      <div class="row mt"><button class="btn primary" data-modal="apply">Appliquer</button><button class="btn" data-modal="close">Fermer</button></div>`,
      {
        apply: () => {
          const d = document.querySelector('input[name=sdiff]:checked')?.value;
          S.hardMode = !!this.$('hardChk')?.checked;
          S.showReports = !!this.$('repChk')?.checked;
          const tOn = !!this.$('tutSet')?.checked;
          if (!S.tutorial) S.tutorial = { on: false, step: 0, mark: 0, preset: false };
          if (tOn && !S.tutorial.on && !S.prop.launched) { S.tutorial.on = true; S.tutorial.step = 0; } else if (!tOn) S.tutorial.on = false;
          this.autoSpeed = this.$('speedSel')?.value || 'normal';
          this.applyA11y({ size: this.$('sizeSel')?.value || 'normal', cb: !!this.$('cbChk')?.checked });
          const th = this.$('themeSel')?.value; if (th && th !== this.theme()) this.applyTheme(th);
          this.closeModal();
          if (d && d !== S.difficulty) this.confirm('Changer la difficulté ?', `Passer en ${CONFIG.MODES[d].label} en cours de partie. Continuer ?`, () => Game.setDifficulty(d));
          this.renderAll();
        },
        save: () => Save.save(false),
        load: () => this.showSlots(),
        reset: () => this.confirm('Recommencer ?', 'La partie en cours et sa sauvegarde seront effacées (le bonus legacy est conservé).', () => { Save.clear(); this.showStart(false); })
      });
  },

  /* ---------- Avance automatique (désactivée par défaut) ---------- */
  toggleAuto() { if (this.autoTimer) this.stopAuto(); else this.startAuto(); this.renderHeaderStats(); },
  startAuto() {
    if (!S || S.status !== 'playing') return;
    const ms = CONFIG.AUTO_SPEEDS[this.autoSpeed || 'normal'];
    this.autoTimer = setInterval(() => {
      if (this.modalOpen || !S || S.status !== 'playing' || S.events.pending) { this.stopAuto(); this.renderHeaderStats(); return; }
      Game.tick();
    }, ms);
  },
  stopAuto() { if (this.autoTimer) { clearInterval(this.autoTimer); this.autoTimer = null; } }
};

/* =============================================================================
   14. MAIN — démarrage
   ============================================================================= */
function boot() {
  UI.init();
  UI.showStart(Save.exists());
  // Si Chart.js est déjà chargé (cache) ou n'arrive pas en 6 s, on bascule proprement
  if (window.Chart) UI.chartLoaded = true;
  setTimeout(() => { if (!window.Chart && !UI.chartFailed) UI.onChartFailed(); }, 6000);
  window.addEventListener('resize', () => { if (S && !UI.chartLoaded) UI.drawFallback(); });
}
document.addEventListener('DOMContentLoaded', boot);

/* Accès console / tests automatisés */
window.HFT = { get S() { return S; }, Bench, Calendar, Hedges, Rivals, Bank, Prestige, Tutorial, Analysis, Quarter, Opps, Satellites, Achievements, Milestones, Game, Market, Portfolio, Team, Investors, Risk, Events, Progression, Save, UI, CONFIG, RNG, Prop, TIERS, UPGRADES, ROLES, INVESTOR_TYPES, EVENTS };
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" async onload="UI.onChartLoaded()" onerror="UI.onChartFailed()"></script>
</body>
